schemaVersion: arris/v1
revision: 12
treatment: tinted-clean
flow: down
nodes:
  born: {type: start}
  active: {type: state, label: Active — generation N, description: "status: active · continuities.activeHostSessionId points here", tone: ok}
  starting: {type: state, label: Starting, description: runtime.created — broker invocation starting, tone: info}
  ready: {type: state, label: Ready, description: idle — no active run, tone: ok}
  busy: {type: state, label: Busy, description: turn.started — runtime owns the active run, tone: info}
  awaiting: {type: state, label: Awaiting input, description: "open ask bracket — the durable ledger is the authority, never the pane", tone: warn}
  terminated: {type: state, label: Terminated, description: intentional — /quit · operator terminate · idle cleanup}
  crashed: {type: state, label: Crashed, description: abnormal invocation terminal — no user-exit evidence, tone: danger}
  stale: {type: state, label: Stale, description: "presumed gone, unproven — 24h aging · lease lost on restart", tone: warn}
  dead: {type: state, label: Dead, description: substrate proven missing, tone: danger}
  archived: {type: state, label: Archived, description: "prior generations — a view filter, not a resume gate"}
  gone: {type: end, label: dormant}
  reaper-note: {type: note, label: "Reaper doctrine: an open ask bracket outranks every status branch. A live pane is 'suspect' — mutate nothing."}
  barrier-note: {type: note, label: "Resume barriers: continuation dropped · context cleared w/ drop · terminate w/ drop · broker continuation.cleared. The 24h auto-rotate is deliberately NOT a barrier."}
groups:
  session: {label: Session — one durable continuity per scope+lane, children: [active, runtime]}
  runtime: {label: Runtime — broker in leased tmux, children: [liveloop, endings], flow: down}
  liveloop: {label: Live, children: [starting, ready, inflight], flow: right}
  inflight: {label: Turn in flight, children: [busy, awaiting, reaper-note], flow: right}
  endings: {label: Runtime endings — reachable from any live state; the session survives, children: [crashed, terminated, stale, dead], flow: right}
edges:
  summon: {from: born, to: active, label: hrc start · hrcchat DM}
  dispatch: {from: active, to: starting, label: a dispatch provisions a runtime}
  boot: {from: starting, to: ready, label: invocation.ready}
  turn-start: {from: ready, to: busy, label: turn.started}
  turn-done: {from: busy, to: ready, label: turn.completed · turn.failed}
  ask-open: {from: busy, to: awaiting, label: ask tool opens the bracket}
  ask-close: {from: awaiting, to: busy, label: turn.input_resumed — same turn}
  graceful: {from: ready, to: terminated, label: user exit / cleanup}
  crash: {from: busy, to: crashed, label: abnormal terminal, tone: danger}
  crash-start: {from: starting, to: crashed, label: invocation dies before ready, tone: danger}
  age: {from: ready, to: stale, label: 24h aging · liveness unproven, tone: warn}
  proven: {from: stale, to: dead, label: probe proves substrate missing}
  reprovision: {from: terminated, to: starting, label: next dispatch provisions afresh, line: dashed}
  rotate: {from: active, to: active, label: rotate — generation N+1}
  supersede: {from: active, to: archived, label: rotation archives prior}
  resume: {from: archived, to: active, label: resume — newest unbarred continuation, tone: ok}
  barred: {from: archived, to: gone, label: continuations barred}
  reaper-ref: {from: reaper-note, to: awaiting, line: dashed}
  barrier-ref: {from: barrier-note, to: archived, line: dashed}
