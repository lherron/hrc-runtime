[package]
name = "hrc-native"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "rusthrc"
path = "src/main.rs"

[dependencies]
hrc-store = { path = "../hrc-store" }
serde_json.workspace = true
chrono.workspace = true
anyhow = "1"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
libc = "0.2"

[build-dependencies]
serde_json.workspace = true
