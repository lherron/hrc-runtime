# Git hooks configuration
# Install: lefthook install
# Docs: https://github.com/evilmartians/lefthook

pre-commit:
  parallel: false
  commands:
    gitleaks:
      run: gitleaks protect --staged --redact
    lint:
      run: bun run lint
      stage_fixed: true
    boundaries:
      run: bun scripts/check-boundaries.ts
    manifests:
      run: bun scripts/check-manifest-edges.ts
    cli-surface:
      run: bun scripts/check-cli-surface.ts
    public-surface:
      run: bun scripts/check-public-surface.ts
    suppressions:
      run: bun scripts/check-suppressions.ts
    typecheck:
      run: bun run build && bun run typecheck

pre-push:
  parallel: false
  commands:
    install:
      run: bun install
    test:
      # TMPDIR=/tmp is load-bearing on macOS: the default
      # /var/folders/.../T/ prefix is 49 chars, which puts hrc-server's test
      # sockets at ~96 of the 104-char sun_path limit. The longest-named
      # fixtures cross it, so the gate fails on a CLEAN tree (8/2401 on
      # 2026-08-21) and the failure set drifts as fixtures are renamed.
      run: TMPDIR=/tmp bun run test:fast
