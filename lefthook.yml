# Git hooks configuration
# Install: lefthook install
# Docs: https://github.com/evilmartians/lefthook

min_version: "2.1.10"

pre-commit:
  parallel: false
  commands:
    gitleaks:
      run: gitleaks protect --staged --redact
    # Unconditional, not run-if-code-changed: it reads one staged blob, and a
    # gate that refuses poisoned shared history must not depend on a
    # changed-scope heuristic to decide whether to look (T-07412).
    lock-hygiene:
      run: bun scripts/check-lock-hygiene.ts
    # Unconditional, and deliberately not wrapped: it costs ~20ms, and it is the
    # ONLY gate that grades `architecture/` — `test:fast` never loads a record
    # and Biome parses neither .yaml nor .jsonl. Those paths are in `.hookignore`
    # precisely so they stop buying the code suites, so the check that does apply
    # to them must not sit behind the same scope heuristic that skips those.
    architecture-records:
      run: bun scripts/check-architecture-records.ts
    lint:
      run: bun scripts/run-if-code-changed.ts pre-commit -- bun run lint
      stage_fixed: true
    boundaries:
      run: bun scripts/run-if-code-changed.ts pre-commit -- bun scripts/check-boundaries.ts
    manifests:
      run: bun scripts/run-if-code-changed.ts pre-commit -- bun scripts/check-manifest-edges.ts
    dependency-pins:
      run: bun scripts/run-if-code-changed.ts pre-commit -- bun scripts/check-dependency-pins.ts
    public-surface:
      run: bun scripts/run-if-code-changed.ts pre-commit -- bun scripts/check-public-surface.ts
    suppressions:
      run: bun scripts/run-if-code-changed.ts pre-commit -- bun scripts/check-suppressions.ts
    typecheck:
      run: bun scripts/run-if-code-changed.ts pre-commit -- sh -c 'bun run build && bun run typecheck'

pre-push:
  parallel: false
  piped: true
  # Keep the hook alive for deleted paths, which Lefthook omits from push_files.
  files: printf 'lefthook.yml\n'
  commands:
    # These checks read the checkout and leave the hook's stdin to the push fact.
    lock-hygiene:
      priority: 1
      run: bun scripts/check-lock-hygiene.ts
    # Same reasoning as pre-commit: the gate that actually applies to the paths
    # `.hookignore` excuses runs on every push, ahead of the suites it replaces.
    architecture-records:
      priority: 2
      run: bun scripts/check-architecture-records.ts
    # The Cargo leg runs in post-push verify on mini. Report the ref updates.
    git-push-fact:
      priority: 3
      use_stdin: true
      run: bun scripts/record-git-push.ts {0}

post-commit:
  commands:
    wrkp-git-commit:
      run: 'wrkp="$HOME/.local/bin/wrkp"; [ -x "$wrkp" ] && "$wrkp" git commit || true'
