name: Test observability

on:
  schedule:
    - cron: '0 15 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Collect per-file duration and retry history
        run: bun scripts/test-observability.ts --output "$RUNNER_TEMP/test-observability.json" --retries 1
      - name: Upload timing and flake report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-observability-${{ github.run_id }}
          path: ${{ runner.temp }}/test-observability.*
          retention-days: 90
