  subscriptions/projections contracts. No builds, tests, installs, service
  operations or implementation grades were performed for this ruling.
  2026-10-20 r3.3 scoped amendment approved by reading HRC d04a6f9d's
  declaration request/parser, daemon placement and intent assembly, route
  registration, exact/suffix request hashes, claim replay and receipt code;
  compared ACP buildMobileStartRequest and the mail injector's by-scope call.
  No build, test, install or service commands were run; the five summon
  implementation gates remain unverified by this ruling.
  2026-10-22 T-11490 bounded preview-context amendment approved by reading
  section 4.3 and task specification etag 5 against route dispatch, the
  no-scope local routing path, event filter parsing, SQL filter-before-limit
  tail transaction, and kernel selection/bootstrap/apply code. Compared
  hrc-ios HRCMobile/Sources/GatewayClient/HrcEventPreview.swift matching and
  formatting and HRCMac's exact-generation recent-event lookup. No build,
  test, install or service commands were run for this design ruling;
  implementation acceptance remains the requester's work.
  2026-10-22 T-11496 seat.restart amendment approved by reading section
  4.6.2 and task specification etag 4 against existing route registration,
  request/response types, freshness and broker-idle refusals, rotation and
  post-commit launch handling, owner-HTTP error mapping, asynchronous adapter
  work and scope/lane projection keys. The existing endpoint's probe-to-dispose
  and concurrent-rotation risks are inherited unchanged; this ruling grants
  no serialization guarantee. No builds, tests, installs or service commands
  were run; implementation acceptance remains the requester's work.
  2026-10-22 T-11490 display-selection amendment in EN-33174 and task
  specification etag 13 approved by source/contract reading. F1 from
  EN-33162 is closed: prefix filtering plus incarnation-fenced reverse
  paging no longer mistakes category turn for eventKind turn.*. Reviewed
  the category map, exact filter parsing, tail limit-plus-one/truncated and
  exclusive-before query, mismatch refusal, and current raw freshness sources.
  No build, test, install or service commands were run; the new black-box
  cases and live before/after samples remain implementation acceptance.
  2026-10-23 M1/P0 design approved in EN-33646/EN-33680 by source and
  draft inventory review; adopts isolated development and cohesive owner
  transfer while preserving delivered predicates. No behavior, install or
  service validation is implied; P0 and later package gates remain open.
  2026-10-23 T-11538 policy approved by reading HrcApi, HrcApiLedger,
  projection/preview, spill helper, active contracts and supplied replay.
  Read-only artifact inspection confirms the preserved 10217-byte page hash
  and one lone low surrogate at rows/0/payload/result/content/0/text. Supplied
  replay-before records cursor 3101357 with source_unavailable on row 3101358;
  this is requester evidence, not a test run by the reviewer. No builds,
  tests, installs or service operations were run; recovery remains unverified.
reopen_when: >
  Migration authority, repository or release boundaries, execution ownership or
  rollback completeness, schema ownership, stage prerequisites, page coverage
  or incarnation semantics, pinned read set, projection state ownership,
  context source, attach source, restart behavior or consolidation trigger
  changes; or projection Unicode recovery paths, strict identity/key handling,
  durable JSON preservation or the spill pair-cut compatibility delta
  changes; or the stage-1b no-TypeScript-growth rule, summon request/receipt,
  restart request/receipt, daemon authority, retry or cancellation semantics
  or unsupported cases change.
