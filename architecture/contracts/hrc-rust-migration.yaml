validation_scope: >
  T-12067's folded implementation supplies section 8.1 item 10's four
  product gates: Loggia attach and cold summon without an hrc-kernel
  process on max3; wire_suite.py against a scratch daemon's kernel socket;
  kq.py status on svc and hrcdev without Loggia; and max3 restart recovery
  with a new host_incarnation and recorded rebuild time. Before landing,
  item 7's x1 open-100/close/open-100/close measurement resolves T-11449:
  second-cycle growth blocks the fold pending a cardo fix; measured
  subscriber memory is recorded, not assumed established by this review.
  Item 6's runtime panic audit covers hrc-domain and called presentation
  mappers, converting data-dependent panics to projector errors. Existing
  declaration/fixture tests cover same-commit omissions; there is no
  separate release-skew gate. Folded restart replaces the historical
