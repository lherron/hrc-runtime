predicate: >
  HRC embeds cardo-runtime as a library and retains ownership of its durable
  store, lifecycle ledger, HTTP API, federation and broker lifecycle. Rust
  crates and TypeScript packages share one repository and release identity;
  they meet through explicit API, wire and store contracts, not cross-imports.
  Stage 1 adds a Rust kernel reading only HRC's pinned side-effect-free HTTP
  read set. It never opens state.sqlite, reconciles substrate liveness or
  writes HRC state. Its single hrc document is rebuildable, durability none
  and ingest_only, with seat, runtime and project observation nodes. Seats
  are keyed by scope and lane, take the latest selected generation, and
  follow the live-runtime-or-24-hour-activity membership rule. Runtime fields
  in stage 1 are narrowed to the presentation read model as specified in
  section 4.3, including its additive persisted contextReading field.
  LedgerIngest and SeatProjector re-read current state for event-named keys;
  events are not folded into a second record. The ten-minute resync repairs
  keys whose events were deleted unread; live_until handles time expiry.
  HRC restart resumes the surviving kernel's document cursor within the same
  ledger incarnation. Kernel restart opens empty and bootstraps. Incarnation
  replacement resets and rebuilds through cardo ingest. The bounded event
  stream supplies wake hints only, never ledger content or scan coverage.
  The additive GET /v1/events/page route requires afterSeq and limit and
  optionally accepts ledgerIncarnationId. An omitted incarnation discovers
  the current ledger; a supplied mismatch refuses CURSOR_INVALID. One read
  transaction returns ledgerIncarnationId, head, rows and scannedThrough.
  Rows ascend by hrc_seq, number at most limit, and include every existing
  row in (afterSeq, scannedThrough]. A full page ends at its last row; a
  short page scans through head. Head comes from sqlite_sequence and never
  regresses within an incarnation. Payloads are returned as stored, including
  spill stubs, without dropping a row for size. The adapter uses floor zero
  and has no must-see retention authority. This page contract is separate
  from hrc-runtime.bounded-lifecycle-event-observation's bounded tail and
  lossy live stream; their existing admission and loss semantics are unchanged.
  The pinned state reads are sessions, latest-by-session, presentation
  runtimes and the keyed presentation seats read, plus the page route and
  bounded-stream wake. latestEvent selects the newest turn.* event by hrcSeq
  in the selected hostSessionId and generation, at or below the newest raw
  owner event's seq. Bookkeeping cannot displace that display event. A
  generation without a turn has no latestEvent and inherits no older preview.
  lastHrcSeq, lastActivityAt, membership and cursor progress retain their
  existing raw-event sources and freshness exclusions. Bootstrap, apply and
  resync may recover display selection through GET /v1/events/tail with exact
  hostSessionId and generation, category turn and limit 10 per page. Since
  that category includes broker.turn.origin and command_run.*, filter the
  turn. eventKind prefix locally and ignore candidates newer than the raw
  event. Select the newest eligible turn on the first page containing one.
  If none exists and truncated is true, request an older page using the
  minimum admitted seq as beforeHrcSeq and the returned ledgerIncarnationId.
  The reverse cursor strictly decreases; stop on a real turn or exhausted
  history. Incarnation mismatch fails the read, never proves no turn.
  Ten bounds each page, not the complete search. For a selected tool result,
  a separate unfiltered tail with that exact hostSessionId and generation
  and limit 10 supplies formatting context only, fenced at the selected
  turn's seq; it changes no display selection, activity, membership or cursor.
  Optional nonempty latestEvent.preview follows HRCMac HrcEventPreview
  formatting: matching tool-use ID aliases, nearest preceding same-run call when the ID is absent, payload
  and tool-name fallback when no matching call is in the window, whitespace
  collapse, result prefixes and 180-character truncation. Context is read
  during bootstrap, apply and resync, never retained as projection state.
  The window is bounded context, not a promise to recover calls outside it.
  No HRC server behavior or activation changes with this extension.
  Neither /v1/runtimes nor /v1/attach is in that set. Attach descriptors use
  the presentation row's HRC-resolved socketPath and attachTarget; an absent
  tmux block refuses resource_unavailable. The kernel does not parse hosting-state variants.
  Stage 1b owner-API operations remain a separate step after the read-only
  gates. Stages 1 and 1b are a facade over the complete TypeScript daemon;
  stage 1b adds no TypeScript code or HRC features. An operation requiring
  unavailable daemon behavior waits for its native stage-2 slice. The three
  additive stage-1 reads already landed are retained. The approved first
  operation is seat.summon in section 4.6.1: a kernel operation with no
  document_id and fences_on none, accepting a project- and task-qualified
  main-lane session_ref, fresh and caller-minted request_id. It calls the
  existing POST /v1/declarations/resolve by-scope arm with task run mode,
  interactive true and headless preferred mode, retains the returned intent
  and adds the requested session correlation. It resolves no paths itself.
  It then calls existing POST /v1/runtimes/start with reject for fresh false
  or suffix for fresh true, implicit summon intent, reuse_pty restart style
  and idempotencyKey hrc-kernel-summon-<request_id>. HRC retains placement,
  federation, claim, occupancy and durable request-hash/replay authority;
  its refusals, including occupied, conflicting-key and superseded-claim
  outcomes, remain refusals. The kernel does not retry. The receipt carries
  session_ref from the returned claim, host_session_id, runtime_id, status
  and replayed. Summon returns no attach descriptor and writes no projection
  rows; ingest supplies them. The caller owns the existing-seat attach check
  and follows the claimed natural key. Remote-homed attachment, socket-down
  recovery and coordination of concurrent summoners remain unsupported;
  remote starts can succeed without producing a local attachable row.
  The seat.restart amendment in section 4.6.2 adds a kernel-scoped operation
  with fences_on none, accepting host_session_id and expected_generation.
  It calls existing POST /v1/sessions/restart once with hostSessionId and
  expectedGeneration, never force. HRC owns the semantic generation fence,
  idle/busy check, rotation and launch. Refusals preserve HRC code/message.
  The receipt carries prior_host_session_id, host_session_id, generation and
  launch, including committed rotation with launch.status failed. No retry,
  Cardo idempotency receipt, attach descriptor or projection writes occur;
  ingest updates the existing scope/lane seat natural key. Cancellation
  cannot undo the mutation and requires readback. The other three proposed
  operations remain outside this approval.
  During stage 2 the route table owns slice routing, exactly one process
  serves each route family and sweep loop, and the TypeScript daemon remains
  complete until stage 3. Unported slices change in TypeScript; ported slices
  change in both implementations and are done only after both pass the same
  black-box conformance. Shared contracts, conformance and schema changes
  require both validation legs. M1's route-by-state inventory and the S1
  contract and conformance population remain prerequisites before stage 2
  starts, as stated in the approved proposal; its slice table is provisional.
  TypeScript owns schema migrations until retired everywhere, and Rust
  refuses a store newer than its known schema. Rust takes migration ownership
  only after retirement. Install, activation, fleet identity and restart
  authority retain their existing contracts. Broker consolidation and its
  process-count benefit remain deferred behind the G0 restart finding.
