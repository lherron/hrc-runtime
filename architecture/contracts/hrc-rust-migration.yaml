validation_scope: >
  The requester supplies section 4.8 gates: side-effect-free read-set tests
  against a dead-substrate seed with the mutating runtime-list control;
  ascending page coverage through holes and spill stubs with incarnation
  mismatch refusal; F7 discovery, query, replay and resources; equality of
  rebuilt and live projections after resync and ACP phase/context parity; stable
  seat-row reattachment through restart; HRC cursor resume without rebuild;
  and current live-set recovery after kernel restart. A5 is recorded, not
  gated, with heavy legs isolated from the live daemon. For seat.summon the
  requester supplies section 4.6.1's five gates: empty packages/ diff from
  dispatch base to landing; cold-seat start and ingest attachment with one
  start for the request identity; same-key retry yielding one runtime, the
  same claim and replayed true; suffix claim on a roster lane; and harness,
  project-root and cwd parity with the CLI dry-run for the cold-seat scope.
  For T-11490 the requester supplies real-payload preview fixtures, matching
  and absent-context fallbacks, wrong-ID and generation isolation, bookkeeping
  suppression, truncation, and black-box kernel checks of the exact bounded
  tail requests and projected preview, including bootstrap/apply recovery,
  more than ten category-turn bookkeeping rows requiring reverse pagination,
  raw freshness preservation and generation clearing. Before/after 60-second
  busy-seat samples compare projected previews with keyed owner raw-kind
  and seq observations as requested in EN-33155. Live
  query and Development Sessions screenshot establish the product claim.
  The side-effect-free read-set obligation includes this tail read.
  For T-11496 the requester supplies section 4.6.2's captured real restart
  request/response fixtures, malformed-input and committed-launch-failure
  mapping, black-box typed-refusal and stale-fence checks, no caching or
  retry, responsive reads, installed discovery, same-seat generation advance
  on a throwaway seat and captured real busy-seat refusal. Activation stops
  only the Loggia-supervised kernel, not HRC.
  For T-11538 the requester supplies exact captured-page actual-kernel replay
  before/after and a scratch production-shaped stream carrying that page then
  a later valid seat event, with prompt seat/cursor observation and no resync.
  Controls cover lone high/low units, valid pairs, nested admitted display,
  literal backslash-u, malformed syntax/UTF-8/structure, strict unknown fields,
  keys and identity collision rejection, ordered complete rows, producer head
  and tail pair cuts, genuine lone units and preserved historical excerpts.
  Full just verify and the relevant Rust gate precede pushed source-ready
  delivery. Canonical install and authorized activation remain separate from
  live acceptance: cursor advancement beyond the poison row to current head
  and prompt fresh-seat projection. These gates are not claimed passed here.
  Stage 2 requires P0 executable inventory closure, real standalone Bun
  baseline, discriminating missing-route/field/duplicate-effect/wrong-owner
  controls, explicit downstream gaps and isolated real ASP/wrkq/broker
  evidence. Component gates require both-implementation compatibility and
  native ownership discriminators. P8 requires forward/reverse same-history
  owner transfer with one executor for every ingress/controller/job and
  named compatible Bun fallback. Worktree checks, canonical installed
  acceptance and independent grading remain separate. These are future
  implementation obligations, not successful runtime evidence.
