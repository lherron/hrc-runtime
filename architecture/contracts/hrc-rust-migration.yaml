kernel_fold_amendment:
  task: T-12067
  task_slug: hrc-kernel-fold
  revision: 1e5109af
  proposal: docs/proposals/hrc-rust-migration.md section 8.1
  status: design approved by Daedalus 2026-10-29 in EN-38698; implementation and activation unverified
  authority: Lance's 2026-10-29 ruling that HRC embeds its kernel (no single-process cardo platform)
  boundary: kernel runs inside the owner rusthrc; hrc-kernel process, crate and install gate retire; brokers, aspc and injector unmoved
predicate: >
  HRC embeds cardo-runtime as a library and retains ownership of its durable
  store, lifecycle ledger, HTTP API, federation and broker lifecycle. Rust
  crates and TypeScript packages share one repository and release identity;
  they meet through explicit API, wire and store contracts, not cross-imports.
  T-12067 adopts migration section 8.1's folded kernel as the target:
  only an execution-owner rusthrc hosts the kernel at hrc-kernel.sock;
  front-mode rusthrc starts none. The hrc-kernel process, crate and candidate
  kernel install gate retire. Projector reads use their own process-lifetime
  read-only state.sqlite connection, with one read transaction per ingest
  step, never the daemon's Mutex<Store>, and shared hrc-store mappers.
  The daemon's ledger watch supplies non-blocking wake hints, with a
  ten-second ingest backstop and ten-minute resync. Owner operations enter
  the existing dispatch route table through call_local on tokio tasks,
  preserving accounting, federation and ledger-commit wake behavior;
  hrcpty resource.attach uses that same dispatch. The owner may wait on
  daemon code; daemon code never calls the kernel synchronously while
  serving. Startup and shutdown use cardo-runtime-tokio; wire acceptance
  is readiness and bootstrapping reports projection catch-up. A startup
  error logs kernel.start_failed and HRC serves without a kernel. Owner,
  ingest and worker panic policy is process-fatal, exit 101; the kernel
  shares rusthrc's restart and rebuilds under a new host_incarnation.
  Per-node first activation sets Loggia to attach-only and stops the legacy
  kernel with process absence readback before installing and restarting
  rusthrc. Legacy and folded lock filenames differ; folded startup does
  not detect a running legacy holder. That overlap is unsupported, as are
  a second kernel process, independent kernel restart and a kernel on a
  Bun-owned node. Brokers, aspc and injector remain external.
  Before this fold lands, stage 1's separate kernel remains the delivered
  implementation. Since f99c8878 it projects from HRC's native
  ledger through its own read-only state.sqlite connection and sends owner
  operations to the daemon over HTTP. It never reconciles substrate liveness
  or writes HRC state. Its single hrc document is rebuildable, durability none
  and ingest_only, with seat, runtime and project observation nodes. T-12183
  r1.1 adds generation and annotation observations under the producer contract
  hrc-runtime.seat-annotations, preserving folded seat fields and adding only
  activeGeneration to the seat payload. Keyed relations, archived-generation
  membership, annotation subject lifetime and the annotation owner operations
  are governed there. The existing runtime and project payloads are unchanged.
  Seats are keyed by scope and lane, take the latest selected generation, and
  follow the live-runtime-or-24-hour-activity membership rule. Runtime fields
  in stage 1 are narrowed to the presentation read model as specified in
  section 4.3, including its additive persisted contextReading field.
  LedgerIngest and SeatProjector re-read current state for event-named keys;
  events are not folded into a second record. The ten-minute resync repairs
  keys whose events were deleted unread; live_until handles time expiry.
  Before the fold, HRC restart resumes the surviving kernel's document cursor
  within the same ledger incarnation. After the fold, HRC restart is also
  kernel restart: it opens empty and bootstraps. Incarnation
  replacement resets and rebuilds through cardo ingest. The bounded event
  stream supplies wake hints only, never ledger content or scan coverage.
  The additive GET /v1/events/page route requires afterSeq and limit and
  optionally accepts ledgerIncarnationId. An omitted incarnation discovers
  the current ledger; a supplied mismatch refuses CURSOR_INVALID. One read
  transaction returns ledgerIncarnationId, head, rows and scannedThrough.
  Rows ascend by hrc_seq, number at most limit, and include every existing
  row in (afterSeq, scannedThrough]. A full page ends at its last row; a
  short page scans through head. Head comes from sqlite_sequence and never
  regresses within an incarnation. Payloads are returned as stored, including
  spill stubs, without dropping a row for size. The adapter uses floor zero
  and has no must-see retention authority. This page contract is separate
  from hrc-runtime.bounded-lifecycle-event-observation's bounded tail and
  lossy live stream; their existing admission and loss semantics are unchanged.
  The pinned state reads are sessions, latest-by-session, presentation
  runtimes and the keyed presentation seats read, plus the page route and
  bounded-stream wake. latestEvent selects the newest turn.* event by hrcSeq
  in the selected hostSessionId and generation, at or below the newest raw
  owner event's seq. Bookkeeping cannot displace that display event. A
  generation without a turn has no latestEvent and inherits no older preview.
  lastHrcSeq, lastActivityAt, membership and cursor progress retain their
  existing raw-event sources and freshness exclusions. Bootstrap, apply and
  resync may recover display selection through GET /v1/events/tail with exact
  hostSessionId and generation, category turn and limit 10 per page. Since
  that category includes broker.turn.origin and command_run.*, filter the
  turn. eventKind prefix locally and ignore candidates newer than the raw
  event. Select the newest eligible turn on the first page containing one.
  If none exists and truncated is true, request an older page using the
  minimum admitted seq as beforeHrcSeq and the returned ledgerIncarnationId.
  The reverse cursor strictly decreases; stop on a real turn or exhausted
  history. Incarnation mismatch fails the read, never proves no turn.
  Ten bounds each page, not the complete search. For a selected tool result,
  a separate unfiltered tail with that exact hostSessionId and generation
  and limit 10 supplies formatting context only, fenced at the selected
  turn's seq; it changes no display selection, activity, membership or cursor.
  Optional nonempty latestEvent.preview follows HRCMac HrcEventPreview
  formatting: matching tool-use ID aliases, nearest preceding same-run call when the ID is absent, payload
  and tool-name fallback when no matching call is in the window, whitespace
  collapse, result prefixes and 180-character truncation. Context is read
  during bootstrap, apply and resync, never retained as projection state.
  The window is bounded context, not a promise to recover calls outside it.
  No HRC server behavior or activation changes with this preview extension.
  T-12015 adds optional seat.attention as a pure function of that same
  selected display event and live-runtime presence, under the producer-owned
  hrc-runtime.turn-attention contract. No event-fold state or additional
  history read is introduced. Selected turn.attention with lit true exposes
  jev attention; selected turn.awaiting_input exposes tool attention. Any
  other selection or absence of a live runtime yields no attention.
  The native append route's transactional completion-freshness fence prevents
  a late classification from displacing a newer turn event. Preview formatting
  for turn.attention uses its excerpt. Existing raw-event freshness, membership,
  cursor and generation-selection predicates remain unchanged.
  T-11538 adds an explicit display-only Unicode recovery policy at the private
  HTTP projection decoder for successful page, tail, latest-by-session,
  sessions, presentation runtimes and seats/read responses. Ordinary strict
  serde_json decoding remains the fast path. Only unpaired escape failures
  enter structural RawValue parsing, with object keys decoded strictly.
  Replacement is limited to event.payload.result.content[*].text,
  event.payload.content[*].text and direct string-valued event.payload fields
  text, message, summary, description, prompt, reason, notice, title, output,
  stdout, stderr and content. Nested message text follows these display rules
  only inside payload.message, never arbitrary nested objects. Session title
  and metadata.title may use this policy only at their observed contract paths.
  Each genuinely unpaired UTF-16 unit in an admitted display value becomes
  exactly one U+FFFD. Valid pairs and literal escaped backslash-u text remain
  unchanged. Unknown fields, keys, identities, tool IDs, scope/lane/session/
  runtime IDs, incarnation, transport and eventKind remain strict. Malformed
  identity/key values, including would-be replacement collisions, fail closed
  with metadata-only errors; no identity encoding or key renaming is allowed.
  Invalid UTF-8, malformed JSON, invalid escape syntax and structural errors
  remain errors. There is no row skipping, durable normalization, database
  rewrite or modification of the HRC HTTP response. All rows and cursor
  ordering survive the projection bridge; raw durable JSON remains lossless.
  The same amendment changes only newly generated spill excerpt cut boundaries:
  a head of at most 4096 UTF-16 units ends at 4095 when the old boundary split
  a valid pair; a tail of at most 1024 units starts one unit later, retaining
  1023, when the old start split a valid pair. Genuine unpaired source units,
  preserveExistingExcerpt and blob/full source stay unchanged. This is the
  exact compatibility delta from P1's 4096-slice oracle; the parity owner is
  informed and refreshes that oracle while retaining lossless historical and
  genuinely unpaired controls. It does not authorize lossy store JSON bridges.
  Neither /v1/runtimes nor /v1/attach is in that set. Attach descriptors use
  the presentation row's HRC-resolved socketPath and attachTarget; an absent
  tmux block refuses resource_unavailable. The kernel does not parse hosting-state variants.
  Stage 1b owner-API operations remain a separate step after the read-only
  gates. Stages 1 and 1b are a facade over the complete TypeScript daemon;
  stage 1b adds no TypeScript code or HRC features. An operation requiring
  unavailable daemon behavior waits for its native stage-2 slice. The three
  additive stage-1 reads already landed are retained. The approved first
  operation is seat.summon in section 4.6.1: a kernel operation with no
  document_id and fences_on none, accepting a project- and task-qualified
  main-lane session_ref, fresh and caller-minted request_id. It calls the
  existing POST /v1/declarations/resolve by-scope arm with task run mode,
  interactive true and headless preferred mode, retains the returned intent
  and adds the requested session correlation. It resolves no paths itself.
  It then calls existing POST /v1/runtimes/start with reject for fresh false
  or suffix for fresh true, implicit summon intent, reuse_pty restart style
  and idempotencyKey hrc-kernel-summon-<request_id>. HRC retains placement,
  federation, claim, occupancy and durable request-hash/replay authority;
  its refusals, including occupied, conflicting-key and superseded-claim
  outcomes, remain refusals. The kernel does not retry. The receipt carries
  session_ref from the returned claim, host_session_id, runtime_id, status
  and replayed. Summon returns no attach descriptor and writes no projection
  rows; ingest supplies them. The caller owns the existing-seat attach check
  and follows the claimed natural key. Remote-homed attachment, socket-down
  recovery and coordination of concurrent summoners remain unsupported;
  remote starts can succeed without producing a local attachable row.
  The seat.restart amendment in section 4.6.2 adds a kernel-scoped operation
  with fences_on none, accepting host_session_id and expected_generation.
  It calls existing POST /v1/sessions/restart once with hostSessionId and
  expectedGeneration, never force. HRC owns the semantic generation fence,
  idle/busy check, rotation and launch. Refusals preserve HRC code/message.
  The receipt carries prior_host_session_id, host_session_id, generation and
  launch, including committed rotation with launch.status failed. No retry,
  Cardo idempotency receipt, attach descriptor or projection writes occur;
  ingest updates the existing scope/lane seat natural key. Cancellation
  cannot undo the mutation and requires readback. The other three proposed
  operations remain outside this approval.
  During stage 2 complete Bun remains independently usable without Rust,
  with existing hrc CLI, SDK and package exports preserved. The native CLI
  is rusthrc. Incremental native packages use isolated state, scopes, tmux
  leases, sockets/ports, registry, ASP configuration and wrkq/publication
  destinations. No copied row grants production broker control. One coupled
  execution owner controls each node/state/substrate; production route slices
  never divide authority or lifecycle writes between Bun and Rust.
  F adds a Rust front door after N1 alongside N2-N4: rusthrc binds public
  hrc.sock, Bun binds private hrc-bun.sock in the same runtime directory
  and uses the same state root. Both processes run on each node during
  transition. While Bun owns execution, Rust serves only implemented,
  compare-qualified routes in the pinned kernel read set that are free of
  side effects and dependence on Bun process memory. Everything else
  forwards verbatim to Bun. Reconciliation and activity-on-read routes
  remain with the owner. Status, subscriber admission snapshots and live
  transcript-index status are outside the front-safe set. Follows and
  streams forward until Rust has an independent wake source and its added
  latency is measured; existing bounded observation, home routing,
  cancellation, backpressure and cursor contracts remain unchanged. Broker
  execution IPC stays on the owner's direct broker connections, preserving
  projection-before-ACK. After N6 Rust alone owns authority writes. Bun
  runs serve-only with no controllers, recovery, timers, publishers,
  followers or listeners except its private socket. Only postponed routes
  proven store-backed, side-effect-free and independent of Bun process
  memory may reach it. Rust refuses every other postponed route before
  mutation with postponed_on_rust_owner naming the route, and logs the
  refusal. This includes controller-independent authority and lifecycle
  mutations such as federation retirement and surface unbind. Real use
  moves a postponed route into implementation or requires a reverse flip.
  Configurable Bun listen socket and serve-only mode are deployment roles,
  not feature flags. Front-stage rollback stops Rust and restarts Bun on
  the public socket with brokers reattached; execution-owner rollback
  remains N6's whole-owner procedure, not a socket swap.
  Rust access metrics use metrics/rusthrc-server-<day>.ndjson and its own
  L3 log, with servedBy native or bun; forwarded requests also appear in
  Bun's unchanged metrics/server-<day>.ndjson and hrc-server.log. No file
  has both processes as writers. Headers, including User-Agent and supplied
  request IDs, pass verbatim; Rust mints no IDs for forwarded requests.
  Both retain Bun's schema, sampling, retention and suppression contract.
  Exact cross-file joins apply to client-ID requests; ordinary no-ID
  traffic supports per-route hourly weighted-count comparison within
  sampling error, not a universal per-request join or presence guarantee.
  The usage audit treats Rust as the fronted request population and Bun
  as its forwarded subset, never summing the two; CLI records remain one
  per invocation. Rust adds an API availability dependency, supervised by
  launchd and reversible through the submitted front-stage rollback.
  External direct writers/readers
  remain explicit compatibility consumers. Production schema migrations stay
  Bun-owned. Native scratch initialization uses canonical Bun machinery;
  unknown or incomplete schemas refuse. A Rust canonical migration runner
  is test-only until separately authorized for production.
  R2 replaces the frozen source-hash inventory with a coverage report
  regenerated from current main at each gate. Exact/computed/pattern main
  routes, peer/registry/ingest routes, CLI commands and recurring jobs map
  to a passing case, a named gap or a listed explicitly unsupported case.
  Schema, repositories, direct tools and external consumers retain their
  compatibility obligations in migration section 6; discovery is not a
  behavior pass, and a named gap remains unqualified behavior. N0 removes
  the frozen inventory/schema pins and their otherwise unused exported
  HrcCompiledRuntimePlanRecord and HrcLifecyclePolicyRecord types, retains
  cases.json and the nine mandatory runner workflows pruned of deleted
  surface, establishes the real installed Bun scratch baseline and proves
  a deliberately broken subject fails. Missing, empty, skipped,
  baseline-failed or fixture-only cases do not pass. Native qualification
  requires the Bun daemon unavailable for its native subject; F's proxy
  qualification instead requires Bun behind Rust and proves front-mode
  compatibility, not native execution parity. Facade success is not native
  parity.
  N0 precedes N1 native store/daemon foundation, N2 broker turns/recovery,
  N3 messages/streams, N4 surviving federation/operations/native kernel,
  then N6 whole-node handoff. N5 rusthrc starts after N1 and qualifies
  commands as their daemon packages land. Packages close on the submitted
  three-to-five real workflows through the existing socket-parameterized
  conformance runner against Bun and Rust scratch subjects. Mable grades
  runner artifacts and git; package designs return to Daedalus when they
  depart from this plan. Ordinary Bun changes refresh current-main coverage
  and the real baseline before affected native requalification. N4 includes
  whatever federation surface survives T-11712's ruled deletions.
  R2 excludes deleted main surface, older-than-paired Bun fallback releases,
  split writers, production Rust migration authority and mechanism races
  with no broker/client product path. This does not change the existing
  state-model or ownership invariants. Fixed performance budgets remain
  unsupported; N4 records resource use and latency for Lance's ruling.
  N6 separately reviews whole-owner activation/rollback: admission closes,
  pending work settles or records durable uncertainty, old ingress,
  controllers, credentials, jobs and publishers relinquish control before
  the replacement starts. Preserve surviving brokers, generation, sequence,
  incarnation, replay/ACK, queued input, projections and publication cursors.
  A named same-release Bun fallback must read and continue native-written
  history; stop/fence candidate before fallback. Socket redirection alone
  cannot prove rollback. Installation and activation remain separate;
  worktree checks do not certify canonical installed acceptance. Preserve
  release sourceCommit, actual binary/package paths, selected/running tuple
  and restart authority. Pilot order requires supported reviewed tooling,
  since current deploy-fleet order differs. No production activation,
  migration transfer, Bun retirement, ACP port or broker consolidation is
  authorized by this amendment. Delivered kernel/read/facade predicates
  above remain unchanged. Performance budgets remain measured proposals.
authority: >
  Lance's library, gradual migration and one-repository rulings cited in the
  approved proposal; Daedalus architecture approval of r3.2 submitted in
  EN-32629, 2026-10-20. F1-F4 were closed by r3.1 and F5 by r3.2.
  Lance's facade-first/no-TypeScript-growth ruling and Daedalus approval of
  the r3.3 seat.summon amendment submitted in EN-32764, 2026-10-20.
  Daedalus approval of the section 4.3 bounded preview-context read amendment
  submitted in EN-33112 and wrkq:T-11490 specification etag 5, 2026-10-22.
  Mable's bookkeeping-suppression correction in EN-33155 and Daedalus
  approval of the revised display-selection amendment in EN-33174,
  wrkq:T-11490 specification etag 13, 2026-10-22; closes F1 from EN-33162.
  Daedalus approval of the section 4.6.2 seat.restart facade amendment
  submitted in EN-33147 and wrkq:T-11496 specification etag 4, 2026-10-22.
  Lance adopted P-00866 and authorized Cody task-seat implementation,
  2026-10-23; Daedalus approved native-parity bearing EN-33646 and P0
  runner-contract.md v2/amendment intent EN-33680. Tracked adoption is
  recorded with T-11527; no runtime parity is implied by design approval.
  Daedalus approval of T-11538 kernel-surrogate-ledger-recovery policy,
  task specification etag 4 submitted in EN-34147, 2026-10-23.
  Lance's 2026-10-25 restart-from-main ruling as recorded in T-11816 and
  EN-35271; Daedalus source-review approval of parity r2 at 7aa89563,
  submitted in EN-35271, 2026-10-25. Arming N0 remains Lance's decision;
  design approval does not grade N0 or N1 behavior.
  Lance's 2026-10-25 direction that both daemons run on each node and Rust
  owns front-door access logging, submitted in EN-35516; Daedalus approval
  of the revised front-door amendment at 13bdbdc6 submitted in EN-35519.
  The revision closes EN-35517 F1's second authority writer and F2's
  impossible universal log-join guarantee. Activation remains separate.
  Lance's 2026-10-29 embedded-kernel ruling; Daedalus approval EN-38698
  of T-12067 section 8.1 at 1e5109af, closing EN-38696 F1 through explicit
  per-node activation order, not a legacy-lock compatibility mechanism.
