id: hrc-runtime.runtime-context-reading
kind: contract
status: active
owner_project: hrc-runtime
scope: context readings at completed turns and between turns with their persisted runtime projection
predicate: >
  During projection of a committed broker turn.completed at sequence T, HRC
  reads the latest stored usage.updated for that invocation below T whose
  payload carries normalized context. If such a sample exists, HRC appends
  one canonical context event carrying turnId, usedTokens, optional
  windowTokens, and optional model. The turnId names the completed reading
  boundary, not the sample's originating model call. Sample turn identity
  need not match, and no sampleSeq is required in the public event. No sample
  produces no event. In addition, projection of a committed context-bearing
  usage.updated with no active turn persists that envelope's own reading and
  appends runtime.context.updated. Its turnId is the envelope's turnId when
  present, otherwise the invocation's last completed turn below that envelope's
  sequence; without either identity no reading is projected. This identity
  labels the reading boundary and does not infer the originating model call.
  The post-turn reading uses that usage envelope's time as observedAt and shares
  its projection disposition, transaction, and cursor advance. This path admits
  Claude's final statusline reading after turn.completed without waiting for
  another turn. The turn.completed path remains in place, so a completed turn
  and a later idle usage envelope may each produce an event, at most once per
  projected envelope. Failed and interrupted terminal envelopes and usage
  during an active turn produce no context event. In the same projection
  transaction as either admitted envelope, HRC stores the latest
  reading with turnId, usedTokens, optional windowTokens, optional model, and
  observedAt on the runtime record and exposes it through its existing
  status/session listing. The persisted reading survives HRC restart and
  broker invocation retirement while that runtime record remains. The
  store-only presentation runtime row additionally exposes optional
  contextReading, copied exactly from runtimeStateJson.contextReading and
  absent when no reading is stored. This additive read does not reconcile
  runtime liveness or change lifecycle state. The stage-1 Rust kernel derives
  its seat context from this persisted field using ACP's projectContextReading
  validation, never by folding an earlier context event. The event,
  reading, projection disposition, and cursor commit atomically; duplicate
  projection leaves the reading unchanged and emits no second event. This
  projection remains subject to hrc-runtime.harness-broker-committed-observation-control,
  including existing historical ownership, stale-generation, participant,
  and retained-evidence fences; it grants no historical recovery authority
  to write current runtime state. There is no backfill. HRC owns field
  placement and naming. ASP owns normalized context evidence; ACP pass-through
  and client presentation remain separate consumer work.
