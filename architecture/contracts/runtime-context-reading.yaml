validation_scope: >
  Requester acceptance covers context events on live codex-app-server and
  claude-code-tmux seats and the persisted reading appearing for an idle runtime
  in the status/session listing after an HRC restart. A projection unit test
  exercises a previously stored sample with no prior in-memory state and
  repeated terminal projection producing one event with an unchanged persisted
  reading. T-10934 acceptance additionally covers a fresh claude-code-tmux seat
  whose persisted contextReading and latest runtime.context.updated for a turn
  carry the usedTokens and windowTokens of its final statusline render, with
  ordering measured against turn.completed. Requester projection tests cover
  post-turn arrival persisting and emitting once, replay emitting no new event,
  and mid-turn arrival emitting nothing. Landing remains coordinated with
  mable@hrc-ios as required by T-10934. A live mid-turn HRC restart is outside
  this scope. Builds, gates, install, restart, and live acceptance remain the
  requester's work. The Rust migration requester additionally verifies the
  presentation field remains a side-effect-free store projection and that
  fresh bootstrap and resync match ACP context after a later event has
  superseded the originating runtime.context.updated as latest-by-session.
