  - architecture/records/invariants/hrc-runtime.bounded-lifecycle-event-observation.yaml
  - packages/hrc-server/src/broker/event-mapper/runtime-state.ts
  - packages/hrc-server/src/broker/controller/bc-submission.ts
  - packages/hrc-server/src/hrc-event-helper.ts
  - packages/hrc-store-sqlite/src/repositories/event-repositories.ts
  - packages/hrc-store-sqlite/src/lifecycle-append-hub.ts
  - packages/hrc-server/src/follow-fanout.ts
  - packages/hrc-cli/src/monitor/wait-projection.ts
  - packages/hrc-cli/src/monitor/wait-command.ts
validation_scope: >
  Requester acceptance covers one live runtime.settled event per stale owner
  and monitor projection clearing a matching activeTurnId while preserving a
  non-matching owner and its status. Dedicated crash or append-failure
  injection, constructed snapshot races, and additional probe interleaving
  gates are outside the authorized validation scope.
last_verified: 2026-10-13 source-grounded design approval only; implementation and live acceptance remain the requester's work
reopen_when: Settlement guards, state/event commit boundary, publication semantics, payload meaning, distinction from turn terminality, or owner-and-status projection rules change.
