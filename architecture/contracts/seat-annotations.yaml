validation_scope: >
  Requester owns the five claims in specification section 7: scratch-daemon
  round trip and refusals; live kernel put and rotation with injected-clock
  projector expiry coverage; svc-to-max3 home-node persistence and projection;
  installed Loggia guards and seat-row compatibility; and the separate c2
  adoption task's durable card/action/remount readback. This ruling adds no gate.
last_verified: >
  2026-10-31 design read of r1.1 against active producer contracts, store
  metadata transactions and schema ownership, projector selection and reads,
  cardo keyed upsert placement and ring limits, federation routing and peer
  forwarding, native session sweeps and c2 action delivery. Read-only live
  store inspection confirmed annotations are not yet implemented. No build,
  test, install, service operation or product acceptance was run; implementation
  and deployment remain unverified.
reopen_when: >
  Storage or write authority, subject identity, key grammar, body or subject
  caps, semantic fence meaning or transaction boundary, event meaning,
  home routing, migration ownership, retention, projection lifetime or
  relations, operation dispatch, or folded-seat compatibility changes.
