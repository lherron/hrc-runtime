id: hrc-runtime.praesidium-surface
kind: contract
status: active
owner_project: hrc-runtime
scope: HRC owner boundary and the adopted Praesidium projection and discovery contract
predicate: >
  Praesidium kernel r1.10 sections 12.1 through 12.3 at f84658c7,
  with taxonomy r2.3 M1 through M3, define the approved remediation
  contract. This record elevates those sections, not the historical
  audit's assumptions or the implementation filing list.
  HRC remains authoritative for seat asks, work and handoffs. Asks use
  the hrc/asks/open annotation projected as seat.ext; work and workEtag
  are seat payload fields; handoff id/state is seat payload metadata
  while pending and for 24 hours after acknowledgement. Bodies and
  history remain owner reads. These operation namespaces introduce no
  separate seat.asks, seat.work or seat.handoff document node types.
  The whole-seat pane presents these together with their related
  subjects. Legacy handoff import, manual assignment and shim retirement
  remain held under T-12380; the existing HRC legacy fallback remains.
  A projected relationship has one canonical join field whose value
  equals its target natural key. Agent references use agentRef with
  agent:<id>; projectRef uses the wrkq root slug matching project.projectId,
  not the owner's P-id. Identity node keys remain unchanged. Seat scope
  fields are canonical full forms without lane; sessionRef is lane-qualified
  where meaningful. Task and workstream references use public T-ids;
  container/group references use public P-ids. roomRef matches the
  projected room's public id, including task/campaign-backed locators.
  Workstream owner is an agent principal. Ext subjects use subjectType
  and subjectKey, with ns, kind and id completing the natural key.
  An absent project target is explicitly unresolved/orphan and relinks
  when present; its slug is never rewritten to a P-id. Other missing
  parents follow the submitted unresolved/relink policy. Projection
  translation changes no owner DTO, store wire form or admission.
  Migration publishes canonical fields, migrates readers, then removes
  deprecated join fields after reader census and installed acceptance.
  Surviving display forms are explicitly named; opaque extension bodies
  and genuine owner read-through DTOs retain their owner contract.
  Persisted projections upgrade while unavailable-source snapshots remain
  readable and visibly stale. No HRC owner-to-kernel dependency is added.
  Discovery ownerContract and prae guidance derive from the same catalog,
  including argument-selected owner, fence and reconciliation variants
  and replay meaning. Type writable capabilities summarize owner writes
  as none, fenced, unfenced or mixed; the operation contract takes precedence.
  Related ledgerTypes include owner read-through kinds without declaring
  them projected node types. Operation-only namespaces remain discoverable.
  Native Cardo addressing fences and host idempotency controls retain their
  meaning and fields. Owner discovery enrichment uses the existing adapter
  response boundary and changes neither owner admission nor kernel write
  repetition: the kernel never repeats a write. An upstream Cardo schema
  change is outside this approval and returns for review.
  T-12662 specification etag 4 extends the prae operator surface to live
  legacy CLI forms within its named exclusions; it is a parity extension,
  not new owner or peer authority. The catalog declares credential: required
  for operations protected by the new owner rule. If credential discovery
  fails, prae refuses those operations with credential_unavailable before
  dispatch. This is a client presence precondition, not credential verification
  or operator authorization in the kernel. The kernel forwards caller identity
  and lifecycle headers verbatim and never substitutes its own authority.
  HRC verifies credential-present callers on other operator writes as Mable
  primaries; terminate additionally admits the runtime's own seat. Callers
  presenting no credential retain existing owner behavior for these routes.
  Restart and stop retain their existing authorization unchanged, with no
  credential-free branch; peer lifecycle retains local authorization and the
  peer-validated lifecycle grant. Cross-node summon and interrupt use the
  existing local HRC forwarding routes and HRC-owned peer connections.
  This extension gives the kernel no new peer control connection and adds no
  federated owner route. Foreign send and archive remain refused. Ordinary
  operator acknowledgement, wrkf, daemon callers, interactive TTY entry points
  and server serve remain excluded. Deliberately headerless calls and older
  clients without the precondition are outside the supported caller model;
  this compatibility boundary is not adversarial agent isolation. Rebuilding
  Mable's agent profile and retiring her legacy CLI space require a separate
  decision and are not authorized by this extension.
authority: >
  Daedalus APPROVE of the r1.10 sections 12.1 through 12.3 and taxonomy
  r2.3 M1 through M3 resubmission in EN-45079, T-12245, 2026-11-04.
  f84658c7 resolves F1 from EN-45078 by matching the existing project
  slug key, superseding the rejected P-valued reference proposal.
  Operator parity extension approved by Daedalus in EN-47463 on T-12662
  specification etag 4, 2026-11-05, following Lance's direct scope ruling
  recorded there; this supersedes the proposal's operator-surface exclusion
  and remote-seat restriction only within the extension's stated scope.
