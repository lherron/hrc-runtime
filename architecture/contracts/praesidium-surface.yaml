id: hrc-runtime.praesidium-surface
kind: contract
status: active
owner_project: hrc-runtime
scope: HRC owner boundary and the adopted Praesidium projection and discovery contract
predicate: >
  Praesidium kernel r1.10 sections 12.1 through 12.3 at f84658c7,
  with taxonomy r2.3 M1 through M3, define the approved remediation
  contract. This record elevates those sections, not the historical
  audit's assumptions or the implementation filing list.
  HRC remains authoritative for seat asks, work and handoffs. Asks use
  the hrc/asks/open annotation projected as seat.ext; work and workEtag
  are seat payload fields; handoff id/state is seat payload metadata
  while pending and for 24 hours after acknowledgement. Bodies and
  history remain owner reads. These operation namespaces introduce no
  separate seat.asks, seat.work or seat.handoff document node types.
  The whole-seat pane presents these together with their related
  subjects. Legacy handoff import, manual assignment and shim retirement
  remain held under T-12380; the existing HRC legacy fallback remains.
  A projected relationship has one canonical join field whose value
  equals its target natural key. Agent references use agentRef with
  agent:<id>; projectRef uses the wrkq root slug matching project.projectId,
  not the owner's P-id. Identity node keys remain unchanged. Seat scope
  fields are canonical full forms without lane; sessionRef is lane-qualified
  where meaningful. Task and workstream references use public T-ids;
  container/group references use public P-ids. roomRef matches the
  projected room's public id, including task/campaign-backed locators.
  Workstream owner is an agent principal. Ext subjects use subjectType
  and subjectKey, with ns, kind and id completing the natural key.
  An absent project target is explicitly unresolved/orphan and relinks
  when present; its slug is never rewritten to a P-id. Other missing
  parents follow the submitted unresolved/relink policy. Projection
  translation changes no owner DTO, store wire form or admission.
  Migration publishes canonical fields, migrates readers, then removes
  deprecated join fields after reader census and installed acceptance.
  Surviving display forms are explicitly named; opaque extension bodies
  and genuine owner read-through DTOs retain their owner contract.
  Persisted projections upgrade while unavailable-source snapshots remain
  readable and visibly stale. No HRC owner-to-kernel dependency is added.
  T-12771 r2 keeps scopeRef as the seat natural key and makes HRC the
  producer of session home classification. One HRC resolver supplies
  home with state local, foreign, unbound or unknown and nodeId naming
  the home or null. Session records on sessions/page, sessions/get and
  the presentation reads carry this value independently of runtime presence,
  for both local and peer kernel bindings. An active local placement row
  naming this node is local; without active local authority, the existing
  locate resolver identifies a foreign binding. Absent ledger and registry
  binding is unbound; unreadable authority is unknown. Ledger commits and
  registry-binding writes invalidate the authority cache.
  Walk and event runs publish no seat, generation or runtime upsert for
  a foreign session. They explicitly remove the scope's seat and the
  generation and runtime nodes they would have upserted, using Cardo's
  binding-owned removal semantics at 6c06622; they do not depend on expiry
  or periodic walks. A previously published unknown copy is retired by
  the first run that sees foreign authority. Local, unbound and unknown
  sessions retain existing publication behavior. Each binding exposes
  foreign sessions as offHomeSessions with scopeRef, laneRef, hostSessionId
  and homeNodeId in ingest.status. This observation grants no placement
  authority. Participant join refuses a scope bound to another node with
  foreign_scope and homeNodeId before registration, under the existing
  participant-session-lifecycle home boundary. Unbound participant registration
  is unchanged and outside this amendment. Ledger split-brain, ordered
  retirement versus participant-registration races, registry-staleness windows
  and cleanup of off-window legacy duplicates are explicitly unsupported.
  Discovery ownerContract and prae guidance derive from the same catalog,
  including argument-selected owner, fence and reconciliation variants
  and replay meaning. Type writable capabilities summarize owner writes
  as none, fenced, unfenced or mixed; the operation contract takes precedence.
  Related ledgerTypes include owner read-through kinds without declaring
  them projected node types. Operation-only namespaces remain discoverable.
  Native Cardo addressing fences and host idempotency controls retain their
  meaning and fields. Owner discovery enrichment uses the existing adapter
  response boundary and changes neither owner admission nor kernel write
  repetition: the kernel never repeats a write. An upstream Cardo schema
  change is outside this approval and returns for review.
  T-12662 specification etag 7 limits this campaign to gaps affecting Mable's
  measured executed calls, superseding the earlier whole-CLI parity scope.
  The submitted census covers 13,405 calls in 216 sessions over 14 days,
  with a ten-call threshold. The build scope is local runtime.archive on
  another seat, node.restart and node.stop including the existing peer
  lifecycle path, task.create with an explicit requester scope,
  work.group.update and work.group.find for campaign operations, a stats
  aggregate read and an owner doctor read shared with the CLI.
  Explicit requester scope and campaign operations forward to existing
  wrkq primitives with caller attribution and owner admission preserved;
  they introduce no wrkq primitive or authority change. Forms below the
  threshold remain reachable by explicit owner-binary path rather than new
  prae operations. Credential discovery retains its existing
  behavior; this extension requires no catalog credential precondition,
  credential_unavailable refusal or credential-discovery-failure regression.
  The kernel forwards caller identity
  and lifecycle headers verbatim and never substitutes its own authority.
  For terminate, HRC verifies credential-present callers as Mable primaries
  or the runtime's own seat. Callers presenting no lifecycle header retain
  existing owner behavior. The five other operator-route guards introduced
  by T-12664 are withdrawn: prune, sweep, reconcile-active, drop-continuation
  and federation retire are outside this campaign's prae surface.
  Restart and stop retain their existing authorization unchanged, with no
  credential-free branch; peer lifecycle retains local authorization and the
  peer-validated lifecycle grant. Cross-node summon and interrupt and room
  membership operations are no longer in this campaign. Existing foreign_seat
  restrictions remain unchanged. This extension gives the kernel no new peer
  control connection and adds no federated owner route. Ordinary
  operator acknowledgement, wrkf, daemon callers, interactive TTY entry points
  and server serve remain excluded. Deliberately headerless calls and a
  protected operation dispatched headerless after credential discovery fails
  are explicitly unsupported. The latter retains the existing headerless
  owner behavior; the contract makes no refusal guarantee for that case.
  Protected owner admission is governed by hrc-runtime.operator-owner-authority;
  this compatibility boundary is not adversarial agent isolation. Rebuilding
  Mable's agent profile and retiring her legacy CLI space require a separate
  decision and are not authorized by this extension.
authority: >
  Daedalus APPROVE of the r1.10 sections 12.1 through 12.3 and taxonomy
  r2.3 M1 through M3 resubmission in EN-45079, T-12245, 2026-11-04.
  f84658c7 resolves F1 from EN-45078 by matching the existing project
  slug key, superseding the rejected P-valued reference proposal.
  Operator parity extension approved by Daedalus in EN-47463 on T-12662
  specification etag 4, 2026-11-05, following Lance's direct scope ruling
  recorded there; this supersedes the proposal's operator-surface exclusion
  and remote-seat restriction only within the extension's stated scope.
  EN-47473, Mable's 2026-11-05 withdrawal of the F3 fix, and T-12662 etag 6
  narrow support to exclude headerless dispatch after credential discovery
  failure. The catalog precondition and its regression obligation are
  withdrawn; the rest of EN-47463's approval stands.
  EN-47477 and T-12662 etag 7 record Lance's narrowing to gaps impacting
  Mable's measured work. This supersedes the earlier whole-surface scope,
  cross-node summon/interrupt extension and five non-terminate owner guards;
  the owner-forwarding boundary and remaining approval stand.
  T-12771 specification r2, etag 5, submitted in EN-48405 and approved by
  Daedalus on 2026-11-09, adds session home classification and binding-local
  retirement of foreign projections without changing seat identity.
