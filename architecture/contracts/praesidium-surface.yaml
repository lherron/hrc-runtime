validation_scope: >
  The submitted producer, reader, snapshot and whole-seat acceptance
  obligations remain the requester's. This approval adds no gate and
  establishes no implementation, installation, activation or product acceptance.
  T-12662 parity, replacement, authority and legacy-compatibility acceptance,
  and the implementation task's credential-discovery-failure regression,
  remain the requester's work. The operator extension adds no product gate.
last_verified: >
  2026-11-04 design read of f84658c7 and its two-line F1 correction;
  source read of kernel ca2756b project key emission, canonical agent
  keys, seat representation, argument-dependent owner classes, projection
  versioning and adapter response dispatch, and Cardo registry semantics.
  Independently counted the complete T-12438 audit capture at revision
  277671, cursor 12664: all 150 project keys are slugs and all 112 seat
  project slugs match a project target. No build, test, install, restart
  or live mutation was run for this ruling.
reopen_when: >
  Project or other identity keys, canonical reference values, unresolved
  or snapshot preservation semantics, owner/projection authority, seat
  record representation, the legacy cutover hold, catalog authority,
  owner reconciliation meaning, native Cardo execution controls or the
  no-kernel-write-repetition boundary changes.
  Reopen the operator extension when credential-required coverage, refusal
  before dispatch, owner admission, credential-free compatibility, restart
  authority, peer-control routing, exclusions or the supported caller model
  changes.
design_review: >
  2026-11-05 T-12662 specification etag 4 APPROVE, EN-47463. Source read of
  prae credential discovery and write dispatch, the bridge's optional-header
  forwarding, HRC local literal-input and terminate resolution, claim-start
  and explicit-node interrupt forwarding, lifecycle credential verification
  and peer grants, and wrkq's ordinary acknowledgement admission. F1 and F2
  resolved by scope exclusions; F3 resolved by the proposed catalog-driven
  client presence precondition. This verifies the design only. No build,
  test, install, restart or live mutation was run; prior last_verified
  evidence is unchanged.
