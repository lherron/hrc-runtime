validation_scope: >
  The submitted producer, reader, snapshot and whole-seat acceptance
  obligations remain the requester's. This approval adds no gate and
  establishes no implementation, installation, activation or product acceptance.
  T-12662 etag 7 replacement, authority and legacy-compatibility acceptance
  remain the requester's work. The operator extension adds no product gate.
  T-12771 r2 isolated peer-collision, unknown-to-foreign event retirement,
  participant refusal, regression and installed fleet acceptance remain
  the requester's work; this is design approval only.
last_verified: >
  2026-11-04 design read of f84658c7 and its two-line F1 correction;
  source read of kernel ca2756b project key emission, canonical agent
  keys, seat representation, argument-dependent owner classes, projection
  versioning and adapter response dispatch, and Cardo registry semantics.
  Independently counted the complete T-12438 audit capture at revision
  277671, cursor 12664: all 150 project keys are slugs and all 112 seat
  project slugs match a project target. No build, test, install, restart
  or live mutation was run for this ruling.
reopen_when: >
  Project or other identity keys, canonical reference values, unresolved
  or snapshot preservation semantics, owner/projection authority, seat
  record representation, the legacy cutover hold, catalog authority,
  owner reconciliation meaning, native Cardo execution controls or the
  no-kernel-write-repetition boundary changes.
  Reopen the operator extension when owner admission,
  credential-free compatibility, credential-discovery support scope, restart
  authority, peer-control routing, exclusions or the supported caller model
  changes.
  Reopen the home-classification amendment when its producer routes,
  authority precedence, cache invalidation, foreign projection retirement,
  scope-only seat identity or explicit support boundary changes.
design_review: >
  2026-11-09 T-12771 r2, etag 5, APPROVE in reply to EN-48405. Read the
  revised spec, HRC locate authority and participant join, session and
  presentation routes, kernel local and peer walk/event read paths, retained
  feed semantics and Cardo's current-source removal filter and child-first
  removal ordering. R2 resolves F1 by carrying authority on all session read
  paths and F2 by explicit retirement in event and walk runs. No build,
  test, install, restart or live mutation was run for this review; prior
  last_verified evidence is unchanged.
  2026-11-05 T-12662 specification etag 4 APPROVE, EN-47463. Source read of
  prae credential discovery and write dispatch, the bridge's optional-header
  forwarding, HRC local literal-input and terminate resolution, claim-start
  and explicit-node interrupt forwarding, lifecycle credential verification
  and peer grants, and wrkq's ordinary acknowledgement admission. F1 and F2
  resolved by scope exclusions; F3 resolved by the proposed catalog-driven
  client presence precondition. This verifies the design only. No build,
  test, install, restart or live mutation was run; prior last_verified
  evidence is unchanged.
  2026-11-05 EN-47473 and T-12662 etag 6 withdraw the unbuilt F3 client
  precondition and its regression obligation, explicitly excluding the
  credential-discovery-failure case instead. Re-read the revised spec,
  prae's optional credential discovery and the bridge's optional-header
  forwarding, plus the newly active operator-owner-authority record.
  Corrected the support boundary without a new ruling; the historical
  etag 4 precondition above is superseded by this withdrawal. No build,
  test, install, restart or live mutation was run for this correction.
  2026-11-05 EN-47477 and T-12662 etag 7 narrow the campaign on Lance's
  instruction. Read the revised spec and census summary, the current kernel
  task-create requester stamping, wrkq requester validation and the existing
  container campaign update/convert/close/portfolio RPC registrations and
  CLI forwarding. Corrected this scope and operator-owner-authority to retain
  only the terminate guard. Guard removal and the new operations remain
  implementation work; no implementation or activation is attested here.
