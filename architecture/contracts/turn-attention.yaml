validation_scope: >
  Requester owns task gates G1 through G5: classifier quality using the
  subscriber request builder and real gold fixture; live max3 ask, clear,
  none and tool attention; task-seat exclusion; invalid-key fail-open; and
  installed Loggia row, hover and seatHeaders evidence. The revision names
  a route unit test for stale_turn and deliberately excludes a live gate
  forcing a next-turn start during classification. This review adds no gate.
  For T-13374, turn-attention-module r2 section 7 supplies port acceptance,
  including rerunning G1 through the Python classifier against the same
  412 gold rows and pass rule. The old TypeScript G1 result does not attest
  the Python port. The standalone classifier package, launchd installer,
  plist template and rollback files are removed under T-13429 after all
  three nodes' cutover. Module acceptance and activation belong to
  praesidium-kernel; HRC retains the append and presentation contract.
last_verified: >
  2026-10-28 revised design read against single-event keyed reads, latest-turn
  recovery, empty bootstrap, presentation-runtime filtering, event categories,
  preview formatting and Loggia's descending urgency selection. F1 and F2
  from EN-38018 resolve in specification etag 6. No implementation tests,
  builds, installs, service operations or live acceptance were run by the
  reviewer; implementation and deployment remain unverified.
design_review: >
  2026-10-31 T-12183 r1.1 shared-reader amendment reviewed against the
  projector's display selection and runtime-presence guard. No implementation
  or acceptance gate was run; prior last_verified evidence is unchanged.
  2026-11-11 T-13374 port: Read the submitted r2 at f91fd24 and HRC
  c8a1f968 subscriber, classifier, G1, local event-page and append routes,
  store idempotency/freshness transaction, deploy lane and launchd installer.
  Verified that paging is unfiltered, classifier-input events are not tool
  spills, and the kernel seat projector carries each newest hrcSeq. The
  module preserves the three-second timeout and classification semantics;
  one-second wake coalescing and the 30-second idle backstop replace the
  live stream. No build, test, install, restart or live mutation was run;
  prior last_verified evidence is unchanged.
reopen_when: >
  Append authority, completion identity, idempotency, transaction or freshness
  fence, egress authorization, classifier isolation or failure handling,
  classification eligibility, version semantics, event meaning, selected-event
  attention predicate, generation or live-runtime lifetime, preview behavior,
  or projection reconstruction changes.
