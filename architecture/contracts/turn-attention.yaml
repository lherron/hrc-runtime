id: hrc-runtime.turn-attention
kind: contract
status: active
owner_project: hrc-runtime
scope: node-local derived turn attention append authority and rebuildable seat presentation
predicate: >
  HRC owns the only append route for turn.attention. The native local-socket
  route accepts no other event kind and performs no cross-node write. It
  requires an existing local turn.completed identified by turnId and runtimeId,
  derives scope from that completion rather than the caller, and refuses an
  unknown turn. A repeat of (turnId, classifierVersion) returns the existing
  event without appending. For a new classification, the named completion
  must still be the latest category-turn event of its hostSessionId and
  generation. This freshness check and the insert share one store transaction;
  otherwise stale_turn is returned without an append.
  The classifier runs outside the HRC daemon on each HRC node and follows
  that node's events. It is the Python turn-attention module hosted by
  that node's Praesidium kernel, with source
  in praesidium-kernel/modules/turn-attention/. The module calls the local
  kernel's node.event.page and turn.attention.create pass-through operations;
  it holds no direct HRC owner client. HRC's append admission, validation,
  completion-derived identity, transaction, freshness and idempotency are
  unchanged. The module's forwarded write has its module identity and no
  lifecycle headers; this existing local route requires no lifecycle
  credential. It classifies only scopes whose task segment
  does not match T- followed by digits. It reads the last assistant message_end
  from turn.message, not the transcript index. Lance authorizes hosted jev
  egress of the verbatim last 2500 characters of final text, last 400 characters
  of turn.user_prompt, and agent, project and seat identity, with no masking,
  obfuscation or redaction. Foundry is included. The hosted call has a
  three-second timeout and cannot delay or fail turn completion. Errors,
  timeouts and non-2xx responses log and append nothing; there are no retries
  or classification queues. A private persisted cursor supports catch-up;
  replay remains subject to append idempotency and freshness.
  Successful classifications append category-turn turn.attention, including
  none. Absence means unclassified. The event carries turnId, invocationId,
  lit, state, kind, four ask probabilities, confidence, toLance,
  waitingOnOther, excerpt, text, model, classifierVersion and latencyMs. The
  subscriber computes lit as p.blocking plus p.decision at least 0.5;
  when lit, state is the larger of blocking and decision (ties go to
  blocking), otherwise the argmax of the four, so a lit event never carries
  state offer or none; excerpt is at most the last 240 characters of
  the classified message, never a generated summary. text is the turn's
  whole final message, at most 16384 UTF-8 bytes; a longer message keeps
  its tail behind a leading "…". The route accepts an event without text
  (an older subscriber) and refuses a non-string or longer one. text is
  display only; the hosted call still sends at most 2500 characters.
  attention-v3 freezes
  the task's questions and threshold; wording changes require a version
  bump and G1 quality acceptance. Idle requests for new work and conditional
  offers stay dark; direct next-action questions about work in hand light.
  The seat projector derives attention solely from the same selected display
  event as latestEvent, using existing generation and turn.* selection.
  With a live runtime, selected turn.attention with lit true projects source
  jev, state, kind, excerpt, text (when the event has it) and at;
  selected turn.awaiting_input projects
  source tool, state blocking, kind information and at. All other selections
  and absence of a live runtime yield no attention. A later selected turn
  event clears the field, and generation rotation inherits no older signal.
  There is no retained fold state, additional history read or store schema
  change. Empty bootstrap and keyed refresh reconstruct the same predicate.
  turn.attention preview uses its excerpt. Loggia consumes this producer
  field for Needs input, with needs-input urgency 5 above busy urgency 4.
  c2 renders text as Markdown in its cards and falls back to excerpt
  when text is absent (T-12644).
  T-12183 r1.1 moves display-event selection and the attention fold into
  hrc-store's shared live_attention reader, consumed by annotation admission
  and the projector. The existing selected-event, generation and live-runtime
  predicate above remains unchanged; this does not change append authority.
