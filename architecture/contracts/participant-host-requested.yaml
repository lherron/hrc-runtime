validation_scope: >
  The requester's r2 gates cover actual external retirement with its retained
  BOUND binding, each refusal door independently, suppression controls and
  rate limiting without session activity changes; live and restart replay
  through the kind-filtered bounded stream; parked display, clearing on new
  admission and rejection on HRC-owned termination; and installed scratch
  participant observation through a real mail delivery attempt. This is
  design approval, not evidence that any gate has passed.
last_verified: 2026-11-10 r2 design review plus r2.1 factual correction verified against baseline.sql NOT NULL columns and activity trigger and migrate/mod.rs sentinel attribution; acceptance remains pending, no builds or tests run by the reviewer
reopen_when: Knock eligibility or refusal coverage, event payload or attribution, rate limit, refusal preservation, host-start authority, parked disposition ownership or clearing, or the existing stream contract changes.
