validation_scope: >
  The requester's r2 gates cover actual external retirement with its retained
  BOUND binding, each refusal door independently, suppression controls and
  rate limiting without session activity changes; live and restart replay
  through the kind-filtered bounded stream; parked display, clearing on new
  admission and rejection on HRC-owned termination; and installed scratch
  participant observation through a real mail delivery attempt. This is
  design approval, not evidence that any gate has passed. The T-13153
  acceptance contract adds scratch-daemon native e2e evidence with a real
  participant host for always-present null members without a reservation,
  parked get/page equality with the target view, exactly one park event,
  unchanged time and event count on eviction replay, clearing and exactly one
  null event on a new attempt, no event on registration replay, and the two
  events in order on a filtered live follower and restart replay from the
  earlier cursor. It also requires the exact page query's plan and timing on
  a generated seed or copy at max3 scale, without querying the live store,
  and the requester's just verify with its cargo leg. No acceptance driver
  is added to the recurring verify gate by this addendum.
  T-13189 adds requester-run participant_disposition.py acceptance for park
  then unpark with null session-read members and exactly one null event,
  unchanged replay without an event, preserved held reservation and subsequent
  registration admission, and unknown-address refusal without writes. Mable's
  installed acceptance clears the stale max3 acceptance address through the
  route and observes its removal from the parked list in prae seat list.
  This is design approval only; these acceptance results remain pending.
last_verified: 2026-11-10 r2 design review plus r2.1 factual correction verified against baseline.sql NOT NULL columns and activity trigger and migrate/mod.rs sentinel attribution; acceptance remains pending, no builds or tests run by the reviewer
design_review: >
  2026-11-10 T-13153 APPROVE in EN-49964 replying to EN-49949. Verified the existing three
  disposition writes and their enclosing transactions, eviction replay fence,
  unique reservation address index, bounded page subquery, target read,
  canonical event append and activity trigger, mutation-dispatch ledger wake,
  exact eventKind filter and peer JSON forwarding against source. This is
  approval of the submitted design, not implementation acceptance; prior
  last_verified evidence is unchanged. No builds, tests, installs or live
  store queries were run by the reviewer.
  2026-11-10 T-13189 APPROVE replying to EN-50196, specification at task etag 2.
  Verified exact unique reservation addressing, the existing helper's null
  write and changed-only event, registration and succession clearing,
  eviction replay fencing, disposition-independent knock and birth-refusal
  predicates, session reads, registration routing/accounting and mutation
  ledger wake against source. The clear changes display state only and
  preserves hrc-runtime.participant-session-lifecycle. No builds, tests,
  installs or live store queries were run; implementation acceptance pending.
reopen_when: Knock eligibility or refusal coverage, event payload or attribution, rate limit, refusal preservation, host-start authority, parked disposition ownership or clearing, session-read field presence or meaning, change-event atomicity or coverage, bounded page query shape, peer field preservation, or the existing stream contract changes.
