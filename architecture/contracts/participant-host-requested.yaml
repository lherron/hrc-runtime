id: hrc-runtime.participant-host-requested
kind: contract
status: active
owner_project: hrc-runtime
scope: participant demand observation and display-only parked reservation disposition
predicate: >
  HRC reports demand for a participant host through participant.host_requested
  in its canonical hrc_events ledger. HRC never starts, signals or calls the
  host in response; the host observes the existing bounded event stream and
  owns its response. A knock guarantees neither a host response nor delivery,
  and does not change the mail kicker's retry budget.
  One store predicate identifies a not-serving host at a scope and lane:
  the reservation is held and the address's registration has no attempt,
  or its latest attempt is SUPERSEDED, ABANDONED or TERMINAL, or its latest
  attempt is not ACTIVE and establishment work is exhausted. Binding state
  is not this predicate: external eviction can leave the binding BOUND.
  ACTIVE and still-establishing hosts do not qualify. Pending refusals,
  released reservations and absent reservations produce no knock.
  The refusal points use one helper: participant delivery resolution for
  retained-session turn admission, participant_substitution for a lazy
  target, and assert_reserved_address_allows_birth for target ensure and
  both resume checks. A later refusal point for a held address uses the
  same helper. On a qualifying refusal HRC appends participant.host_requested
  with payload scopeRef, laneRef, reservationId, door and requestedAt. Door
  is turn, turn-lazy, ensure, resume or start. The event belongs to no seat session
  or runtime. Its required ledger attribution uses the fixed non-seat
  host_session_id hrc-participant and generation 0, with no runtime_id and
  the addressed scope and lane in scope_ref and lane_ref. It never uses the
  retained seat session's identity. This follows the store.migrated sentinel
  convention while satisfying the ledger's NOT NULL session and generation
  columns. The knock changes no session activity or runtime state. An in-memory
  limit admits at most one knock per reservation per thirty seconds; restart
  may admit an extra. Append failure is logged and preserves the refusal.
  All refusals retain their status, code, reason and retryability.
  A host reads eventKind=participant.host_requested on
  GET /v1/events/bounded-stream and persists afterSeq with the ledger
  incarnation under hrc-runtime.bounded-lifecycle-event-observation. Old-knock
  disposition belongs to the host. Knock/register ordering and exactly-once
  observation are not promised. Literal input to a terminated runtime and
  unknown-runtime refusals that never consult registration are outside this
  knock contract.
  POST /v1/terminate accepts optional disposition parked only for an external
  lifecycle owner on the evict_external path. Other terminates carrying it
  refuse as invalid before termination. The disposition and its time are
  recorded on the reservation belonging to the evicted runtime's binding;
  repeating that eviction records the same thing. A newly admitted
  registration attempt for the reservation clears both. The target read
  exposes the disposition and refusal text at the three refusal points
  reports parked. The two nullable reservation columns are a forward Rust
  migration. This is display-only: eviction, continuation, binding retention,
  explicit reservation release and knock behavior are unchanged. Kernel and
  board projections are outside this contract.
  T-13153 adds HRC observation surfaces for that same reservation state.
  Local GET /v1/sessions/get and every local GET /v1/sessions/page record
  always contain top-level disposition and dispositionAt. They report parked
  and the stored park time for the exact scope and lane reservation, or null
  for both when unparked or no reservation exists. The page keeps one query,
  joining the unique reservation address after the bounded session_index
  subquery. Peer JSON retains the members when served by the peer and their
  absence when not served; forwarding invents neither member.
  Each value change at external eviction, initial registration or admitted
  succession appends participant.disposition_changed in the same transaction
  as the reservation write. One store helper compares the disposition using
  SQLite IS NOT, and appends only for changed rows. Its payload contains
  disposition, dispositionAt and reservationId, using the resulting stored
  values. Attribution is category participant, host_session_id hrc-participant,
  generation 0, no runtime_id, and the reservation's scope_ref and lane_ref
  in the envelope. The existing eventKind filter selects the event through
  the bounded stream and preserves its replay contract. Append failure rolls
  back the disposition write and its enclosing transaction.
  The eviction replay fence remains before the helper, parking preserves
  the original park time, and clearing nulls both fields. An unchanged value
  emits nothing, including an eviction replay or registration while unparked.
  This addendum changes no existing member meaning, effectiveStatus, status,
  eviction, registration, continuation or reservation-release behavior and
  requires no new migration. Hand-written SQL produces no promised event;
  already-parked reservations gain no backfill event on upgrade, but their
  stored state appears in the reads. Kernel and board projection behavior
  remains outside this contract.
  T-13189 adds local POST /v1/participants/unpark, a clear-only operation
  addressed by scopeRef and laneRef, with laneRef defaulting to main. In one
  transaction it finds the exact reservation and calls the same store helper
  with null disposition. A 200 response contains reservationId, scopeRef,
  laneRef, null disposition, null dispositionAt and changed, which is false
  when the reservation was not parked. A value change appends the same
  participant.disposition_changed event atomically; an unchanged call appends
  nothing. Missing reservations use the existing not-found refusal naming
  scope and lane; missing or non-string scopeRef uses the existing bad-request
  shape. Routing and accounting follow participant registration.
  Unpark does not require the evicted runtime's row and does not replay
  eviction. It cannot set any disposition, release a reservation, change a
  binding or attempt, or change continuation, eviction, admission, knock
  eligibility or its rate limit. Existing reads and refusal text observe the
  cleared columns. No migration or new event kind is introduced. Caller trust
  remains the local daemon socket trust of terminate and register; proof that
  the caller parked the address is unsupported. Concurrent park and unpark
  are last-write-wins, with request ordering owned by the host. Automatic
  expiry and backfill remain unsupported.
