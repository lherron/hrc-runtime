validation_scope: >
  Submitted G1 through G5 remain requester-owned live acceptance: remote
  typing and resize, read-only input refusal, local streams without federation,
  recovery across home-daemon restart without disturbing the seat, and passive
  screen observation preserving terminal size and client count, with no
  further capture calls for that seat after stream close under rev 1d G5.
  Each ends in a rerunnable script and result in the task artifact directory. This ruling
  adds no gate and establishes no implementation, install or live acceptance.
last_verified: >
  2026-11-12 design-only source reading of rev 1a, supervisor read-only input
  filtering, attach/replay ordering, bounded-client eviction, capture, daemon
  supervisor authentication, attach descriptors, home authority and peer
  authentication, capability parsing and bounded-stream relay; also kernel
  adapter foreign-seat refusal and descriptor issuance. No build, test,
  install, restart or live mutation was run for this review.
design_review: >
  2026-11-12 record reconciliation against T-13420 rev 1d, task etag 9,
  EN-52396 and commit 74426248. The rev 1a approval remains the architecture
  ruling; the slower cadence follows Lance's direction and the clarified
  kernel routing and stream-scoped capture lifetime preserve its boundaries.
  No implementation or acceptance result was inspected or established.
reopen_when: >
  Seat selector or runtime-binding semantics, frame or upgrade format, stream
  kind meaning, read-only authority, replay ordering, backpressure, supervisor
  compatibility, home resolution, peer authorization or hop count, capability
  admission, row or attach-descriptor contract, reconnect/status semantics,
  direct local-terminal boundary or supported consumer model changes.
