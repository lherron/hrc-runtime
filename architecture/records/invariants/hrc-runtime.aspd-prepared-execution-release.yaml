id: hrc-runtime.aspd-prepared-execution-release
kind: invariant
status: active
owner_project: hrc-runtime
scope: HRC v2 producer-selected execution preparation, generic hosting, frozen launch, reuse, reattachment, and matched ASP/HRC activation
predicate: >
  Before any worker-hosting effect HRC accepts exactly one ASP v2 selected
  execution and atomically persists the complete successful compile response,
  raw request selection carrier, execution hash, identity allocation, canonical
  dispatch request, execution release, hosting declaration, admission result,
  lifecycle overlay and idempotency key as boundary P. It then allocates concrete
  resources from execution.hosting, validates executable containment and positive
  hostedDrivers membership for the selected driver, and launches only from the
  reread frozen bytes. Retry, replay, warm control and restart never compile,
  re-resolve, reselect, or bind a preparation to the active aspd release. A
  prepared v2 operation proves invocation.start was not submitted; only the
  same host-session and idempotency key may resume it, and startup never
  auto-launches it. A retry whose immutable request identity differs refuses and
  leaves the operation prepared. Missing or uncertain invocation.start never
  authorizes replay. HRC owns generic resource allocation, endpoint/lease/
  presentation persistence, runtime identity, dispatch overlays, reuse,
  reattach, projection, reaping and public control; ASP owns selection and the
  executable execution shape. Presentation is a producer-resolved boolean input
  to birth, not a HRC route selector; an explicit presentation mismatch never
  mutates or silently replaces a live runtime, while omission reuses its
  established birth variant when ordinary lifecycle admission permits it. This is
  a clean v2 cutover. HRC neither accepts nor translates v1 selection
  fields, plural profiles, profile hashes, route choices, aliases or driver
  requests. Existing v1 harness-broker prepared operations are cancelled or
  abandoned and never resumed by v2. At activation HRC requires zero
  incompatible harness-broker prepared operations. T-08207 revision 11 chooses
  the closed HRC `executionFormat` at the request admission door before compile,
  stores it in boundary P, and writes the same immutable value to the broker
  invocation. Omission is format 1; no session intent, ASP selection, release,
  or caller identity supplies an implicit format 2. Format 2 allocates an
  initialInputId but no runId before compile and is admitted only when frozen
  execution dispatch carries that input through broker-deliverable initialInput;
  a launch-argv-only first prompt refuses before P. Retry and launch reread the
  stored selector, and a live/prepared-selector mismatch refuses before an
  effect. Under T-08207 format 1, the inventory also rejects an accepted
  headless run without a dispatched input. Under format 2, admission is
  represented by a cleanup-protected input and an
  execution exists only after observed turn.started; preflight reports an
  unlanded input without fabricating or rejecting an accepted run or dropping
  its protection. It re-runs the applicable inventory immediately before
  activation. It may retain only durable v1
  broker workers whose reattachment uses contract-neutral persisted endpoint,
  lease, runtime and invocation identity. selectedProfileHash and
  startRequestHash remain opaque attach fences; HRC does not parse an old plan
  or session.lastAppliedIntentJson selectors. A retained v1 worker may attach,
  replay, accept input, interrupt, terminate and preserve its continuation
  identity, but an operation that needs compilation, reprovisioning or old-plan
  interpretation refuses and is reborn under v2. ACTIVE external participant
  attempts are drained or retired: their reconnect parses prepared_profile_json
  and no v2 compatibility reader exists. A matched cutover records the HRC and ASP
  A rollback pair before effects,
  installs/restarts HRC B first while ASP A still serves, confirms B rejects
  old/v1 compilation before P and that the activation inventory is empty, then
  activates ASP B at the same endpoint and reads selected==running plus HRC's
  observed aspd release identity. The first persisted v2 preparation is the
  irreversible boundary: before it the recorded A pair may be restored; after
  it rollback to v1 is forbidden and correction is fix-forward. Acceptance
  proves stable retained runtime, invocation and continuation identities through
  tmux replay, input, interrupt and terminate, plus v2 reprovision of a dead
  seat using its old continuation. Reattachment uses persisted connection
  identity without aspd and verifies frozen release/protocol identity before
  attach.
