required_tests:
  - just architecture-records
  - T-08562 route gates prove every claude-code-tmux and pi-tui-tmux birth door on a configured node prepares through aspd with its driver, route and door class and never reaches the facade or resolver, while codex-cli-tmux, pi-sdk and an unset endpoint keep their paths
  - T-08562 admission gates prove generic hosting-shape admission, driver equality with the request, and aspd_worker_hosting_unproven for absent, malformed or non-matching hostedDrivers before boundary P and at launch, with codex-app-server admissible without it
  - T-08562 launch-argv prompt gates prove replace-priming and append-to-priming Claude and Pi prompts are frozen once in the start request, absent from the applied intent, reported after boundary P, never submitted again, and carry launch-carried invocation provenance
  - T-08562 isolated then shared max3 installed acceptance covers Claude and Pi door classes, hosting evidence, frozen release worker and helpers, prompt exactly once, aspd outage, pre-binding release refusal, A to B with a live A Claude worker, restart reattachment, Codex regression, the preserved Pi SDK route and pi-sdk producer refusal, the resolver population statement, and independent grade
  - T-08560 route gates prove every interactive codex-app-server birth door on a configured node prepares through aspd with its door class and never reaches the facade, while other drivers and an unset endpoint keep the facade
  - T-08560 launch-carried prompt gates prove replace-priming and append-to-priming prompts are frozen once in the start request, absent from the applied intent, reported launch-carried only after boundary P, never submitted again, and bound to the initial input identity at B4, while an after-boot selector prompt is delivered once by runtime identity
  - T-08560 retry gates prove a keyed interactive preparation freezes its key and resumes on the frozen release, a route mismatch refuses aspd_preparation_route_changed untouched, and keyless doors including the mail kicker leave refused preparations prepared and never auto-launched
  - T-08560 ordering gates prove reprovision doors stale-mark before preparation and leave no operation, runtime, lease, or tmux server on a pre-boundary-P refusal, joins and participant backstops hold on the aspd route, and ensure stays unregistered
  - T-08560 isolated then shared max3 installed acceptance covers every door class, frozen release worker and wrapper, prompt exactly once, keyed retry across activation, aspd outage, A to B activation with a live A interactive worker, never-started lease cleanup on a non-attached door, restart reattachment, unchanged attached run and other drivers, and independent grade
  - T-08542 configured-route negotiation and no-fallback gates cover unavailable incompatible unidentified and connection-closed aspd plus missing executionRelease
  - T-08542 boundary-P transaction and readback gates prove complete immutable preparation precedes hosting and launch consumes persisted bytes only
  - T-08542 same-key retry launches the frozen A preparation after B activation while startup performs no automatic launch and a new preparation selects B
  - T-08542 worker path argv protocol and release mismatches refuse before invocation.start and interrupted pre-start hosting is reclaimed without rebinding
  - T-08542 start-boundary gates distinguish prepared from transport-uncertain state and never replay an uncertain invocation.start
  - T-08542 installed fixed-HRC A-B rollback and aspd-outage matrix keeps existing A and B workers controllable
  - T-08542 daemon restart with aspd unavailable reattaches A and B only after candidate-connection release identity verification and preserves event continuity and acknowledgement ordering
  - T-08553 presentation precedence gates prove omitted choice on a redirect-on node keeps the Codex interactive redirect and node presentation default and explicit none stays headless and selects the aspd route with source request
  - T-08553 presentation validation gates refuse non-none values viewer placement and interactive or redirected routes before any runtime effect
  - T-08553 existing-scope gates refuse none against a live tmux-tui runtime without delivery stale-marking or reprovision and deliver omitted or matching choices
  - T-08553 shared max3 installed acceptance covers omitted-choice control, no-viewer aspd A, conflict refusal, and fixed-HRC B activation with the A worker still usable
  - T-08554 explicit tmux-tui gates prove redirect exemption, aspd route selection with source request, node-default tmux-tui staying on the facade when HRC_ASPD_SOCKET is unset, driver and route refusals, and presentation_conflict both directions
  - T-08554 frozen tmux-tui launch description carries presentation and observer socket, launch refuses a mismatch, and the aspd execution launches only on the tmux-tui substrate when frozen so
  - T-08554 operator attach to a live headless tmux-tui runtime returns its attach descriptor with no admission stale-marking or reprovision
  - agent-spaces release worker launches its renderer through its own release executable while checkout and package brokers keep the bun entry launch
  - T-08554 isolated installed acceptance covers aspd A viewer, attach detach reattach identity, fixed-HRC B activation with the attached A viewer usable and a fresh B viewer, refusals, aspd-absent HRC restart recovery, and unchanged omitted-choice routing on a redirect-on node; then shared max3 delivery and independent grade
  - T-08555 precedence gates at both start and dispatch doors prove configured node-default tmux-tui selects aspd with source node-default; redirect-on doors keep their pre-change routing; with the redirect off an established tmux runtime of any harness (including transitional) receives omitted, responseFormat, surface-refusing and high-risk requests only through interactive admission or its refusal, an established same-harness headless runtime (including transitional) stays on the headless route, a foreign-harness headless runtime refuses established_runtime_harness_mismatch untouched, a crossing same-harness birth takes its transport (a tmux birth join admitted only by broker-reuse, refusing surface-reuse refusals, non-matching ownership proofs and non-reusable newborns), a start swapped in after routing is refused at the join (unclassified, foreign or changed route), a crossing foreign birth of either transport refuses and an unrecorded in-flight start is awaited, the headless queue-behind-boot contract still holds, no cross-transport start occurs, and explicit interactive Codex stays admissible
  - T-08555 isolated then shared max3 installed acceptance covers default cold launch through ordinary doors with aspd preparation worker viewer and renderer from the active release, attach detach reattach identity, no-viewer opt-out, conflicts, pre-existing live codex-tui and app-server scopes preserved across the configuration change, aspd-outage refusal of new default executions, paired plist-plus-release rollback record, resume of a standalone-born continuation on the default route, and independent grade
  - T-08556 crossing gates prove the attached-run door classifies a registered birth before awaiting it, refuses a foreign tmux birth, accepts a same-harness tmux newborn only through broker-reuse admission, re-enters under its own registered operation, and neither duplicates nor admission-replaces a joined runtime
  - T-08556 attached-run selection gates prove established and joined headless runtimes receive viewer reuse, no-viewer conflict, transitional refusal, or foreign-harness refusal without stale-marking or a second runtime, while explicit force-restart with no live joined newborn remains the only replacement path
  - T-08556 identity-delivery gates prove an initial prompt traverses turn admission and the selected runtime's input executor exactly once before the start operation deregisters, cannot be redirected by a crossing registered start or dispatch, and targets no replacement inserted for the session
  - T-08556 frozen interactive route gates prove boundary-P persistence, durable-IPC refusal, allocator and controller route admission, worker hello binding, and worker wrapper and hook execution from one retained execution release with no resolver fallback
  - T-08556 isolated then shared max3 acceptance covers real attached Codex TUI input, initial prompt identity, warm reuse and detach, headless viewer reuse and conflicts, cold-attach birth (facade before T-08560), aspd outage, retained-release activation and rollback ordering, restart reattachment, and cancelled attach cleanup
  - T-08564 D-14 and D-14a P-1/P-2 gates prove preview plan and prompt parity, one admitted connection and release identity, and unchanged non-preview routes
last_verified: 2026-09-17 T-08562 amendment accepted by mable EN-13464; Daedalus approval and implementation pending; 2026-09-17 T-08564 revision 4 design approval; implementation and installed evidence pending; 2026-09-17 T-08560 design approval EN-13058 on 038454ba; 2026-09-16 T-08556 design approval on 91a7d9c3; prior T-08542 design approval plus T-08553 amendment approval EN-12927 and shared max3 acceptance (Astra EN-12934), plus T-08554 amendment approval EN-12940
reopen_when:
  - the non-Codex interactive route, its hosting-evidence requirement, the codex-app-server exemption, or the set of drivers excluded from the route changes
  - the configured route or fallback behavior changes
  - declaration or preview observation stops sharing the configured endpoint and hello admission boundary or one preview can combine aspd release identities
  - the interactive birth door set, door class, launch-carried prompt freezing, keyed interactive resume, route fence, or keyless-door prepared behavior changes
  - per-request presentation precedence, accepted values, doors, persistence, or existing-scope behavior changes
  - node-default presentation routing, the Codex redirect control's scope, or omitted-choice live-runtime delivery changes
  - preparation connection negotiation or release selection changes
  - boundary-P or start-graph persistence ordering changes
  - prepared retry auto-launch uncertain-start or idempotency semantics change
  - worker launch path hello release binding or retained-release validation changes
  - reattachment depends on aspd or stops verifying the candidate worker release
  - attached-run door selection, registered-start joining, identity-bound initial-prompt delivery, durable interactive substrate, or interactive execution-release binding changes
  - caller identity environment lifecycle resource-ownership projection or acknowledgement authority changes on this route
