required_tests:
  - just architecture-records
  - v2 preparation atomically persists the complete selected response before hosting, and launch consumes only reread frozen bytes
  - same-key retry resumes frozen v2 bytes; no retry restart or warm path re-resolves ASP selection or replays uncertain invocation.start
  - generic execution.hosting allocation and all-driver hostedDrivers proof gate every birth; presentation false does not remove required process-container resources
  - activation preflight rejects nonzero incompatible harness-broker prepared operations; it rejects format-1 accepted headless runs without dispatched input and reports format-2 unlanded protected inputs without inventing a run, terminal, or cleanup release, and is rerun immediately before ASP activation
  - T-08207 rev11 freezes the explicit selector before compile in preparation and invocation; F2 has initialInputId/no runId, retry rereads it, a selector mismatch has no effect, and launch-argv-only F2 refuses before P
  - retained v1 durable brokers prove stable runtime invocation and continuation IDs through tmux replay input interrupt and terminate without parsing v1 plan or lastAppliedIntentJson
  - an active external participant attempt is drained or retired rather than reconnected through prepared_profile_json
  - isolated A-to-B acceptance records the rollback pair before first v2 persistence, proves HRC B rejects ASP A/v1 compile before P, observes selected and running ASP B identities, then proves a fresh v2 birth and dead-seat v2 reprovision using old continuation
  - corrupted frozen execution release, unavailable aspd before boundary P, and post-boundary release/worker mismatch refuse without fallback or reprepare
last_verified: final ASP v2 installed acceptance proved 9/9 harness/presentation/default cases, 8/8 invalid-wire refusals, four accepted identities, and agent-harness default against source 631e7b246aaede313ee6e0aacd71e766f26ae07c / tuple 0.1.1-dev.20260921215301 / release asp-631e7b246aae-20260922T025351Z-01f30b; HRC implementation, activation preflight and coordinated installed acceptance pending
reopen_when:
  - ASP v2 compile request/response, selected execution, release identity, or hosting declaration changes
  - boundary-P persistence ordering, retry, replay, dispatch, worker release validation, or frozen execution-format selection changes
  - reuse, presentation mismatch, startup reattachment, opaque v1 attach-fence, continuation, or external participant disposition changes
  - activation preflight, matched HRC/ASP ordering, rollback boundary, or fix-forward law changes
  - any fallback, v1 selector adapter, profile/target resolution, driver exception, or old-plan parser is introduced
