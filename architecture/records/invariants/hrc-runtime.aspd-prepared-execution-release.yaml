id: hrc-runtime.aspd-prepared-execution-release
kind: invariant
status: active
owner_project: hrc-runtime
scope: HRC-hosted broker preparation (codex-app-server, claude-code-tmux and pi-tui-tmux), release binding, hosting evidence, launch, reattachment, and declaration or preview observation through configured aspd
predicate: >
  When HRC_ASPD_SOCKET is configured, an HRC-hosted headless
  codex-app-server runtime with effective operator presentation none prepares
  only through
  one per-preparation connection to that absolute node-local endpoint. HRC
  requires aspc/0.1, Unix transport, compileHarnessInvocation capability, and
  service release identity; it neither requires a cohosted broker nor falls back
  to an HRC-spawned compiler. Before any worker-hosting effect, one transaction
  commits the complete successful compile response, execution release, exact
  worker launch description, HRC-composed dispatch environment and lifecycle
  overlay, identity allocation, admission results, and dispatch idempotency key
  as a prepared runtime operation. Launch takes only that operation identity,
  rereads and validates the persisted bytes, and never re-prepares or rebinds
  them to the active ASP release. The worker executable resolves within the
  retained release whose manifest identity matches the frozen release, its argv
  is the frozen ASP prefix plus HRC-owned hosting flags, and its hello protocol
  and compiled release identity must match before invocation.start. The complete
  start graph, actual hosting binding, negotiated protocol, release identity,
  caller identity fences, dispatch environment, and lifecycle policy commit
  before invocation.start. A prepared operation proves no invocation.start was
  submitted and may be resumed only by an explicit same-host-session,
  same-idempotency-key caller retry; startup never auto-launches it.
  Interactive and headless preparations freeze the caller's key alike. A
  resume launches only a preparation of the route the retry selected;
  otherwise it refuses with the HRC-internal reason
  aspd_preparation_route_changed and the operation stays prepared. A door that
  carries no caller key, including the mail kicker, never resumes a prepared
  operation, and the kicker's classification of a thrown dispatch as uncertain
  is unchanged. Once the
  start graph commits, a missing or failed start result never authorizes an
  automatic invocation.start replay, and a transport-uncertain start remains
  uncertain. Active worker control, event replay and acknowledgement, and daemon
  restart reattachment use the persisted endpoint and identity without aspd;
  reattachment verifies the frozen worker protocol and release identity on the
  candidate connection before attach. Other harness and presentation routes,
  participant establishment, caller-policy and admission authority,
  continuation selection, environment ownership, HRC resource ownership, and
  projection-before-acknowledgement laws remain unchanged. [T-08562: Claude and Pi TUI broker births
  are on this route; pi-sdk, codex-cli-tmux, hosted participant brokers and the
  Codex Desktop observer are not.] Effective operator
  presentation is an explicit per-request presentation.operator none when
  present, otherwise the node default unchanged; an explicit none also exempts
  that Codex dispatch from the node's Codex interactive redirect, as a
  responseFormat does, while an explicit choice changes no omitted-choice
  routing; the
  request choice is accepted
  only as none, only on the headless broker route and never with a viewer
  placement, is persisted in the applied intent and route decision with its
  source, is never re-evaluated when a frozen preparation resumes, and never
  replaces a live runtime: a live runtime of the scope whose presentation is not
  none, whether a tmux-tui viewer or an interactive tmux surface, refuses the
  request with presentation_conflict and is left untouched. As amended for the
  explicit app-server viewer, presentation.operator also accepts tmux-tui, which
  exempts that Codex dispatch from the interactive redirect and places the
  headless codex-app-server with HRC's tmux-tui renderer viewer on this route,
  while an omitted choice resolving to a node-default tmux-tui is governed by
  the node-default amendment below; both accepted values are refused off the
  headless
  codex-app-server broker route; any request whose presentation differs from
  the scope's live runtime is refused with presentation_conflict and left
  untouched. Such an attempt freezes its tmux-tui presentation and observer
  socket in the launch description, launches only on the tmux-tui substrate from
  those persisted bytes, and its renderer runs from the same execution release
  as the worker. Operator attach to a live operator-attachable headless broker
  runtime returns its existing attach descriptor without interactive admission,
  stale-marking or reprovision, and attach, detach and reattach never require
  aspd or change worker identity or execution release. As amended for the
  node-default app-server viewer, the route also covers an omitted choice whose
  node default is tmux-tui, recorded with operatorPresentationSource
  node-default. The Codex
  interactive redirect control no longer decides whether an explicit interactive
  Codex intent is admissible; with the control on, Codex start and dispatch
  routing is otherwise unchanged. With the control off, a non-interactive Codex
  request without an explicit presentation is routed by its scope's established
  runtime, meaning the most recent harness-broker runtime of the host session
  whose status is neither unavailable nor failed, of any provider, harness,
  driver or invocation state, before
  responseFormat, actuator-split or node defaults are considered. A tmux
  transport selects interactive admission, which alone decides reuse, birth
  join, refusal or fenced replacement, and which the actuator-split route
  admission refuses for high-risk requests. A headless transport of the same
  provider and harness selects the headless route. A headless transport of any
  other provider or harness refuses established_runtime_harness_mismatch without
  effect. An in-flight start is routed by its recorded birth transport,
  provider and harness, awaiting only that decision and never the boot: a
  same-harness birth selects its transport's admission, and a same-harness tmux
  birth is joined only when interactive admission, evaluated against the
  newborn with the caller's surface-reuse policy and ownership proof, decides
  broker-reuse; every point that joins an in-flight start re-derives the route
  from the birth it actually joins and refuses an unrecorded, foreign or
  differently routed start, so a start swapped in after routing is never
  consumed under the earlier route; a foreign-harness birth
  refuses before effect (established_runtime_harness_mismatch for headless,
  start_in_flight_harness_mismatch for tmux, since a newborn is never
  admission-replaced), and a start that recorded no birth is awaited in full and
  never treated as absent. No rule starts a runtime of another transport beside
  an established one. With nothing established, the request runs headless
  codex-app-server
  with the node presentation default on this route. An intent that arrives
  interactive goes to interactive broker admission for the interactive Codex
  app-server TUI backend, whose births on a configured node are aspd-prepared
  as amended below. No rollback pairs a
  release that gates interactive Codex admission on the redirect control with
  that control off. Every aspd compile on this route carries HRC's resolved
  ASP_HOME as the request aspHome and records it in the route decision, so the
  worker's codex home, and therefore continuation resume, is the same store the
  standalone interactive route uses, independent of the aspd daemon environment.
  As amended for every supported broker birth, the same aspHome governs Claude
  and Pi bundle materialization, so a bundle prepared on either route is the
  store the other route uses; Claude continuation transcripts live in the
  native Claude configuration and are independent of it.
  As amended for every interactive Codex birth door, on a configured node
  every new interactive codex-app-server birth prepares through aspd,
  whichever door requests it: attached run, cold attach, turn dispatch, mail
  summons, submission doors, target and selector messages, reprovision,
  explicit start, ensure, rotation relaunch, or a received federation claim.
  It freezes route interactive-codex-tui, presentation codex-tui, its door
  class (attached-run or interactive-birth), and the interactive start request
  at boundary P. It requires durable IPC and launches
  only on the interactive tmux substrate from the persisted preparation. The
  worker, codex-tui wrapper, and hook receiver all execute from that frozen
  execution release; there is no resolver or facade fallback. No interactive
  codex-app-server birth on a configured node is facade-prepared or
  resolver-launched, and none falls back when aspd or launch validation
  refuses. A refusal before boundary P leaves no operation, runtime, lease, or
  tmux server. A refusal after it leaves the operation prepared with its
  refusal recorded. For the attached-run door (hrc run, hrc resume),
  selection, birth, and initial-prompt delivery occur inside one operation
  registered in the host session's start singleflight. Before joining an
  existing operation,
  the door classifies its recorded birth and refuses a foreign provider or
  harness; after a same-harness or unrecorded operation settles, the door
  re-enters and registers its own operation carrying the joined newborn's
  identity. A joined tmux newborn is reusable only when provider and harness
  match and interactive admission against that newborn and the caller's intent
  decides broker-reuse; it is never admission-replaced. A joined or established
  headless runtime is never stale-marked, replaced, or started beside: only a
  settled operator-attachable openai codex-cli viewer is reused, while a
  no-viewer, transitional, or foreign runtime is refused and left untouched.
  Explicit force-restart may replace only when no live joined newborn governs
  the selection. On the attached-run door an initial prompt is not part of the
  frozen start request; after attached-start resume it is submitted exactly
  once by the selected runtime's identity-specific input executor under turn
  admission, before the registered operation is removed. A cold-birth prompt
  carried by any other door is compiled into the preparation exactly as the
  facade compiles it, with its priming replaced for a launch-primed summons
  and appended for a submission door. It is persisted only in the frozen start
  request, recorded as launch-carried with its priming mode, and never
  persisted in the applied intent. It is reported to the dispatch door as
  launch-carried only after boundary P commits an admitted interactive
  profile, so the dispatch door never submits it separately. A prepared
  operation proves the prompt was never applied. No session-level reselection,
  admission,
  stale-marking, or reprovision may redirect that prompt. Detach, reattach,
  and daemon restart of the resulting runtime do not require aspd. A door that
  replaces a live runtime stale-marks it before preparation, as on the facade
  route, so a preparation or pre-start launch refusal leaves that scope with
  no live runtime until its next birth. Ensure births stay unregistered in the
  start singleflight.
  As amended for every supported broker birth, on a configured node every new
  interactive claude-code-tmux and pi-tui-tmux birth prepares through aspd by
  the same doors, door classes, launch-carried prompt, keyed resume,
  keyless-door, stale-mark ordering, no-fallback, durable-IPC and reattach
  rules as an interactive codex-app-server birth, freezing a non-Codex
  interactive route with its admitted driver, that driver's hosting paths and
  the leased TUI presentation. A launch-carried prompt for these drivers is
  frozen only where the compiler places it in the start request (the harness
  launch prompt), never as broker initial input and never in the applied
  intent, and its run provenance is the launch-argv class: no dispatched input
  id, the launch-carried invocation marker for submission doors and the mail
  kicker. HRC admits an interactive preparation by hosting requirements
  (interactive tmux terminal, supported worker protocol, durable IPC, and
  equality with the driver the door requested), never by a driver-name list.
  Before launching any selected driver other than codex-app-server, HRC
  requires the frozen executionRelease.worker.hostedDrivers to contain that
  driver, before boundary P and again from persisted bytes at launch; absence
  or mismatch refuses aspd_worker_hosting_unproven with no hosting effect.
  codex-app-server remains admissible without that evidence. A keyed resume
  launches only a preparation whose frozen route and driver both match the
  retry's selection; otherwise aspd_preparation_route_changed. The deprecated
  codex-cli-tmux driver and the non-interactive pi-sdk driver are not on this
  route, and HRC never requests a pi-sdk preparation from aspd. Declaration and preview observations share this configured
  endpoint and hello admission boundary without creating or resuming a prepared
  operation. Both calls composing one preview use one admitted connection and
  one aspd release identity.
