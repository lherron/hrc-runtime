id: hrc-runtime.verify-gate
kind: invariant
status: active
owner_project: hrc-runtime
scope: declared repository landing gate
predicate: >
  The declared verify gate checks architecture records and their generated
  projections, and runs the path-scoped cargo leg when Rust inputs changed. It
  runs no Bun suites (Lance ruling 2026-10-26). Build, structural checks, lint,
  types, Bun tests and the fixture-owned federation loopback corpus live in
  `just verify-bun`, which only an operator or agent runs by hand for a Bun/TS
  change. Enforcement note (T-10161):
  `just verify` runs after each push to main on mini's self-hosted runner
  (`.github/workflows/post-push-verify.yml`), not in a git hook. The pre-push
  path runs lock-hygiene and architecture-records under `piped: true`, then
  hands the refs to the best-effort `git.push` producer; tracked executable
  `.githooks/post-commit` enters the best-effort `git.commit` producer.
authority: wrkq:T-06958
source:
  - justfile
  - lefthook.yml
  - .githooks/post-commit
  - .github/workflows/post-push-verify.yml
  - package.json
  - scripts/check-architecture-records.ts
  - scripts/lefthook-boundaries.test.ts
required_tests:
  - just architecture-records
  - just verify
last_verified:
  date: 2026-09-05
  evidence: T-08054 landing `just verify` green with the hook topology above
reopen_when: The verify recipe or repository validation topology changes.
supersedes: []
superseded_by: []
