id: hrc-runtime.ledger-tool-result-storage
kind: invariant
status: active
owner_project: hrc-runtime
scope: broker and lifecycle ledger retention, tool-result storage and federation
predicate: >
  Outside an explicit include-ledgers runtime cascade and the mark-gated runtime
  prune, broker_invocation_events and hrc_events rows and their tool-result bytes
  remain keep-forever. The mark-gated prune deletes a terminal runtime's cascade,
  ledger rows included, only when the node has a configured window, the runtime's
  updated_at is older than that window and earlier than the lake mark's
  reconciled_at, the mark's incarnation and both anchor rows (primary key and
  creation timestamp) match this database, the runtime's highest hrc_seq and
  broker event id are strictly below the anchor keys, and the native prune guards
  pass; otherwise it deletes nothing. hrc_events rows with no runtime are never
  pruned. A ledger row's ts or time is never rewritten after insert. HRC removes
  duplicate envelope payloads and stores every tool result whose serialized value
  exceeds 32768 UTF-8 bytes once in tool_result_blobs inside state.sqlite, in the
  same transaction as deterministic excerpt stubs in the ledger rows. Ordinary
  reads and live notifications hydrate those stubs; only the dedicated federation
  read paths expose persisted stubs. Federation schedules the local-blob feed
  before the ledger feeds and transfers blobs using globally unique deterministic
  identifiers and addressed, idempotently staged parts no larger than 256 KiB;
  imported blobs are not re-forwarded. A missing or incomplete blob remains observable as its excerpt
  and increments ledger.blob_miss rather than making its ledger row unreadable.
  The current authority is the SQLite blob table, without a filesystem carrier,
  content hash, feature flag, or any standing ledger TTL other than the
  mark-gated window.
authority: Lance ruling, 2026-08-26; daedalus@hrc-runtime:T-07598 rev 4 approval, 2026-08-26; Lance rulings 2026-11-09 (14-day hot window, lake mark replaces the pre-prune snapshot); hrc-analytics prune contract draft 5 approved by Daedalus 2026-11-09 (EN-48815)
source:
  - wrkq:T-07598
  - hrcchat#21220
  - wrkq:T-12855
  - docs/state-retention.md
required_tests:
  - just architecture-records
  - T-12855 prune contract gates 1, 2 and 5 on a real ledger copy and a scratch daemon
  - T-07598 store transaction, threshold-parity, dedupe, hydration, and missing-blob gates
  - T-07598 bounded raw-row federation, multipart retry, identity-isolation, and hrcdev round-trip gates
last_verified: 2026-08-26 design approval; implementation gates pending
reopen_when: Ledger retention, spill threshold, carrier authority, hydration visibility, blob identity, federation ordering or retry semantics, or deletion authority changes.
