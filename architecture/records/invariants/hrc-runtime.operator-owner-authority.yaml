id: hrc-runtime.operator-owner-authority
kind: invariant
status: active
owner_project: hrc-runtime
scope: credentialed callers of native HRC runtime termination
predicate: >
  POST /v1/terminate preserves its existing behavior when no lifecycle
  header is presented. Any x-hrc-lifecycle-* header on this route requires
  verification through the daemon's existing lifecycle credential
  binding and a Mable primary scope, using the same predicate as restart.
  Terminate additionally admits a verified caller whose scope matches the
  target runtime's stored scope, including other lanes of the same seat, and
  a verified caller that is the node's own Mable seat (mable@<project>:minisvc
  on svc, mable@hrc-runtime:hrcdev on hrcdev, declared node id only), for any
  runtime on that node; this is the predicate restart already uses for a
  node-local caller.
  Partial, invalid, mismatched and revoked credentials fail closed with HTTP
  403, server_lifecycle_refused and the lifecycle refusal detail before
  route side effects. Claimed caller headers alone confer no authority.
  Restart and stop retain their existing authority contract. The unserved
  native tmux kill route is excluded. The guards on prune, sweep,
  reconcile-active, drop-continuation and federation retire are withdrawn
  under T-12662 etag 7; those routes are outside the campaign's prae surface.
  This is an honest-caller rule, not a security boundary against headerless
  callers; headerless dispatch after prae credential discovery fails is
  explicitly unsupported under T-12662 etag 6 and retained in etag 7.
authority: >
  wrkq:T-12662 etag 4 (Daedalus approved); wrkq:T-12664 (Mable dispatch
  and tmux exclusion, 2026-11-05). T-12662 etag 7 and EN-47477 narrow the
  scope on Lance's instruction to terminate only, withdrawing the five
  other guards without changing the retained owner admission boundary.
  Lance ruling 2026-11-09 (asks row node-seat-archive, recorded on T-12984):
  node Mable seats may archive any runtime on their own node.
source:
  - wrkq:T-12662
  - wrkq:T-12664
  - crates/hrc-native/src/server.rs
  - crates/hrc-native/src/server/lifecycle/lifecycle/authority.rs
  - crates/hrc-native/src/server/lifecycle/lifecycle/credentials.rs
  - crates/hrc-native/src/server/lifecycle/lifecycle/operator_tests.rs
required_tests:
  - cargo test --manifest-path crates/Cargo.toml -p hrc-native --locked operator_authority_tests
  - just architecture-records
last_verified: 2026-11-09 dispatcher fixture, including terminate_node_mable_seat
reopen_when: The protected route set, headerless compatibility, credential verification, Mable-primary predicate or terminate scope ownership changes.
supersedes: []
superseded_by: []
design_review: >
  2026-11-05 EN-47477 scope correction: read T-12662 etag 7 and the current
  shared check. The narrowed predicate is desired law; removal of the five
  guards remains implementation work and is not attested here. The prior
  last_verified is historical evidence for T-12664, not proof of this removal.
