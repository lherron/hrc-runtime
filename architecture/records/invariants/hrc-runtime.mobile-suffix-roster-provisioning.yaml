id: hrc-runtime.mobile-suffix-roster-provisioning
kind: invariant
status: active
owner_project: hrc-runtime
scope: HRC-owned mobile suffix-roster placement and federated provisioning
predicate: >
  Mobile suffix-roster families are finite. Every enabled ACP quick-pick base
  has a concrete declared home before the surface is enabled. A declared base
  reserves every member produced by HRC's fixed ordered suffix list on that
  home, and profile validation rejects pins or homes for reserved members. An
  undeclared family may instead use an explicit typed provision.node directive;
  it is validated at both origin and receiver against the federation registry
  and the receiver's own declaration observation. An unavailable or incompatible
  receiver observation is the existing retryable runtime_unavailable and is
  never projected as undeclared placement; any placement conflict is a typed
  refusal before mutation. No placement is inferred from caller identity,
  transport, connection, or environment. Origin HRC routes the whole family
  from registry binding state and the baseSessionRef-derived family home. A remote home is
  invoked only through the authenticated, capability-advertised rosterStart
  peer verb. The receiver independently preflights retirement, authority,
  binding state, placement, and materialization capability for the whole family
  before mutation, localizes the runtime intent, and then owns the roster claim
  and durable idempotency record. Callers omitting materialization retain
  claim-and-start. For the closed first_turn mode, the localized intent,
  successor, continuity, and claim row commit atomically for mint and recycle;
  the awaiting successor is not a free roster slot, creation returns
  awaiting_first_turn with a nullable runtime id, and the first real broker
  input materializes it without an empty turn. Replay validates the request hash
  and audits every generation from active continuity back to the recorded
  successor through the successor-host claim index. Missing rows inherit
  ownership through ordinary rotation, the same key is consistent, and any
  different key on an active or archived intermediate generation returns
  roster_claim_superseded. New peers forward and parse this shape; old homes
  reject the unknown field before mutation and old callers retain started
  responses. Operator starts without an explicit node directive remain
  explicit-local. Retryable peer failure is synchronous runtime_unavailable and
  does not use the message outbox.
  T-13458 adds the distinct conflictPolicy confirm on the same roster placement,
  preflight, FREE predicate and namespace claim gate. Legacy suffix is unchanged.
  An unconfirmed free base claims normally; an occupied base returns 409
  session_scope_confirmation_required with detail.scopeConfirmation containing
  baseTaskId, authoritative occupied scopeRef, sessionRef, hostSessionId,
  generation and isLive, and an exact proposedTaskId. This response claims no
  candidate and starts no runtime. confirmedTaskId must be a non-base member of
  this finite family. Confirmation atomically claims only that exact member,
  even if the base has become free; an occupied candidate returns another
  available non-base proposal without mutation, or session_roster_exhausted.
  On a re-proposal occupied identifies the blocking confirmed candidate even
  when the base is free. isLive reports nonterminal runtime presence, not the
  inverse of FREE; occupied identity is nullable only if the blocking reserved
  slot has no continuity.
  Suggestions reserve nothing. Confirm policy and confirmedTaskId are preserved
  in the canonical forwarded request and request hash. Successful claims retain
  home-owned durable replay; changed logical confirmation requests use fresh
  keys, while uncertain transport retries retain the identical request and key.
  Confirmation retains runtime-intent, retirement, authority, placement and
  capability admission. Remote confirmation additionally requires the home peer
  capability rosterConfirmation, and never downgrades to suffix. Older HRC
  rejects the unknown confirm policy before mutation. This amendment does not
  restore the currently unavailable Rust rosterStart receiver described below.
  Known gap, not enforced since the Rust cutover of 2026-10-26: the receiver
  half of the rosterStart peer verb (independent preflight before mutation,
  runtime-intent localization, and home-side ownership of the claim and
  durable idempotency record). Today a remote-home rosterStart between Rust nodes is
  a safe refusal before any mutation: the Rust peer listener advertises no
  rosterStart capability and answers POST /v1/federation/roster-start with 404
  peer_upgrade_required, and the origin's claim_start refuses with 409
  stale_context reason peer_upgrade_required (retryable false) without sending
  the start. wrkq:T-11933 (native peer listener: home-side roster-start,
  exact-start and establish) restores the receiver.
