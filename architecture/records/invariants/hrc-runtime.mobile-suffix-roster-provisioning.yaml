  - live multi-node undeclared-family directive and declared-family conflict proof
  - wrkq:T-08407 atomic deferred-intent, awaiting occupancy, full-chain replay ownership, federation compatibility, and first-turn materialization gates
last_verified: 2026-08-21 existing claim-and-start law; wrkq:T-08407 revision 4 amendment approved 2026-09-12 with implementation evidence pending
reopen_when: >
  The mobile base set, fixed roster suffix list, reserved-family placement
  derivation, explicit provision directive admission, peer rosterStart contract,
  materialization mode, awaiting-first-turn or FREE semantics, atomic intent
  ownership, full-chain replay ownership, federation response compatibility, or
  home-local idempotency ownership changes.
