id: hrc-runtime.collaboration-presentation-authority
kind: invariant
status: active
owner_project: hrc-runtime
scope: who HRC speaks as in the wrkq collaboration ledger, what makes an envelope presented, what discharges an obligation, how a presentation is disposed, and the one canonical turn-response projection that survives the retired auto-reply
predicate: >
  HRC presents envelopes, writes presentation receipts and failure dispositions
  as agent:hrc, and never authors an envelope as an agent principal.
  An envelope becomes presented only on a LANDING FACT observed on the committed
  broker stream — submission.absorbed or submission.executed for a submission,
  the first turn.started of the launch-produced runtime for a launch-carried
  body — never on admission. A receipt names the runtime and generation the body
  landed in and an opaque presentation id; no run or turn identity participates
  in presentation, discharge, or disposal.
  Turn completion discharges no obligation. Discharge is only an explicit reply,
  a defer, an operator ack, consumed_by_wait, fyi_presented, or an HRC failure
  disposition.
  Disposal is keyed by runtime and ledger sequence: the reminder and
  failed:ignored follow turn terminals observed for the presented runtime, run
  or no run, and failed:runtime_terminated follows that runtime's termination.
  A refused or lost submission clears HRC's outstanding record and re-delivers
  under policy; it never fails an envelope.
  Delivery intent is durable in HRC's store before any submission is made, one
  envelope per submission, correlated by origin.envelopeId, and reconciled
  against committed broker evidence at daemon start, at runtime termination, and
  periodically; an envelope with an open intent is never actionable. A
  launch-carried presentation lands on the first turn start of the runtime the
  launch produced and is recorded as launch_carried.
  Presentation is at-least-once: HRC's write-ahead intent makes every HRC-side
  crash yield at most one receipt and no redelivery, while a broker failure
  between applying a body and emitting its landing fact may cause one
  redelivery — the bounded window of accepted risk
  wrkq.collaboration-ledger.at-least-once-presentation.
  One run has one canonical turn-response projection, produced by the shared
  projectSemanticTurnResponse/finalizeSemanticTurnResponse path. For one run the
  projection reads turn.message rows in hrc_seq order, drops text-empty rows, and
  selects the last remaining row marked final=true, or the last remaining row
  when no row is flagged. It consults the raw runtime buffer only when no
  non-empty turn.message row exists, then falls back to the run error message,
  and preserves TURN_TEXT_LIMIT truncation and its marker. Runtime buffers remain
  raw transport evidence, not canonical response state when a semantic message
  exists. Response finalization, dispatcher finalOutput and transcript indexing
  consume this one projection without reimplementing it. That body is evidence
  about what a turn said and is never a reply, an obligation disposition, or
  reply-body authority.
  hrcmail_* rows remain local delivery-intent, presentation, reminder,
  failure-notice and recovery bookkeeping; they are not room, envelope,
  obligation, discharge, or reply-body authority.
