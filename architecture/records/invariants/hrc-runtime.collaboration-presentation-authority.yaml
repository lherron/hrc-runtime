required_tests:
  - just architecture-records
  - a completed driven turn with a non-empty final response mints no envelope, leaves the envelope presented, and arms the reminder
  - the forward migration drops hrcmail_auto_reply_intents and every hrcmail_drive_attempts.auto_reply_* column, and a legacy store carrying a pending intent row loses it
  - the forward migration deletes hrcmail_drive_attempts, its slot and presentation children, and backfills every runtime-bound receipt into hrcmail_presentations with its disposition intact
  - the delivery intent is committed before any door is called, is unique per envelope, and makes that envelope unactionable until it lands or is cleared
  - a receipt is written only on submission.absorbed, submission.executed, or the launch-produced runtime's first turn.started, and carries no run id
  - a rejected, lost or TTL-expired submission clears the intent, re-wakes the target, and leaves the envelope pending with no failure
  - reconcile at daemon start, at runtime termination and on the sweep writes exactly one receipt for a landing HRC never observed live
  - a turn terminal on the presented runtime arms one reminder; a terminal after the reminder landed fails the envelope ignored; both with no run row present
  - final-flag selection, unflagged last-non-empty fallback, empty-final fallback, raw-buffer-only fallback, and truncation cases
  - canonical projection parity across response finalization, dispatcher finalOutput, mail inspect, and transcript indexing
  - reply-is-ack, defer, operator ack, consumed_by_wait, fyi_presented, failed:ignored and failed:runtime_terminated remain the only dispositions
last_verified:
  date: 2026-09-05
  evidence: T-08093 landed D1 — auto-reply-handlers.ts, the candidate/intent schema and the wrkq.auto_reply.* log surface deleted; migration 0057 drops the table and columns; installed activation smoke on max3 recorded in the T-08093 artifact_dir. T-08094 landed D2/D3 — the drive attempt, slot, held batch and claim CAS deleted, migration 0058 introducing hrcmail_delivery_intents/hrcmail_presentations, and the write-ahead, landing-fact, refusal and runtime-keyed disposal gates in packages/hrc-mail-kicker/src/__tests__/t08094-steer-first-delivery.test.ts.
reopen_when:
  - HRC gains any path that writes to the collaboration ledger as a principal other than agent:hrc
  - turn completion, or any other implicit signal, becomes a discharge
  - the closed set of dispositions changes
  - the canonical turn-response projection or its truncation semantics change
  - a second reader of the turn-response body appears instead of consuming this one
  - presentation stops being a landing fact, or a run or turn identity re-enters presentation, discharge or disposal
  - delivery stops being write-ahead, or a submission carries more than one envelope
  - the at-least-once guarantee or its bounded broker window changes
