id: hrc-runtime.collaboration-presentation-authority
kind: invariant
status: active
owner_project: hrc-runtime
scope: who HRC speaks as in the wrkq collaboration ledger, what makes an envelope presented, what discharges an obligation, how a presentation is disposed, and the one canonical turn-response projection that survives the retired auto-reply
predicate: >
  HRC presents envelopes, writes presentation receipts and failure dispositions
  as agent:hrc, and never authors an envelope as an agent principal.
  An envelope becomes presented only on a LANDING FACT observed on the committed
  broker stream — submission.absorbed or submission.executed for a submission,
  the first turn.started of the launch-produced runtime for a launch-carried
  body — never on admission. A receipt names the runtime and generation the body
  landed in and an opaque presentation id; no run or turn identity participates
  in presentation, discharge, or disposal.
  Turn completion discharges no obligation. Discharge is only an explicit reply,
  a defer, an operator ack, consumed_by_wait, fyi_presented, or an HRC failure
  disposition.
  Disposal is keyed by runtime and ledger sequence: the reminder and
  failed:ignored follow turn terminals observed for the presented runtime, run
  or no run, and failed:runtime_terminated follows that runtime's termination.
  A submission permits body retry only on correlated positive evidence that it
  was not written or that this exact input was removed. Broker queue withdrawal
  or expiry qualifies only before driver application; native recall qualifies
  only when it proves removal of this exact input.
  Rejection reasons, acceptance, missing identity, RPC failure, post-write
  cancellation or loss, runtime termination, teardown and TTL do not prove that.
  Possible-write ambiguity retains the durable intent without body reinjection,
  presentation, or nonlanding strikes. A possibly_written input.rejected is
  diagnostic and remains eligible for later consumption evidence; absent
  deliveryEvidence conveys uncertainty. Proven no-write refusals retain bounded
  backoff and undeliverable policy. A safely retryable refused STEER re-delivers by
  refusal CLASS, read from the broker's own admission layer: a capability-layer
  refusal is a fact about the driver and the next delivery takes the enqueue
  door, while a state-, policy-, authority- or execution-layer refusal is a fact
  about the instant and the next delivery retries the steer door after a bounded
  backoff. HRC never treats a transient refusal as a capability verdict.
  Delivery intent is durable in HRC's store before any submission is made, one
  envelope per submission, correlated by origin.envelopeId, and reconciled
  against committed broker evidence at daemon start, at runtime termination, and
  periodically; an envelope with an open intent is never actionable. A
  launch-carried presentation lands on the first turn start of the runtime the
  launch produced and is recorded as launch_carried.
  Missing submission identity is recoverable only from one distinct committed
  admission matching the intent's exact runtime, invocation, origin.envelopeId
  and broker sequence lower bound captured before dispatch. Zero or multiple
  candidates, an unproven legacy cursor, or an unconfirmed invocation change
  remains uncertain; a known submission is never rebound. The canonical HRC
  cursor cannot bound provenance-only admission events. Retry evidence is
  durably recorded before releasing the old fence; delayed earlier admissions
  cannot identify a later attempt. An unidentifiable launch retains uncertainty
  and cannot authorize another birth to settle it.
  Local landing bookkeeping precedes the wrkq receipt and retries that receipt
  under the same pre-minted presentationId/driveAttemptId after transport failure
  or a crash. Local-only presentation does not establish reminder, D3 disposal,
  or runtime-lapse eligibility: those require committed receipt success.
  Successful receipt completion clears its intent, preserving legitimate
  pointer and reminder delivery. A lost landing fact after possible application
  now retains uncertainty rather than exercising the former HRC loss/TTL
  redelivery permission; this does not amend wrkq's own accepted-risk record.
  Independent envelope terminality retains unresolved delivery as an inspectable
  terminal hold, excluded from routine wake and periodic candidate sets while
  correlated late evidence still updates it. Late landing sends no new receipt
  and never reopens the envelope. A local-only presentation refused by wrong_state
  is disposed terminal_before_receipt without inventing a presented obligation.
  FYI receipt terminality is its own idempotent completion, not revocation.
  Terminal cleanup uses the existing broker withdrawal selector once, recording
  request intent and outcome. Exact queue removal before application proves
  removal; aggregate envelope-selector success, not_held, unknown, unavailable
  and RPC failure do not prove this attempt was removed. Broker-held withdrawal
  does not clear already injected native text. Launch has no submission to
  withdraw, and cleanup uncertainty never authorizes native clearing, destructive
  retry or runtime teardown. Aging may expose uncertainty once, never erase it.
  One run has one canonical turn-response projection, produced by the shared
  projectSemanticTurnResponse/finalizeSemanticTurnResponse path. For one run the
  projection reads turn.message rows in hrc_seq order, drops text-empty rows, and
  selects the last remaining row marked final=true, or the last remaining row
  when no row is flagged. It consults the raw runtime buffer only when no
  non-empty turn.message row exists, then falls back to the run error message,
  and preserves TURN_TEXT_LIMIT truncation and its marker. Runtime buffers remain
  raw transport evidence, not canonical response state when a semantic message
  exists. Response finalization, dispatcher finalOutput and transcript indexing
  consume this one projection without reimplementing it. That body is evidence
  about what a turn said and is never a reply, an obligation disposition, or
  reply-body authority.
  hrcmail_* rows remain local delivery-intent, presentation, reminder,
  failure-notice and recovery bookkeeping; they are not room, envelope,
  obligation, discharge, or reply-body authority.
