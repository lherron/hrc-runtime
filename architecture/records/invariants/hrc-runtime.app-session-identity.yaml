id: hrc-runtime.app-session-identity
kind: invariant
status: active
owner_project: hrc-runtime
scope: HRC app-session identity, route ownership, and harness birth correlation
predicate: >
  An HRC app session has one persisted identity app:<appId> with lane
  <appSessionKey>, both agent-scope tokens when minted, distinct from agent
  ScopeRef grammar, which continues to reject it; store mappings classify it
  without rejecting. App identity is app-route-only: generic session-addressed
  handlers refuse app sessions at entry before effects, except runtime-id live
  control, teardown, reads, and generic clear-context. Every app write, birth,
  and input for a selector runs under one non-reentrant per-daemon owner held
  from before resolution until its trailing writes and launches settle, and
  fences on managed row, continuity, and host-session generation. Creation,
  reactivation, rotation, and removal commit their identity rows in one
  transaction. Forbidden identity environment is refused before identity is
  written, and a later refusal on stored input preserves committed identity.
  Each selector has at most one live identity; births and input occur only on
  it; a launch failure after commit preserves identity for retry. Every app
  harness birth carries HRC-owned host session and generation, and a run id only
  through a single-use grant issued under the selector owner for a run id
  reserved in the daemon's run-id ownership registry, which every writer of a
  run row or run-id handle observes, for the dispatch or start that this birth
  carries. No runtime or contribution outside an app run's own host session can
  ever name that run as active; the run is never matched from an existing row
  or taken from supplied or stored correlation, and an app run id that already
  exists is refused before effects. App birth correlation carries no sessionRef,
  derived agent identity, or caller identity key. App scopes are excluded from
  agent-addressed enumerations and mail decisions. A configured local persona
  allowlist refuses app minting, birth, dispatch, rotation, and input before
  effects, and status capabilities report it.
