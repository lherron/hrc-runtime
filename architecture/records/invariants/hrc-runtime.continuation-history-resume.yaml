  - T-07899 key-retention, automatic-reuse suppression, and resolve-exposure gates
  - T-07899 barrier-neutral selection and locked exact-key successor gates
  - T-07899 startup-repair ordering and idempotency gates
  - T-07899 installed max3 continuation-recall and historical-seat smoke
