required_tests:
  - T-10232 exhaustive HTTP door-by-driver conformance with typed production-interface boundary fakes and explicit inapplicable cells
  - T-10232 E0 refusal cells preserve session invocation broker and pane for freshContext plus format mismatch or unauthorized preempt
  - T-10232 same-key changed-format refusal and matching replay without a new run
  - T-10232 drain closure waits through leased routing and refuses new submissions on every door
  - T-10232 write-then-throw and timeout remain possible_write with protection preserved and subsequent committed landing projectable
  - T-10232 cold-launch carry per intent and internal cold-enqueue restart/drain coverage with existing queue identity preserved
  - T-10232 seal check in just check prevents executor bypasses
  - T-10232 each phase preserves just verify and supplies installed per-door admission-event and delivery evidence, including live tmux handoff and literal paste-then-Enter
last_verified:
  date: 2026-10-04
  evidence: Design approval of T-10232 etag 6 after source and active-record review; resolves F1-F7. Four-phase implementation, conformance, seal and installed acceptance evidence remain pending. No implementation gate result is asserted.
reopen_when: Admission order, door inventory or exclusions, authority or format replay checks, plan construction, drain lease lifetime, queue continuation identity or carry, per-format uncertainty and terminality, or structural/conformance enforcement changes.
