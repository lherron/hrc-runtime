id: hrc-runtime.submission-admission-pipeline
kind: invariant
status: active
owner_project: hrc-runtime
scope: common admission for HRC agent-input submission doors and continuation of admitted durable headless input
predicate: >
  Under T-10232's four-phase adoption, every HRC turn submission passes through
  one typed admission pipeline before its executor. The order is drain lease,
  retired/persona checks, fences and idempotency, participant resolution,
  ownership proof, capability and preempt authority, execution format and
  presentation, rotation, then launch-carry and observation. Pre-effect
  refusals perform no rotation, allocation, compile, body write, broker disposal
  or pane change. A replay rereads and compares the recorded frozen execution
  format before returning; a mismatch refuses and a matching replay creates
  no new work. Participants are resolved before rotation, never rotated or
  replaced by a substitute birth, and refuse freshContext. Carried ownership
  proof is checked against the current invocation on every applicable route.
  Preempt capability and principal/envelope authority are checked against the
  current invocation before rotation. HRC consumes broker capabilities and
  leaves seat busy authority and per-seat admission mechanism with the broker.
  The drain lease spans admission and routing until the route settles; the
  branded single-use plan is constructed and consumed inside that leased call
  and never returned. Lease release proves no landing or removal. Outcomes
  distinguish refused, replayed, routed and possible_write. Only pre-effect
  refusal is terminalized by the pipeline itself. Past preflight, input
  terminality requires the existing matching positive rejection or proved
  withdrawal boundary; rotation failure, route throw, timeout, missing launch
  identity, response-projection failure and caller cancellation remain
  possible_write. The pipeline preserves the route's run, input, uncertainty
  and protection state and permits later committed landing evidence. Existing
  per-format execution and collaboration terminality remain authoritative.
  The nonempty broker literal flush uses enqueue; buffering without Enter and
  empty Enter on an empty buffer remain non-submitting operations. Active-run
  contributions and raw bridge keystrokes retain their existing fences and
  join admission if they gain turn-submission behavior. Durable headless queue
  drain continues already-admitted work without re-admission, retains its drain
  lease, atomic claim, coalescing, run identity and existing disposition, and
  applies launch-carry from persisted admittedIntent, defaulting legacy rows
  to enqueue. Every admission records one nine-step trace and outcome in
  submission.admission, including explicit not-applicable, replay and
  not-reached outcomes. At the seal phase, executors require the admitted plan,
  with claimed durable queue continuation as the sole alternate construction
  entry; a check in just check forbids handler/executor bypasses and exhaustive
  door-by-driver conformance covers all submission doors.
