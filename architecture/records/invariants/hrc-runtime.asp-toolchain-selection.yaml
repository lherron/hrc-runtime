id: hrc-runtime.asp-toolchain-selection
kind: invariant
status: active
owner_project: hrc-runtime
scope: HRC-owned ASP child-process, aspd observation, and aspd-prepared worker selection and compatibility boundary
predicate: >
  T-08596 (T-08569A closure, Daedalus approval EN-14687): the ASP toolchain
  resolver is deleted and governs NOTHING on any node. There is no
  per-binary command override, no HRC_ASP_TOOLCHAIN_ROOT, no bundled
  resolveHoistedBinary arm, and no facade/broker binary selection at spawn
  time; the resolver module retains only shared selection types, the hello
  observation registry, and an admin status projection that reports the
  resolver retired with no selectable binaries. Every broker birth launches
  only from a frozen aspd preparation (worker executable and argv committed
  under hrc-runtime.aspd-prepared-execution-release); a birth with no frozen
  worker launch — unconfigured node (HRC_ASPD_SOCKET unset), deprecated
  codex-cli-tmux driver, non-interactive pi-sdk broker, legacy stdio seam, or
  local CLI preview — refuses loudly with the typed `aspd_unconfigured`
  refusal (daemon unreachable for the CLI preview: `hrc_daemon_unreachable`),
  never an ENOENT from a missing bin. The configured aspd-prepared routes
  (headless codex-app-server at presentation none or tmux-tui, interactive
  codex-app-server, claude-code-tmux, pi-tui-tmux) are unchanged: HRC spawns
  no ASP compiler child and launches the worker only from the frozen
  executionRelease, with no fallback. Incompatible facade, aspd, or broker
  protocol/capability hellos fail closed before invocation work. Admin status
  keeps the aspd service projection distinct from the retired toolchain
  projection, and the immutable installed contract set is governed by
  hrc-runtime.observable-release (aspContracts, not an ASP build tuple).
authority: wrkq:T-08596 toolchain closure amendment (Daedalus approval EN-14687, 2026-09-18); wrkq:T-08562 every supported broker birth amendment (mable acceptance EN-13464, dependency wording Astra EN-13470; Daedalus approval EN-13574 on f5940449), 2026-09-17; wrkq:T-08564 revision 4 architecture approval, 2026-09-17; wrkq:T-08560 every interactive Codex birth door amendment (mable acceptance EN-13046 under campaign P-00521; Daedalus approval EN-13058 on 038454ba), 2026-09-17; wrkq:T-08556 attached-run interactive Codex amendment (Lance authorization via Astra EN-12983; Daedalus approval of 91a7d9c3), 2026-09-16; wrkq:T-08555 node-default app-server viewer amendment (Lance authorization via Astra EN-12947; Daedalus approval EN-12956 on 494fef39), 2026-09-16; wrkq:T-08542 architecture approval, 2026-09-16; wrkq:T-08554 explicit app-server viewer amendment (Astra release EN-12934 under Lance authorization EN-12932; Daedalus approval EN-12940), 2026-09-16; wrkq:T-07764 rev 2 architecture approval, 2026-08-30
