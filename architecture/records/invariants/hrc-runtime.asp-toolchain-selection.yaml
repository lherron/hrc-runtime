required_tests:
  - just architecture-records
  - T-08596 closure: every birth with no frozen worker launch (unconfigured node, deprecated codex-cli-tmux, pi-sdk, legacy stdio seam) refuses with aspd_unconfigured; no route consults a resolver
  - T-08596 closure: admin status reports the toolchain resolver retired with no selectable binaries
  - T-08596 closure: the CLI dry-run preview compiles through the daemon with no local facade spawn
  - T-08562 configured claude-code-tmux and pi-tui-tmux births launch worker and helpers from the frozen executionRelease with no resolver consultation
  - T-08542 configured aspd route launches its worker from the frozen executionRelease with no resolver consultation
  - T-08554 explicit tmux-tui aspd route launches its worker from the frozen executionRelease with no resolver consultation, its renderer runs from that release payload
  - T-08555 configured node-default tmux-tui headless codex-app-server prepares through aspd with no resolver consultation
  - T-08556 configured attached-run interactive Codex birth launches the worker wrapper and hook receiver from one frozen executionRelease with no resolver consultation or fallback
  - T-08560 every configured interactive codex-app-server birth door launches its worker wrapper and hook receiver from the frozen executionRelease with no resolver consultation or fallback
  - T-08564 D-14 proves the broker-plan preview observes through aspd without an HRC-owned facade spawn or resolver fallback (the D-15 direct preview is retired by T-08584)
  - T-08542 aspd outage incompatibility and missing execution release refuse without resolver fallback or worker hosting
