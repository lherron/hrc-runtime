id: hrc-runtime.asp-toolchain-selection
kind: invariant
status: active
owner_project: hrc-runtime
scope: HRC consumption of the producer-selected ASP v2 execution and configured aspd preparation service
predicate: >
  HRC owns no harness, model provider, model, reasoning-effort, profile, target,
  recipe, driver, or presentation default selection. For a new broker birth it
  sends one v2 compile request to configured aspd and preserves absence in both
  selection sources. Explicit request overrides use only the optional camelCase
  requested fields harness, modelProvider, model, reasoningEffort and
  presentation. Raw per-summon overrides use only
  selectionContext.summonDirectives with the snake_case keys harness,
  model_provider, model, reasoning_effort and presentation. It forwards an
  explicit false unchanged and does not resolve,
  normalize, fill, compare, or resend agent-profile.toml or asp-targets.toml
  values. ASP alone loads strict v4 profiles and schema-2 targets, merges profile,
  project target, summon directives, then request overrides, and validates the
  result before selecting the recipe, worker and driver. HRC admits only the one
  producer-selected execution returned by a compatible aspd protocol, allocates
  resources solely from execution.hosting, and launches only from its frozen
  execution release. Presentation false never authorizes terminal-free hosting.
  HRC has no compiler child, resolver, facade, local default, driver-name list or
  fallback. Every selected driver, without a Codex exception, requires positive
  executionRelease.worker.hostedDrivers membership before hosting and again from
  persisted bytes at launch. Removed v1 selectors, aliases and profile adapters
  are rejected, never translated. A configured endpoint that is unavailable,
  incompatible, unidentified, or returns no valid selected execution refuses
  before effects. Declaration and preview observation may use the same service
  admission boundary but do not create or reinterpret a preparation.
authority: wrkq:T-08690 producer-owned v2 consumer amendment, pending Daedalus review; final accepted ASP v2 evidence source 631e7b246aaede313ee6e0aacd71e766f26ae07c, coherent tuple 0.1.1-dev.20260921215301, isolated accepted release asp-631e7b246aae-20260922T025351Z-01f30b, 2026-09-22; HRC dependency advance and coordinated cutover remain pending
