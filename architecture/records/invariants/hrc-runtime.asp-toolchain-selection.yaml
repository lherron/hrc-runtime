id: hrc-runtime.asp-toolchain-selection
kind: invariant
status: active
owner_project: hrc-runtime
scope: HRC-owned ASP child-process, aspd observation, and aspd-prepared worker selection and compatibility boundary
predicate: >
  Except for the configured aspd-prepared route below, every HRC-owned ASP child
  spawn resolves its binary at spawn time through one selection authority. A
  non-empty per-binary command override wins, then the binary's canonical name
  under an explicitly configured absolute HRC_ASP_TOOLCHAIN_ROOT, then the HRC
  release's resolveHoistedBinary result. No such spawn path, including the
  legacy interactive stdio broker path, independently selects or caches a
  command; injected constant commands are test seams only. With HRC_ASPD_SOCKET
  configured, the aspd-prepared route is HRC-hosted headless codex-app-server
  whose effective operator presentation is none (explicit request or node
  default) or whose presentation is tmux-tui selected by an explicit per-request
  presentation.operator tmux-tui; as amended for the node-default app-server
  viewer, it also covers a node-default tmux-tui with no request choice, so on a
  configured node no presentation of that driver keeps this resolver, while with
  HRC_ASPD_SOCKET unset every presentation keeps it. On the aspd-prepared route, for
  either presentation, HRC spawns no ASP compiler child and launches the worker
  only from the executionRelease executable and argv prefix committed under
  hrc-runtime.aspd-prepared-execution-release, and a tmux-tui viewer renderer is
  launched by that worker from its own release payload, never selected by HRC.
  That route never consults a per-binary override, HRC_ASP_TOOLCHAIN_ROOT,
  resolveHoistedBinary, PATH, a moving current link, or source for the worker or
  its renderer, and it has no fallback to them. A
  configured-root selection that is missing or not executable fails before
  spawn, and incompatible facade, aspd, or broker protocol/capability hellos
  fail closed before invocation work. Admin status derives effective source and
  path for resolver-governed routes from that resolver, keeps the aspd service
  projection distinct, and distinguishes both from the immutable bundled ASP
  tuple governed by hrc-runtime.observable-release. The root is one
  configuration namespace, not an atomic build-identity boundary, and the
  daemon's in-process ASP imports remain pinned to its release. As amended for
  every interactive Codex birth door, on a configured node every new
  interactive codex-app-server birth, by any door, is aspd-prepared and is not
  governed by the resolver. Its worker, codex-tui wrapper, and hook receiver
  run only from the frozen executionRelease, with no fallback. Interactive
  births of other broker drivers (claude-code-tmux, pi-tui-tmux,
  codex-cli-tmux), hosted participant brokers, and the Codex Desktop observer
  broker remain resolver-governed [superseded by the T-08562 amendment below].
  As amended for every supported broker birth, every new interactive
  claude-code-tmux and pi-tui-tmux birth on a configured node is likewise
  aspd-prepared and not governed by the resolver: its worker, hook bridge and
  tmux launch runner run only from the frozen executionRelease, with no
  fallback. On a configured node the resolver still governs only the
  non-interactive pi-sdk broker (harness-broker-pi), the deprecated
  codex-cli-tmux interactive driver, hosted participant brokers, the Codex
  Desktop observer broker, and the legacy stdio test seam; with HRC_ASPD_SOCKET
  unset it governs every broker route as before. The migrated broker-plan preview is an aspd
  observation and spawns no HRC-owned aspc-facade child through this resolver;
  after the direct preview branch migrates, it also observes
  prepareProcessInvocation through aspd. Neither preview branch falls back to a
  resolver-selected compiler.
