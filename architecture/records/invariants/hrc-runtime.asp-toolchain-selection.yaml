required_tests:
  - just architecture-records
  - v2 compile fixtures prove omitted selection reaches ASP absent, raw snake_case summon directives are forwarded unchanged, and explicit presentation false survives
  - installed ASP precedence proves profile provider/model, project reasoning effort, summon presentation false, then explicit presentation true with compile-request provenance
  - every supported selected driver has positive hostedDrivers evidence before boundary P and again from frozen bytes at launch; no driver exemption exists
  - removed v1 selectors aliases and profile adapters refuse before any preparation or hosting effect
  - unavailable incompatible unidentified or malformed aspd selection refuses before effects and never falls back to a facade resolver or local choice
last_verified: final ASP v2 installed acceptance proved 9/9 harness/presentation/default cases, 8/8 invalid-wire refusals, four accepted identities, and agent-harness default against source 631e7b246aaede313ee6e0aacd71e766f26ae07c / tuple 0.1.1-dev.20260921215301 / release asp-631e7b246aae-20260922T025351Z-01f30b; HRC dependency advance, implementation and installed acceptance pending
