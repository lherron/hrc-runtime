  - just architecture-records
  - T-08562 configured claude-code-tmux and pi-tui-tmux births launch worker and helpers from the frozen executionRelease with no resolver consultation, while pi-sdk, codex-cli-tmux and an unset endpoint keep resolver selection.
  - T-08542 configured aspd route bypasses every override root bundled PATH current and source resolver while all other routes retain the existing precedence and status projection
  - T-08554 explicit tmux-tui aspd route launches its worker from the frozen executionRelease with no resolver consultation, its renderer runs from that release payload, and, with HRC_ASPD_SOCKET unset, node-default tmux-tui with no request choice keeps the resolver-governed facade route
  - T-08555 configured node-default tmux-tui headless codex-app-server prepares through aspd with no resolver consultation while an unset endpoint keeps the facade for every presentation
  - T-08556 configured attached-run interactive Codex birth launches the worker wrapper and hook receiver from one frozen executionRelease with no resolver consultation or fallback
  - T-08560 every configured interactive codex-app-server birth door launches its worker wrapper and hook receiver from the frozen executionRelease with no resolver consultation or fallback while other interactive drivers keep the resolver
  - T-08564 D-14 and D-15 prove broker-plan and direct previews observe through aspd without an HRC-owned facade spawn or resolver fallback
  - T-08542 aspd outage incompatibility and missing execution release refuse without resolver fallback or worker hosting
  - T-07764 per-spawn precedence and configured-root refusal gates across facade, durable broker, and legacy stdio paths
  - T-07764 protocol/capability remedy and status/resolver authority gates
  - T-07764 live durable and legacy external-root round trips plus bundled rollback proof
