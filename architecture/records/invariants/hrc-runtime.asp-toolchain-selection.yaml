id: hrc-runtime.asp-toolchain-selection
kind: invariant
status: active
owner_project: hrc-runtime
scope: HRC-owned ASP child-process and aspd-prepared worker selection and compatibility boundary
predicate: >
  Except for the configured aspd-prepared route below, every HRC-owned ASP child
  spawn resolves its binary at spawn time through one selection authority. A
  non-empty per-binary command override wins, then the binary's canonical name
  under an explicitly configured absolute HRC_ASP_TOOLCHAIN_ROOT, then the HRC
  release's resolveHoistedBinary result. No such spawn path, including the
  legacy interactive stdio broker path, independently selects or caches a
  command; injected constant commands are test seams only. With HRC_ASPD_SOCKET
  configured, the aspd-prepared route is HRC-hosted headless codex-app-server
  whose effective operator presentation is none (explicit request or node
  default) or whose presentation is tmux-tui selected by an explicit per-request
  presentation.operator tmux-tui; a node-default tmux-tui with no request choice
  is not on that route and keeps this resolver. On the aspd-prepared route, for
  either presentation, HRC spawns no ASP compiler child and launches the worker
  only from the executionRelease executable and argv prefix committed under
  hrc-runtime.aspd-prepared-execution-release, and a tmux-tui viewer renderer is
  launched by that worker from its own release payload, never selected by HRC.
  That route never consults a per-binary override, HRC_ASP_TOOLCHAIN_ROOT,
  resolveHoistedBinary, PATH, a moving current link, or source for the worker or
  its renderer, and it has no fallback to them. A
  configured-root selection that is missing or not executable fails before
  spawn, and incompatible facade, aspd, or broker protocol/capability hellos
  fail closed before invocation work. Admin status derives effective source and
  path for resolver-governed routes from that resolver, keeps the aspd service
  projection distinct, and distinguishes both from the immutable bundled ASP
  tuple governed by hrc-runtime.observable-release. The root is one
  configuration namespace, not an atomic build-identity boundary, and the
  daemon's in-process ASP imports remain pinned to its release.
