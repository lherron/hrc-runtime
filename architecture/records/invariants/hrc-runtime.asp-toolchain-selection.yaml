id: hrc-runtime.asp-toolchain-selection
kind: invariant
status: active
owner_project: hrc-runtime
scope: HRC consumption of the producer-selected ASP v2 execution and configured aspd preparation service
predicate: >
  HRC owns no harness, model provider, model, reasoning-effort, profile, target,
  recipe, driver, or presentation default selection. For a new broker birth it
  sends one v2 compile request to configured aspd and preserves absence in both
  selection sources. Explicit request overrides use only the optional camelCase
  requested fields harness, modelProvider, model, reasoningEffort and
  presentation. A validated explicit intent.presentation.operator is encoded
  only in that existing requested.presentation boolean (none as false, a
  supported tmux-tui or observer viewer as true). A neutral v2 headless carrier
  (neither harness.provider nor harness.id, harness.interactive not true, and
  execution.preferredMode not interactive) with explicit operator tmux-tui
  remains on this producer-selected compile route. It bypasses the legacy
  interactive harness classifier and its default harness derivation, carries
  requested.presentation:true, and admits only a producer result with selected
  presentation true and compile-request provenance, terminal-required tmux
  hosting, and a present tmux presentation surface with terminal or
  websocket-unix transport before HRC allocates anything. A
  false/wrong-provenance, nonterminal/wrong-host, absent-surface, or
  unsupported-transport/wrong-host-surface result refuses typed
  execution_presentation_constraint_mismatch before boundary P or effects.
  Concrete-harness tmux-tui requests and observer requests retain their existing
  route applicability. Without an operator choice,
  intent.selection.presentation is forwarded unchanged or remains absent. The
  explicit operator choice takes precedence only for this request field. It
  does not change summon directives, profiles, targets, defaults, recipes,
  drivers, or hosting. Raw per-summon overrides use only
  selectionContext.summonDirectives with the snake_case keys harness,
  model_provider, model, reasoning_effort and presentation. It forwards an
  explicit false unchanged and does not resolve,
  normalize, fill, compare, or resend agent-profile.toml or asp-targets.toml
  values. ASP alone loads strict v4 profiles and schema-2 targets, merges profile,
  project target, summon directives, then request overrides, and validates the
  result before selecting the recipe, worker and driver. HRC admits only the one
  producer-selected execution returned by a compatible aspd protocol, allocates
  resources solely from execution.hosting, and launches only from its frozen
  execution release. Presentation false alone never authorizes HRC to infer
  terminal-free hosting.
  HRC has no compiler child, resolver, facade, local default, driver-name list or
  fallback. Every selected driver, without a Codex exception, requires positive
  executionRelease.worker.hostedDrivers membership before hosting and again from
  persisted bytes at launch. Removed v1 selectors, aliases and profile adapters
  are rejected, never translated. A configured endpoint that is unavailable,
  incompatible, unidentified, or returns no valid selected execution refuses
  before effects. Declaration and preview observation may use the same service
  admission boundary but do not create or reinterpret a preparation. For an
  explicit operator none, HRC admits only producer-selected presentation false
  with compile-request provenance, no required terminal or terminal host, and
  no presentation surface. presentationFulfillment describes recipe capability
  and may be attachable without a surface; it does not authorize HRC allocation
  or an attach target. A selected true or wrong-provenance response, terminal
  fact, or surface mismatch refuses before preparation or hosting, without
  coercing the plan.
