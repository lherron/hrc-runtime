id: hrc-runtime.observable-release
kind: invariant
status: active
owner_project: hrc-runtime
scope: installed and running HRC release identity
predicate: >
  Every atomic HRC release records its exact HRC build and the installed
  versions of the thin ASP contract set (aspContracts) in
  praesidium-release.json before cutover; no locked ASP execution build is
  recorded anywhere. The daemon captures that immutable identity at startup,
  fails closed for invalid atomic manifests, and reports on every status read
  whether the running release still equals the installed release. A local
  selected/running release may name a source commit not yet contained upstream;
  that identity is not canonical publication evidence. Only the later
  selected release canonical publication proves containment and the registry tuple.
  Source and worktree daemons report unmanaged explicitly.
authority: wrkq:T-06958; wrkq:T-08596 aspContracts amendment (Daedalus approval EN-14687, 2026-09-18); wrkq:T-08559 (Daedalus approval EN-18147, 2026-09-26)
source:
  - packages/hrc-core/src/contracts.ts
  - packages/hrc-server/src/release-provenance.ts
  - packages/hrc-server/src/__tests__/t06958-release-provenance.test.ts
  - scripts/atomic-install.ts
  - scripts/atomic-install-live-harness.test.ts
  - scripts/t08559-install-publish-split.test.ts
  - packages/hrc-cli/src/cli-runtime.ts
required_tests:
  - bun test packages/hrc-server/src/__tests__/t06958-release-provenance.test.ts
  - bun test scripts/atomic-install-live-harness.test.ts
  - bun test scripts/t08559-install-publish-split.test.ts
  - bun test packages/hrc-cli/src/__tests__/cli.test.ts
last_verified: 2026-09-26 focused regression and build; installed smoke pending
reopen_when: Atomic release layout, package provenance, daemon startup, or status projection changes.
supersedes: []
superseded_by: []
