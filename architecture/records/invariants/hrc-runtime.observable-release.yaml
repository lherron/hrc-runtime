id: hrc-runtime.observable-release
kind: invariant
status: active
owner_project: hrc-runtime
scope: installed and running HRC release identity
predicate: >
  Every atomic HRC release records its exact HRC build and the installed
  versions of the thin ASP contract set (aspContracts) in
  praesidium-release.json before cutover; no locked ASP execution build is
  recorded anywhere. The daemon captures that immutable identity at startup,
  fails closed for invalid atomic manifests, and reports on every status read
  whether the running release still equals the installed release. A local
  selected/running release may name a source commit not yet contained upstream;
  that identity is not canonical publication evidence. Only the later
  selected release canonical publication proves containment and the registry tuple.
  Source and worktree daemons report unmanaged explicitly. The production daemon
  records that captured identity (release, sourceCommit, storeSchema,
  processStartedAt) durably in its server.started lifecycle fact, and every
  status read reports lastRestart derived solely from the local lifecycle
  ledger, never from logs or the project timeline
  (hrc-runtime.daemon-lifecycle-provenance).
authority: wrkq:T-06958; wrkq:T-08596 aspContracts amendment (Daedalus approval EN-14687, 2026-09-18); wrkq:T-08559 (Daedalus approval EN-18147, 2026-09-26); wrkq:T-08137 lastRestart amendment (Daedalus approval EN-19426, 2026-09-28)
source:
  - packages/hrc-core/src/contracts.ts
  - crates/hrc-native/src/server/front/release.rs
  - crates/hrc-native/src/server/front/hosting.rs
  - crates/hrc-native/e2e/lifecycle_publication.py
  - scripts/atomic-install.ts
  - scripts/atomic-install-live-harness.test.ts
  - scripts/t08559-install-publish-split.test.ts
  - crates/hrc-cli/src/server_status.rs
  - crates/hrc-native/src/server.rs
  - crates/hrc-native/src/server/lifecycle/lifecycle/rows.rs
  - crates/hrc-native/e2e/lifecycle_rows.py
  - crates/hrc-cli/e2e/status.py
required_tests:
  - python3 crates/hrc-native/e2e/lifecycle_publication.py --binary <rusthrc> --artifacts <dir>
  - bun test scripts/atomic-install-live-harness.test.ts
  - bun test scripts/t08559-install-publish-split.test.ts
  - python3 crates/hrc-cli/e2e/status.py --binary <rusthrc> --artifacts <dir>
  - python3 crates/hrc-native/e2e/lifecycle_rows.py --binary <rusthrc> --artifacts <dir>
last_verified: 2026-09-26 focused regression and build; installed smoke pending
reopen_when: Atomic release layout, package provenance, daemon startup, the server.started provenance payload, or status projection changes.
supersedes: []
