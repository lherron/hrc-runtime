id: hrc-runtime.harness-broker-admission-client
kind: invariant
status: active
owner_project: hrc-runtime
scope: HRC submission API and policy authority over the per-seat harness-broker
predicate: >
  HRC owns cross-seat scheduling, caller policy, and principal authority while
  the harness-broker owns per-seat admission mechanism. All HRC broker traffic
  flows through exactly four class-specific submit methods, one each for steer,
  queue, exclusive, and preempt; the concrete method names are not law. T-08207
  revision 11 carries a separate closed `executionFormat` selector on the
  promptless broker-session-open door, /v1/turns, and each four-door body. It is
  chosen and frozen before compile and is never an admission class, runtime
  intent, ASP selection, session preference, or provider default. Omission is
  format 1. Agent-loop's promptless open must request format 2 before it creates
  its invocation, and its later invoke must request the same durable format.
  ACP real-launcher and every unchanged caller omit the selector and remain
  format 1 with an admission runId until their pinned producer tuple and caller
  contract advance; HRC publication, installation, or active ASPD cannot move
  that boundary. A same-key or live/prepared invocation request that differs
  from its frozen format refuses before compile, input/run allocation, rotation,
  or body write. Admission class is explicit in the method signature and is never selected by
  a whenBusy parameter; composite behavior such as
  steer-else-queue is caller composition of typed outcomes. Steer exposes no
  wait, obligation, or own-response option and resolves only through truthful
  absorbed or executed disposition. Every obligation-bearing call uses enqueue,
  invoke, or preempt; blocking callers correlate by submission disposition and
  then the identified turn terminal rather than by delivery inference. For a
  frozen format-1 invocation, an indeterminate submission.lost retains its
  legacy terminal-failed run disposition: HRC settles that legacy run, then the
  following non-retryable invocation.failed marks the runtime crashed and closes
  the broker client. For format 2, submission.lost is correlation uncertainty on
  the admitted input only. It does not mint or fail an execution, prove removal,
  or authorize a second body write; later exact native landing remains
  projectable. The format-2 agent-loop consumer also treats submission.lost and
  submission.expired as nonterminal correlation facts after landing; before
  landing, matching positive submission.rejected and proved
  submission.withdrawn facts are typed input terminals without a fabricated
  run. The withdrawal follows successful driver cancellation or removal of a
  broker-held entry. submission.cancelled with reason teardown ends only
  process-local tracking and proves no native removal, so it remains
  nonterminal. Invocation failure/exited and process liveness are never
  input or execution terminals in format 2. A failed format-1 invocation
  receives no later input, and the next submission provisions a fresh runtime
  through HRC's existing cross-seat authority. A summons that
  births a launch-primed seat rides the launch turn: its landing fact is the
  born runtime's first turn start, and its presentation receipt carries no
  invocation input id (the T-07693 class). An interactive launch-carried invoke
  holds a separate invoke-only rendezvous through its owning run's terminal;
  the every-door birth singleflight still releases at bare boot, so enqueue,
  steer, preempt, kicker, and mail admission retain their existing behavior. A
  warm invoke whose frozen broker capabilities omit exclusive is submitted
  through the queue class while retaining invoke as its visible HRC door; the
  admitted class is recorded separately and the caller's completion wait is
  unchanged. A driver that advertises exclusive retains the direct invoke path. A
  crossing invoke is registered before it waits. Format 1 remains protected
  first by that process-local registration and then by its durable active run
  row. For format 2, the same pre-await registration names a durable admitted
  input with cleanup protection before its body write; that input remains
  protected through uncertainty and survives daemon restart until a matching
  positive submission.rejected or proved submission.withdrawn before landing,
  or until an exact landing atomically transfers coverage to its carrier active
  run. submission.cancelled teardown, invocation-state, and process-liveness
  facts do not release it. The agent-loop broker adapter carries an in-memory
  input binding before landing;
  it sends no owner-less lifecycle control then, and after an initiating landing
  carries the returned owner run id through ordinary stop and dispose. An
  owner-scoped interrupt acts only on that exact active run. An owner-scoped
  terminate preserves the runtime while another crossing registration, durable
  protected input, or durable active run exists; otherwise it makes the broker
  invocation non-input-dispatchable synchronously before asynchronous teardown.
  Omitting owner identity preserves explicit operator lifecycle semantics. Preempt
  requires operator authority or the sender's authority over the envelope
  driving the active turn, and never arises from a silent class upgrade. HRC
  consumes broker capability, seat probe, queue,
  disposition, manifest, and decision-ledger surfaces without reading harness
  internals or moving per-seat mechanism into the runtime layer. The wrkq mail
  kicker reads busy state only from the broker-observed seat turn, never from an
  HRC run row. An unattributed observed turn is a non-idle turn-observed seat;
  mail remains HRC-held until ownership is attributed. The kicker delivers a queue-intent envelope to a turn-active seat
  whose driver advertises the steer class through the STEER door; a turn-active
  seat without steer receives it through enqueue; an idle seat receives it
  through enqueue and an absent seat through a launch-carried invoke. Every door
  carries ONE ENVELOPE PER SUBMISSION with origin.envelopeId as the correlation,
  and steer-else-queue is kicker composition of typed outcomes and landing
  evidence, never a whenBusy parameter. A mail hint is a count-only PostToolUse
  context injection about the seat's outstanding ENQUEUE submissions; it is not
  a presentation, creates no receipt, submission or obligation, and carries a
  count and no sender attribution. On a steer-capable seat that count is zero by
  construction.
  Each hold/preempt request remains an immediate isolated admission decision.
authority: Lance principal rulings 2026-09-01 through 2026-09-05, including wrkq:T-07920 cold-birth ruling, wrkq:T-07926 mail-hint direction, and the 2026-09-05 ruling in spec wrkq:T-08092 that supersedes wrkq:T-07914 / Daedalus approvals wrkq:T-07843 rev 7, wrkq:T-07926 rev 2, wrkq:T-07962 rev 3, wrkq:T-08012 corrected design rev 3, wrkq:T-08098 companion design, and wrkq:T-08207 revisions 10 and 11 (2026-09-26) / T-08562 Daedalus approval EN-13574 adds a launch-provenance preservation test without changing the predicate, 2026-09-17
