required_tests:
  - T-08562 launch-primed cold summons, cold invoke and cold enqueue on an aspd-prepared claude-code-tmux birth keep the T-07920, T-08004, T-08012 and T-08531 launch-turn, receipt and rendezvous facts
  - the public HRC submission surface exposes exactly one method per admission class and all broker traffic routes through one of the four
  - steer signatures cannot express wait obligation or own-response semantics
  - legacy whenBusy fields and implicit steer-else-queue composition are absent after adoption
  - obligation-bearing enqueue invoke and preempt calls correlate disposition to their originating turn terminal
  - preempt authority and guarded-turn policy reject unauthorized or silently upgraded interrupts
  - HRC policy loops consume broker capability probe queue disposition manifest and decision events without harness-internal reads
  - T-07891 observed-seat busy detection and preempt-isolation gates
  - T-08094 door selection: steer into a turn-active steer-capable seat, enqueue into a turn-active seat without the class, enqueue into an idle seat, launch-carried invoke into an absent one
  - T-08094 one envelope per submission, with origin.envelopeId carried into the broker admission record on every door
  - T-08094 the mail hint counts outstanding enqueue submissions only, and is silent for a steered body
  - T-07920 launch-primed cold birth suppresses profile priming and carries the summons alone in one launch turn with no broker submission or receipt input id, while warm, non-launch-primed, and high-risk routes retain guarded admission
  - T-07926 mail-hint gates cover the bare held count, cadence and fail-open silence, no broker submission or presentation receipt, unchanged batch behavior, and a real PostToolUse additionalContext round-trip with no user row
  - T-08207 rev11 covers exact F2-capable request shapes for broker-session-open, /v1/turns, and steer/enqueue/invoke/preempt; F1-sealed runtime, attached, selector-message, and participant doors reject F2 before an effect; omission remains F1
  - T-08207 rev11 agent-loop opens a promptless F2 invocation before its first input and later invokes with F2; absent/different later selector refuses, while ACP-shaped dispatch omission remains F1/runId until the ACP producer pin and caller contract advance
  - T-07962 format-1 lost-disposition gates settle the legacy HRC waiter and run failed, project the runtime crashed, close the old broker client, reject later delivery to that invocation, and provision the next submission on a fresh runtime; format-2 loss/expiry retain only input correlation uncertainty, permit no reinjection, and do not complete the adapter before a later observed terminal
  - T-08207 accepted-input watch gates convert matching positive rejection and confirmed driver-cancel withdrawal before landing into typed input terminals with no run binding and restored adapter readiness; teardown cancellation, loss, expiry, invocation failure/exited, and liveness probes do not terminalize or re-arm a format-2 carrier
  - T-08012 invoke-only cold-birth rendezvous gate proves crossing invokes wait through the launch-carried owner terminal while enqueue and mail retain bare-boot admission
  - T-08012/T-08207 owner-scoped cleanup gates prove direct and adopted response paths retain distinct owner run ids across client rotation, interrupt cannot affect a different active run, and terminate observes crossing registration, durable protected input, or durable active-run coverage without an admission-to-teardown gap, including after restart before an input lands
  - T-08207 agent-loop accepted-input gates emit no owner-less control and no external run reference before landing, emit one external reference only for an initiating landing, and emit none for joined landing
  - T-08012 live concurrent agent-loop invoke gate proves both callers complete under distinct runs without run mismatch timeout merge cancellation or reuse refusal
  - T-08098 invoke mapping proves a no-exclusive runtime admits invoke through queue with visible door invoke plus class queue and unchanged wait semantics, while an exclusive runtime is untouched
  - T-08098 turn-observed seat parsing remains non-idle and holds mail without opening a delivery intent
last_verified:
  date: 2026-09-17
  evidence: T-08562 design approval EN-13574 adds only the aspd-prepared Claude launch-provenance preservation gate; the predicate is unchanged and implementation evidence is pending. T-08098 unit gates verify capability-driven invoke-to-queue mapping with distinct visible door and admitted class, preserve direct exclusive invocation, and hold mail on an unattributed turn-observed seat. T-08012 corrected design rev 3 established an invoke-only terminal rendezvous plus registration-to-ledger coverage and run-scoped agent-loop lifecycle cleanup. T-07962 rev 3 established terminal lost-disposition consumption and non-retryable fresh-runtime recovery. T-07926 rev 2 established the count-only, non-presenting PostToolUse mail-hint boundary. T-07920 verified launch-carried cold summons behavior. T-08094 replaced the HRC-held batch with steer-first one-envelope-per-submission delivery.
reopen_when:
  - HRC adds removes or parameterizes an admission-class submit method
  - an obligation or wait can ride steer or a blocking caller stops owning an originating turn
  - cross-seat scheduling moves into the broker or per-seat mechanism moves into HRC
  - preempt authority or active-turn policy semantics change
  - HRC reads harness internals instead of broker disposition manifest and decision surfaces
  - collaboration busy-state authority, door selection, one-envelope-per-submission, or preempt isolation changes
  - invoke-to-admission-class translation or turn-observed mail holding changes
  - launch-primed cold-birth delivery stops riding the launch turn or starts requiring a broker input identity
  - invoke-only terminal rendezvous scope, registration-to-input/run coverage, owner-run cleanup narrowing, agent-loop pre-landing control, or synchronous teardown admission fencing changes
  - a mail hint carries envelope ids or bodies or gains a disposition
  - execution-format selector ingress/default, agent-loop promptless F2 session behavior, ACP format-1 compatibility, selector mismatch fence, or F1-sealed birth-door law changes
  - HRC changes the per-format submission disposition terminal boundary, permits a failed invocation to receive later input, or permits a format-2 correlation loss to reinject a body
