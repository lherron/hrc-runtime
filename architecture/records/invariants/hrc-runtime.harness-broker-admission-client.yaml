id: hrc-runtime.harness-broker-admission-client
kind: invariant
status: active
owner_project: hrc-runtime
scope: HRC submission API and policy authority over the per-seat harness-broker
predicate: >
  HRC owns cross-seat scheduling, caller policy, and principal authority while
  the harness-broker owns per-seat admission mechanism. All HRC broker traffic
  flows through exactly four class-specific submit methods, one each for steer,
  queue, exclusive, and preempt; the concrete method names are not law.
  Admission class is explicit in the method signature and is never selected by
  a whenBusy parameter; composite behavior such as
  steer-else-queue is caller composition of typed outcomes. Steer exposes no
  wait, obligation, or own-response option and resolves only through truthful
  absorbed or executed disposition. Every obligation-bearing call uses enqueue,
  invoke, or preempt and originates its own turn; blocking callers correlate by
  submission disposition and then the identified turn terminal rather than by
  delivery inference. A summons that births a launch-primed seat rides the
  launch turn: the obligation correlates by that turn's identified terminal,
  and its presentation receipt carries no invocation input id (the T-07693
  class). Preempt requires operator authority or the sender's
  authority over the envelope driving the active turn, and never arises from a
  silent class upgrade. HRC consumes broker capability, seat probe, queue,
  disposition, manifest, and decision-ledger surfaces without reading harness
  internals or moving per-seat mechanism into the runtime layer. The wrkq mail
  kicker reads busy state only from the broker-observed seat turn, never from an
  HRC run row. Ordinary queue-class envelopes arriving during that turn remain
  in one durable HRC-held batch with no broker submission or wrkq presentation
  receipt. A mail hint is a count-only PostToolUse context injection about
  HRC-held queue mail; it is not a presentation, creates no receipt, submission
  or obligation, and never changes batch membership or auto-reply attribution.
  The terminal turn event, backed by the periodic sweep, freezes and flushes
  after a second idle-seat observation. Every boundary or idle input
  contains only envelopes sharing the oldest actionable envelope's exact
  presentation key: room, sender identity, reply addressee, and fan-out group,
  up to MAX_PRESENTED_PER_ATTEMPT. Other keys remain held or pending for later
  turns, and every multi-envelope input has one auto-reply candidate. A competing
  turn keeps the batch held. Terminal members are removed before prompt
  composition. An HRC-held member has no broker submission and therefore no
  broker TTL; only its wrkq sender expiry or withdrawal can terminal it, and
  flush revalidation honors that ledger state.
  Once a flush has acquired a broker submission and written per-envelope
  receipts, a broker queue/submission expiry is logged and fails every receipted
  member of that shared input as undeliverable so the sender sees a terminal
  outcome. Each hold/preempt request remains an immediate isolated admission
  decision and is never batched.
authority: Lance principal rulings 2026-09-01 through 2026-09-03, including wrkq:T-07920 cold-birth ruling and wrkq:T-07926 mail-hint direction / Daedalus approvals wrkq:T-07843 rev 7 and wrkq:T-07926 rev 2
