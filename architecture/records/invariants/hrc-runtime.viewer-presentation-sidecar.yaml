required_tests:
  - just architecture-records
  - viewer side-effect-free HRC route and SDK allowlist gates
  - viewer event, presentation read-model, restart, and reconciliation gates
  - viewer dry-run metadata-classification completeness gate
  - cross-daemon pane and window non-actuation isolation gate
  - owner-scoped viewer identity, runtime-fenced reap, and role-qualified scope coexistence gates
  - live Ghostty shadow matrix for start, run, reuse, retitle, terminate, and restart
last_verified: 2026-08-26 design approval; implementation gates pending
reopen_when: The Ghostty actuation owner, daemon-lane ownership key, shared registry boundary, presentation authority or read model, invocation suppression lifetime, window or pane identity, legacy adoption rule, lifecycle failure isolation, or ghostmux boundary changes.
