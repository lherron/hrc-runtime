required_tests:
  - just architecture-records
  - viewer side-effect-free HRC route and SDK allowlist gates
  - viewer event, presentation read-model, restart, and reconciliation gates
  - single production viewer per GUI user and non-production disablement gate
  - viewer pane identity, runtime-fenced reap, and role-qualified scope coexistence gates
  - live production Ghostty shadow matrix for start, run, reuse, retitle, terminate, and restart
last_verified: 2026-08-26 human operator override; implementation gates pending
reopen_when: Viewer cardinality or placement per GUI user, the shared Ghostty registry boundary, Ghostty actuation ownership, presentation authority or read model, invocation suppression lifetime, pane identity, upgrade adoption rule, lifecycle failure isolation, or ghostmux boundary changes.
