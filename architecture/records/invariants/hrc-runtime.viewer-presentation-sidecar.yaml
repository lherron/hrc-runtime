id: hrc-runtime.viewer-presentation-sidecar
kind: invariant
status: active
owner_project: hrc-runtime
scope: Ghostty viewer presentation authority and runtime presentation facts
predicate: >
  HRC owns runtime lifecycle and the durable presentation facts needed to
  reconstruct viewer intent, but after viewer cutover it never actuates Ghostty.
  Each start or reuse publishes runtime.presentation with the invocation-local
  operator-attach suppression decision, while the runtime generation persists
  only operator attachability, latest viewer window, and monotone
  viewerRequested intent. A store-only presentation read model exposes those
  facts without probing or mutating runtimes. hrc-viewer alone actuates Ghostty
  through ghostmux and keeps no persistent registry outside Ghostty surface and
  managed-window metadata. The connected daemon's runtimeRoot names its
  presentation lane and is stamped as hrc_owner_root: managed windows are
  found or created by (owner, windowKey), and the one pane for a logical session
  is keyed by (owner, normalized scopeRef, laneRef). A viewer never mutates,
  resizes, splits from, reaps, or places into foreign surfaces or windows.
  Unstamped legacy windows are never claimed or used for placement; an unstamped
  pane may be adopted in place only when this daemon's read model names its exact
  runtime id, and otherwise cannot be absence-reaped. Runtime and generation
  fences still govern adoption and reap. A pre-record generation is adopt-only
  and cannot cause a pane to be minted until an invocation establishes
  presentation authority. Viewer absence, death, lag, reconnect,
  reconciliation, and polling cannot mutate or finalize runtime, run, or turn
  state and cannot delay or fail their lifecycle paths.
authority: daedalus@hrc-runtime:primary architecture rulings, 2026-08-26
source:
