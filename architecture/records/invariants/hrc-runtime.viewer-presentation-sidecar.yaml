id: hrc-runtime.viewer-presentation-sidecar
kind: invariant
status: active
owner_project: hrc-runtime
scope: Ghostty viewer presentation authority and runtime presentation facts
predicate: >
  HRC owns runtime lifecycle and the durable presentation facts needed to
  reconstruct viewer intent, but after viewer cutover it never actuates Ghostty.
  Each start or reuse publishes runtime.presentation with the invocation-local
  operator-attach suppression decision, while the runtime generation persists
  only operator attachability, latest viewer window, and monotone
  viewerRequested intent. A store-only presentation read model exposes those
  facts without probing or mutating runtimes. hrc-viewer alone actuates Ghostty
  through ghostmux and keeps no persistent registry outside Ghostty pane
  metadata. Exactly one viewer-bearing daemon is permitted per GUI user and it
  is the production daemon; non-production daemons for that user keep their
  in-daemon Ghostty viewer disabled and never run hrc-viewer. This placement
  constraint is the authority boundary for the user's shared Ghostty registry;
  the design does not provide cross-daemon pane ownership or isolation. Within
  that one viewer, the single global pane for a logical session is keyed by
  normalized (scopeRef, laneRef), with runtime and generation fences for
  adoption and reap. A pre-record generation is adopt-only and cannot cause a
  pane to be minted until an invocation establishes presentation authority.
  Viewer absence, death, lag, reconnect, reconciliation, and polling cannot
  mutate or finalize runtime, run, or turn state and cannot delay or fail their
  lifecycle paths.
authority: Lance Herron operator ruling, 2026-08-26
source:
