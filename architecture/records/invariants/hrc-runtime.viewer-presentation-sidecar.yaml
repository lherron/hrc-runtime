id: hrc-runtime.viewer-presentation-sidecar
kind: invariant
status: active
owner_project: hrc-runtime
scope: Ghostty viewer presentation authority and runtime presentation facts
predicate: >
  HRC owns runtime lifecycle and the durable presentation facts needed to
  reconstruct viewer intent, but after viewer cutover it never actuates Ghostty.
  Each start or reuse publishes runtime.presentation with the invocation-local
  operator-attach suppression decision, while the runtime generation persists
  only operator attachability, latest viewer window, and monotone
  viewerRequested intent. A store-only presentation read model exposes those
  facts without probing or mutating runtimes. hrc-viewer alone actuates Ghostty
  through ghostmux and keeps no persistent registry outside Ghostty pane
  metadata. Raising or focusing an existing pane by a user-principal tool (a
  CLI the human runs on their own desktop, e.g. hcs) is not presentation
  actuation for this invariant: it mints, stamps, rebinds, retitles, and closes
  nothing, and focus is never read for identity or topology decisions. Such a
  tool may read the pane metadata the viewer wrote to locate a pane; it may
  not write it. Exactly one viewer-bearing daemon is permitted per GUI user and it
  is the production daemon; non-production daemons for that user keep their
  in-daemon Ghostty viewer disabled and never run hrc-viewer. This placement
  constraint is the authority boundary for the user's shared Ghostty registry;
  the design does not provide cross-daemon pane ownership or isolation. Within
  that one viewer, the single global pane for a logical session is keyed by
  normalized (scopeRef, laneRef), with runtime and generation fences for
  adoption and reap. A pre-record generation is adopt-only and cannot cause a
  pane to be minted until an invocation establishes presentation authority.
  The existing store-only presentation row may expose operatorSurfaces as
  active Ghostty (surfaceId, clientTty) pairs with nonempty clientTty; an
  absent field on an older server yields no eligible operator surfaces. The
  scope form of hrc attach binds its invoking Ghostty surface immediately
  before exec, while descriptor-only attach does not bind. An attach exit
  does not unbind because binding records lack an attachment-instance fence.
  ACP's hrc-viewer may paint an HRC-reported operator Ghostty surface only when
  the same presentation-row runtime reports a nonempty clientTty for that
  surface and an independent tmux-client probe observes that exact TTY live on
  the row's attach target. Missing, negative, or indeterminate evidence
  withholds operator-surface paint. HRC keeps one active Ghostty binding per
  client TTY and retires an older conflicting surface in the new bind
  transaction. Operator surfaces may receive only status bars, terminal
  background, and title. The viewer never mints, adopts, rebinds, reaps, or
  writes hrc_* metadata on them. A keyed metadata-owned pane may coexist with
  multiple operator surfaces; each permitted presentation write reaches the
  deduplicated set of the pane and exact-TTY-qualified operator surfaces, while
  pane topology and reap range only over the keyed pane. The presentation row
  remains a store-only projection, and viewer observation and polling do not
  mutate lifecycle state. The viewer obtains these pairs through the existing
  presentation read, not a per-runtime surfaces route.
  Viewer absence, death, lag, reconnect, reconciliation, and polling cannot
  mutate or finalize runtime, run, or turn state and cannot delay or fail their
  lifecycle paths.
