id: hrc-runtime.harness-broker-committed-observation-control
kind: invariant
status: active
owner_project: hrc-runtime
scope: HRC projection, retention acknowledgement, and closed-loop control over harness-broker facts
predicate: >
  HRC observes and projects only committed normalized harness-broker envelopes,
  and BrokerEventMapper remains their sole interpreter. For each broker sequence,
  one SQLite transaction idempotently mirrors the normalized envelope, projects
  runtime run buffer continuation surface and permission state, appends canonical
  hrc_events, and advances a contiguous projection cursor or records a typed
  fenced disposition. The cursor advances across intentionally non-mirrored
  high-volume deltas without treating mirror retention as a source gap. An
  execution naming a native turn resolves ownership from immutable broker event
  evidence keyed by runtime, historical operation generation, invocation, native
  turn id, and harness generation or turn attempt where present. Event,
  invocation, operation, and candidate run identities must agree; the current
  runtime generation is not historical authority. Initiating evidence is an
  explicit start input, definitive own attribution, or executed submission
  mapped to its run. A stored start run_id alone, absorbed input, acceptance
  order, current active run, and newest bracket cannot establish ownership.
  The controller-persisted launch-carried invoke marker is the narrow legacy
  exception for that invocation's first input-less launch turn only; it is not
  native consumption proof. Foreign turns remain unowned. Unknown, absent, or
  conflicting evidence remains unresolved; the first definitive own attribution
  may bind an unresolved turn once. Later execution events retain the exact
  owner even after another turn starts. A named unresolved turn never falls
  through to submission or bracket inference. Existing no-bracket compatibility
  remains limited to events without turn identity and without an observed bracket.
  Immutable attribution events govern; broker_turn_attributions cannot be a
  competing authority. Attribution sequence bounds prevent future evidence from
  rewriting an earlier projected row; historical ledger rows are not rewritten.
  Submission-record resolution is distinct from execution ownership. A
  definitively absorbed, submission-linked, admission-class steer auxiliary in
  the same historical epoch with no startedAt settles idempotently against its
  exact owner, never against itself. Accepted or legacy ACK-completed auxiliaries
  become terminal coalesced with an owner link, preserved or settlement completion
  time, no invented start or batch position, and no synthetic execution lifecycle.
  Failed, cancelled, or zombie auxiliaries retain their truthful status and error
  when gaining a definitive owner link; a different existing owner conflicts.
  New steer acknowledgements do not complete auxiliary runs. Delayed definitive
  ownership settles earlier absorption for that exact turn. Definitive teardown
  explicitly disposes absorbed auxiliaries whose owner remains unresolved.
  Neither ordinary nor ledger-inclusive runtime prune may remove the evidence
  while a definitive absorbed dependency lacks an owner association or explicit
  unresolved-owner teardown disposition; terminal status alone is insufficient.
  An old owner's terminal closes only that owner and clears activeRunId only
  when equal. It cannot fail, finalize, clear, or release a newer execution, mark
  its invocation ready, or drain its queue through mismatch repair. Only
  after that transaction commits may HRC acknowledge the broker sequence, notify
  followers, or evaluate a control policy that depends on the fact. HRC is the
  sole broker-ledger retention-bearing consumer: its fenced control connection
  owns one durable scalar acknowledgement per invocation, bounded by forensic
  and active-invocation holds; read-only observer clients have no acknowledgement
  identity or retention claim and fail typed below the retained floor. This does
  not change the keep-forever HRC projection law in
  hrc-runtime.ledger-tool-result-storage. Control attempts remain typed durable
  intent over the existing specialized stores, and RPC acceptance never proves
  provider effect; effects return as later committed observations. The wrkq
  kicker acts only when committed terminal execution truth and authoritative
  pending-obligation truth agree, no newer input or turn supersedes them, and the
  one-reminder bound permits the attempt. Explicit policy operator and API
  permission decisions are HRC-owned and persist before permission.respond on
  the fenced control connection. A deadline fallback is broker-owned; HRC later
  projects its already committed permission.resolved timeout fact.
