required_tests:
  - normalized broker append failure publishes nothing to HRC
  - projection commit rollback idempotent replay conflict and contiguous-cursor gates cover mirrored and intentionally non-mirrored envelopes
  - HRC crash after projection before acknowledgement replays idempotently and re-acknowledges after matching the committed projection
  - persisted scalar acknowledgement and retention floor survive broker restart while a below-floor attach becomes replay-stale without snapshot inference
  - the observer surface has no mutation or acknowledgement methods and stale control connections cannot mutate or acknowledge
  - kicker actuation requires committed terminal truth pending wrkq obligation truth no superseding input or turn and exactly one reminder
  - explicit permission decisions persist before fenced response while disconnected timeout fallback projects only from the broker's committed fact
  - control RPC acceptance remains distinct from committed input turn permission and effect observations
  - T-08098 observed-mode replay proves foreign and unknown turn rows never resolve to a pending run, later own rows do, terminals affect only the own run, and replay preserves every resolution
  - T-08201 exact ownership gates cover multiple absorbed steers, delayed own attribution and old terminals after newer starts, repeated native ids across epochs, pre-fix borrowed rows, and first-launch-only compatibility
  - T-08201 auxiliary gates cover accepted and ACK-completed coalescence, truthful failed/cancelled/zombie preservation, duplicate absorption, crash after commit before ACK, unresolved teardown, and both prune dependency guards
  - T-08201 installed Codex TUI and Claude original-run observers survive two mid-run steers and receive normal or interrupted terminals; raw/direct-wait interruption stays non-success while existing canonical mapping and stacked exit behavior remain unchanged
last_verified:
  date: 2026-09-06
  evidence: T-08098 observed-mode mapper gates verify durable own foreign and unknown attribution, no nearest-input borrowing, no foreign terminalization, later own completion, and sequence-stable idempotent replay. Earlier authority is Daedalus source-grounded approval of revised T-07853 after resolution of Pi authority, retention ownership, and permission-timeout authority flaws. T-08201 revision 5 was source-reviewed and approved in C-19938 on 2026-09-07; its implementation and installed gates remain pending, and this date is not refreshed by design approval.
reopen_when:
  - HRC projects an uncommitted broker fact or BrokerEventMapper ceases to be the sole interpreter
  - projection transaction cursor acknowledgement or post-commit ordering changes
  - another broker-ledger retention-bearing consumer is introduced
  - HRC projected ledger retention changes
  - observation and mutation fencing or effect-proof semantics change
  - observed turn attribution persistence no-run ownership rules or replay sequence bounds change
  - exact initiating evidence, historical epoch ownership, launch compatibility, auxiliary settlement or retention, or old-owner terminal isolation changes
  - kicker trigger obligation authority or reminder bound changes
  - explicit-versus-timeout permission decision ownership changes
