  - wrkq:T-13434
  - architecture/contracts/self-brokered-seat-launch.md
  - architecture/records/invariants/hrc-runtime.participant-session-lifecycle.yaml
  - architecture/records/invariants/hrc-runtime.submission-admission-pipeline.yaml
  - architecture/records/invariants/hrc-runtime.hrcpty-seat-supervision.yaml
  - crates/hrc-native/src/server/turns/turns/admission.rs
  - crates/hrc-native/src/server/turns/turns/route.rs
  - crates/hrc-native/src/server/broker/participants/establishment.rs
  - crates/hrc-native/src/server/broker/participants/delivery.rs
  - crates/hrc-native/src/server/broker/hrcpty.rs
  - crates/hrc-native/src/server/broker/lease.rs
  - crates/hrc-store/src/participants.rs
  - crates/hrc-store/src/participants/succession.rs
required_tests:
  - T-13434 rev 3 G1 through G8 isolated-daemon participant launcher e2e, including rebirth input identity, one child, active restart, child death, failed and interrupted launch disposal, and refusal without allocation
  - T-13434 companion Foundry A1 through A6 live scratch-fleet acceptance with the real model, as referenced by the approved contract
last_verified:
  date: 2026-11-12
  evidence: Design-only source review of T-13434 rev 3 against admission refusal ordering and rotation, successor session allocation and participant linkage, establishment work predicates, supervisor spawn and lease disposal. No implementation, test, build, install, restart or live acceptance result is asserted.
reopen_when:
  - Launch declaration, command argv, registration file, descriptor or continuation agreement changes
  - Process ownership, broker join, terminal ownership, liveness, retirement or reconnect changes
  - Allocation stage, admission refusal effects, successor identity, serialization or generation guarantees change
  - Failed or interrupted launch disposal, half-launch resume or external cutover admission changes
