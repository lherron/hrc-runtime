id: hrc-runtime.participant-session-lifecycle
kind: invariant
status: active
owner_project: hrc-runtime
scope: generic participant registration, observer attempts, session continuity, and recovery under T-08344
predicate: >
  HRC owns protocol registration, addresses, sessions, attempt identity and
  activation. A participant's own registration message creates an available
  address without ASP admit, adapter availability, or descriptor/evidence-file
  prerequisites. Direct registration requires no configured class. Missing class,
  adapter, workspace and preparation are represented as NULL, never invented;
  existing keyed registration identities survive migration. Resolved ownership
  and address policy are durable independently of adapter lookup. Registry-first
  local registration returns a durable address before driver attachment. A wrong
  node returns the canonical home for caller retry, with no local allocation or
  new forwarding protocol. HRC reserves runtime identity before attachment but
  materializes the runtime row only after real participant descriptor and broker facts exist.
  An unprepared IDENTITY_MINTED attempt is non-runnable, consumes no establishment
  retries and survives daemon loss. Attachment atomically freezes validated
  `ParticipantBrokerDescriptor`
  and environment, transitions to PREPARED and arms existing durable work;
  duplicate attachment does not reset a running or exhausted retry budget.
  Replacement-intent work remains independently discoverable. ASP preparation
  is optional post-join driver configuration, not authority to register. It
  returns only the participant descriptor and optional dispatch environment,
  never HRC runtime handles or lifecycle policy. Existing descriptor structure,
  identity and hash checks apply at attachment without new security requirements.
  Broker ownership must agree with the resolved join direction; external process
  ownership is the direct default, and managed ownership requires HRC's committed
  launch record and host-aware guard, never a class name alone.
  Three boundaries remain distinct: freeze the validated ASP result before
  hosting; persist HRC hosting intent including its selected lifecycle policy
  before realization, then persist actual or rediscovered leases; finally compose
  and atomically persist the complete dispatch before scheduling the first ensure.
  HRC alone constructs runtime overlays from actual leases and composes resource
  environment values under existing environment ownership and locked-env checks.
  The broker pane is never an operator presentation pane. Ensure retries use the
  exact frozen tuple; policy reload or missing resources cannot edit it under the
  same start attempt. Participant-served join spawns no broker through HRC; any
  required HRC presentation resource is independently realized or refused without
  fabricating ownership. A controlled ASP adapter proves both joins through the
  installed Phase 2 path; native Phase 3 and direct-lowering proofs remain separate.
  Hosted and participant-served brokers share the registration lifecycle with
  declared address and continuity policies. Host lifecycle ownership is a declared
  class policy, never inferred from broker join; HRC hosting a broker conveys only
  broker resource ownership. Under continuity key-scoped, a permanent key retains
  its scope, host session, and generation across native host restart and observer
  replacement. Under continuity host-incarnation, one selected address binds at
  most one live host incarnation and one host incarnation binds at most one address,
  enforced by durable constraints. A selected address is established in the
  collective binding registry through the existing registry-first summon-authority
  path before any local reservation, session, or binding exists; resolving a home
  is insufficient, and a refused, unreachable, bound-elsewhere, or
  designation-mismatched establishment writes nothing locally. An address
  reservation is independent of any incarnation, is not free in any runtime or
  binding state, transfers rather than releases at succession, survives operator
  eviction, and is freed only by explicit attributed release. Mail to an absent
  bound host remains pending and never births a substitute. processToken is opaque
  compatibility input ignored for joining, not persisted HRC identity, an HRC
  comparison key, or replacement authority. Registration remains durable when observation is
  unavailable. Each durable attempt has one invocation identity. Identity
  installation, hello, resident
  invocation establishment, attach confirmation, and activation are distinct.
  HRC persists the immutable start request and dispatch options before requesting
  resident establishment. Broker-owned durable start receipts serialize matching
  retries, refuse conflicting reuse, and record starting before driver side
  effects. Lost replies never repeat driver.start; uncertain restart or a started
  receipt without its resident invocation remains indeterminate until broker or
  adapter evidence reconciles or retires the attempt. Hosted creation persists
  identity, paths, command, and credential before spawn; serialized rediscovery
  bypasses credential rewrites and duplicate window creation, and an unverifiable
  incumbent blocks. Live or pending attempts cannot be superseded by ordinary
  registration. An epoch is a concurrency precondition, not replacement authority.
  Successor admission requires an absorbing prior disposition and broker-owned
  irreversible retirement or verified prior writer death. Retirement closes every
  path to new native writes before acknowledgement. Retry exhaustion, transport
  loss, and an empty unresolved-write store do not prove retirement. Unresolved
  input remains independently broker-fenced across replacement without resend,
  cancellation, inferred outcome, or manufactured turn failure. Epochs fence
  control and outbox work, not validated historical evidence. Writer evidence
  answers only for its declared host or bridge subject; bridge evidence never
  authorizes host succession, host evidence is not required for bridge replacement,
  HRC may inspect only a process it launched and owns, and external native evidence
  remains adapter-owned. Write-path retirement, writer liveness, and prior-event
  recovery are independent three-valued facts, with unknown holding admission.
  Evidence-backed retirement or death moves a nonabsorbing displaced attempt to
  ABANDONED with its reason, including after activation; TERMINAL remains exclusive
  to projection of a producer-authored terminal. Attempt abandonment never implies
  recovery abandonment. A same-host bridge replacement preserves scope, session,
  generation, and runtime, advances attempt, invocation, bridge instance, and attach
  epoch, and emits no resume; late validated evidence remains attributed to its old
  invocation and cannot close or mutate the current run, obligation, or continuation.
  Host succession compares against the observed predecessor. A first transaction
  commits the evidence-backed prior disposition and moves an old host binding to
  retiring while preserving pending replacement work and the reservation; the
  resulting no-successor state is valid and recoverable. After the independent
  retirement, absorbing-state, and recovery gates pass, a second transaction rechecks
  the gates and predecessor fences and atomically commits final binding retirement,
  the successor session and work, reservation transfer, and staged replay fences.
  Neither allocation transaction rewrites an absorbing attempt, and the address is
  never observably free. Activation requires
  the current attempt's confirmed attach and commits its binding classification
  once. Unknown continuity evidence preserves known evidence and emits no resume;
  first known evidence attaches, unchanged known evidence replaces, and changed
  known evidence resumes under the same session. Replay remains durable and
  unacknowledged until projected; successor replay is released only after
  activation and prior recovery reconciled or explicitly abandoned with a reason.
  Recovery projects committed prior-invocation evidence without restoring its
  control authority, repairing its ledger, or mutating retention acknowledgements.
  A recovered producer terminal is distinct from broker loss with unknown native
  outcome. Automatic continuation reuse at host succession respects explicit clear
  barriers and disabled reuse using HRC's own records, not an adapter verdict.
  The selected continuation and selection reason are durable and returned to the
  participant. Attachment must express that selection in the existing continuation
  field before descriptor freeze; mismatch cannot silently become a fresh start.
  A newer clearing barrier is rechecked before freeze. Resume request states
  not_requested, requested, unsupported and indeterminate are persisted separately
  from carried history; joining or broker hello never proves native resume success.
  Unsupported resume preserves history and pending input until explicit disposition.
  Explicit historical resume is not the automatic selector. External process-fate law follows durable lifecycle ownership, while
  acknowledgement ownership follows the controlling client. Legacy observers
  without native lifetime capability remain not-activated and emit no invented
  resume. A managed host launch persists a unique non-secret launchId before spawn
  and adopts only the returning registration correlated to that launch record;
  launchId grants no permission and changes no authentication. Save and exit are
  separate managed-host readbacks and may each be unknown. Graceful stop refuses or
  remains indeterminate rather than forcing after failed, refused, missing, or timed
  out save evidence; forced closure is explicit per call and reports data-loss
  knowledge truthfully. Managed host lifecycle is refused until every runtime
  lifecycle reader is host-aware, and absence of the external marker never alone
  authorizes process disposal, reaping, or termination. Queue and steer remain the
  federation control contract; interrupt and preempt are not advertised, and
  internal children mint no HRC seat or satisfy the parent's obligation. EPR grant
  behavior remains unchanged. Revision 7 is operator-authorized implementation work, not
  implementation acceptance and does not accept final-tail loss; Phase 5 completeness requires its separately verified
  retention and catch-up contract without dependence on a future user resume.
  External attachment accepts only `ParticipantBrokerDescriptor`; HRC neither
  accepts nor translates an `agent-runtime-profile/v1` `BrokerExecutionProfile`.
  Legacy `prepared_profile_json` reconnect is drained or retired before v2
  cutover. HRC B precedes ASP B, and main aspd remains on ASP A until that
  coordinated cutover.
