required_tests:
  - T-08344 adapter seam rejects unknown adapters foreign identity hash mismatches ownership mismatches and adapter runtime or lifecycle-policy fields before effects
  - T-08344 hosted presentation discriminator persists actual HRC lease IDs and selected lifecycle policy before ensure while crash retries preserve token bytes full dispatch and ensure digest and missing leases block
  - T-08344 both join directions register establish a resident invocation attach terminate and resume through the generic path
  - T-08344 C.5.1 concurrent duplicate lost-response request-conflict and crash-boundary receipt gates preserve at-most-once driver start and truthful indeterminate outcomes
  - T-08344 C.5.2 spawn-before-completion recovery preserves credential bytes and exactly one broker process and window
  - T-08344 retirement discriminator rejects old-owner writes before and after successor claim completion while unresolved input remains independently protected
  - T-08344 activation and recovery gates preserve same-session identity attachment-before-resume exactly-once publication durable staged replay and historical-control isolation
  - T-08344 E.8 direct headless and interactive modes work with ASPC unavailable and no compile RPC preserving drivers resources and continuation
  - T-08344 permanent-address legacy-observer alias and unchanged EPR regression gates
