required_tests:
  - T-08504 classless join persists before attachment with no admit call or file prerequisite and legacy keyed rows survive migration
  - T-08504 unprepared boot consumes no retries and attachment atomically arms establishment without duplicate retry-budget resets
  - T-08504 HRC continuation selection is exposed and bound into the frozen request with mismatch clear-barrier and unsupported-resume proof
  - T-08504 wrong-home redirect and same-request retry allocate one canonical owner only
  - T-08344 post-join profile validation rejects foreign identity hash mismatches ownership mismatches and runtime or lifecycle-policy fields before effects
  - T-08344 participant presentation discriminator persists actual HRC lease IDs and selected lifecycle policy before ensure while crash retries preserve token bytes full dispatch and ensure digest and missing leases block
  - T-08344 participant-served registrations establish a resident invocation attach terminate and resume through the generic path
  - T-08344 C.5.1 concurrent duplicate lost-response request-conflict and crash-boundary receipt gates preserve at-most-once driver start and truthful indeterminate outcomes
  - T-08344 C.5.2 spawn-before-completion recovery preserves credential bytes and exactly one broker process and window
  - T-08344 retirement discriminator rejects old-owner writes before and after successor claim completion while unresolved input remains independently protected
  - T-08344 activation and recovery gates preserve same-session identity attachment-before-resume exactly-once publication durable staged replay and historical-control isolation
  - T-08344 permanent-address legacy-observer alias and unchanged EPR regression gates
  - T-08510 participant producer retirement seam validates both writer subjects every retirement truth-table cell and every prior-recovery value through the controlled reference adapter
  - T-08504 selected-address provisioning is registry-first reservation-aware and single-authority across refusal crash retry and two-node races
  - T-08504 bridge replacement and host succession preserve their distinct runtime session generation resume and writer-subject contracts
  - T-08504 live-but-retired and dead-without-terminal predecessors become evidence-backed ABANDONED without a synthetic TERMINAL or model completion
  - T-08504 replacement intent and TX-D then gated TX-6 crash recovery preserve the reservation candidate work and one successor without rewriting an absorbing attempt
  - T-08505 queue and steer use the ordinary participant broker contract and internal children mint no HRC seat
  - T-08507 managed launch adoption uses the precommitted launchId exactly once while host-aware lifecycle refusal and save exit readbacks preserve process ownership
  - T-08508 external-host regression proves no launch kill reap dispose or substitute birth after managed support lands
  - T-08504 existing keyed identities and EPR remain unchanged while generic pre-identity adapter admission is removed
last_verified:
  date: 2026-09-15
  evidence: Revision 7 records Lance operator direction and Astra functional resolutions of EN-12457; not Daedalus approval. T-08349 accepted at 0e5a0557 under its previous contract; T-08504 implementation and installed proof remain pending. Phase 5 completeness remains withheld.
reopen_when:
  - protocol join optional post-join preparation or the pre-hosting post-realization and pre-ensure persistence boundaries change
  - registration policy session identity or HRC versus adapter authority changes
  - resident-invocation receipt idempotency hosting rediscovery or uncertain-start recovery changes
  - successor admission irreversible retirement pending-input exclusion or epoch fencing changes
  - activation classification historical recovery replay release or acknowledgement ownership changes
  - EPR compatibility or legacy migration semantics change
  - final-tail retention and catch-up design is submitted for Phase 5 completeness verification
  - host lifecycle ownership host incarnation identity selected-address policy or launchId adoption changes
  - writer-evidence subject axes sufficiency process-inspection boundary or recovery independence changes
  - address reservation availability transfer or explicit-release semantics change
  - bridge replacement or host succession transaction and crash-recovery shape changes
  - managed stop readbacks host-aware lifecycle guard or queue and steer advertised class set changes
