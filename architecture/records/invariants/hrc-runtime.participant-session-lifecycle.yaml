reopen_when:
  - adapter registry admission preparation ownership or the pre-hosting post-realization and pre-ensure persistence boundaries change
  - registration policy session identity or HRC versus adapter authority changes
  - resident-invocation receipt idempotency hosting rediscovery or uncertain-start recovery changes
  - successor admission irreversible retirement pending-input exclusion or epoch fencing changes
  - activation classification historical recovery replay release or acknowledgement ownership changes
  - EPR compatibility direct-resource-loader independence or legacy migration semantics change
  - final-tail retention and catch-up design is submitted for Phase 5 completeness verification
  - host lifecycle ownership host incarnation identity selected-address policy or launchId adoption changes
  - writer-evidence subject axes sufficiency process-inspection boundary or recovery independence changes
  - address reservation availability transfer or explicit-release semantics change
  - bridge replacement or host succession transaction and crash-recovery shape changes
  - managed stop readbacks host-aware lifecycle guard or queue and steer advertised class set changes
