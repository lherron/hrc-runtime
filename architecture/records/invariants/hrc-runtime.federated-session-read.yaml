required_tests:
  - T-12362 annotations and sessions/get on a retired unbound scope default and false refuse session_home_pending; unix localOnly=true returns the existing local handler response; authenticated peer true refuses local_only_forbidden; ordinary peer reads remain local
  - crates/hrc-native/e2e/peer_events_page.py authenticated page, 200-row cap, bearer refusal, local-only cursor and fence checks
  - just architecture-records
  - T-10418 installed max3-to-svc taskboard resolve and timeline including a turn starting after attach, and local-seat regression gates
  - T-10418 unknown registry, missing or unreachable home, shadow continuity and retired-placement gap refusal gates
  - T-10418 authenticated peer create refusal with no session, registry or placement rows written
  - T-10418 sourceKind-less remote input and interrupt retain local-only refusals
