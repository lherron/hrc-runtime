last_verified: 2026-10-06 Spec rev 3 reviewed against source and active records; implementation, build, installation and live acceptance pending
reopen_when: Home authority routing, retirement or unknown-authority treatment, peer route admission, forwarding filters, home provenance, capability meaning, remote lookup completeness, observation versus control isolation, or consumer cursor behavior changes.
design_review: >
  2026-11-03 T-12432 r1 APPROVE on EN-44916 admits authenticated unscoped
  peer bounded-stream as receiving-node observation, retaining scoped routing
  and tail/runs scope admission. Source review covered peer authentication,
  local dispatch, existing unscoped page disclosure, bounded stream validation,
  replay and replacement fencing, and kernel wake/cursor separation.
  Implementation and installed acceptance remain unverified here; existing
  last_verified evidence is unchanged.
  2026-11-02 T-12362 extension APPROVE on EN-41778 includes sessions/get in
  the same explicit local observation boundary. Source verification covered
  the existing handler and store-only continuity, seat-state and metadata
  readers; implementation and live acceptance remain unverified here.
  2026-11-02 T-12362 APPROVE on EN-41761 adopts the explicit local-dispatch
  annotation observation exception. Source read covered dispatch admission,
  scope routing and retired authority, authenticated peer local dispatch,
  annotation validation and store reads, and embedded projector selection.
  Implementation and installed acceptance remain the requester's work;
  existing last_verified evidence is unchanged.
  T-12257 adopts the bounded per-peer observation amendment required by
  praesidium-kernel r1.6 section 2.3 and the taxonomy adoption step 0;
  existing scope-home routing and observation/control isolation remain intact.
  2026-10-31 T-12177 rev 2 APPROVE EN-39461 clarifies the separation of mobile
  session lookup from the explicit-node interrupt producer contract. Existing
  last_verified evidence is unchanged; no implementation or live gate was run.
