id: hrc-runtime.federated-session-read
kind: invariant
status: active
owner_project: hrc-runtime
scope: scope-home session resolution, event observation and run reads for ACP and mobile
predicate: >
  HRC alone owns federation routing and peer credentials for session observation.
  ScopeRef is the placement key; laneRef, hostSessionId and generation remain
  exact home-node filters and a hostSessionId-only request stays local. Home
  authority is resolved before scope-keyed continuity lookup, not inferred from
  a local session or runtime. Bound-local reads are local; bound-foreign reads
  forward to the named home. An unbound scope with no local placement row retains
  local read behavior. An unbound scope with a retired local placement row
  refuses retryably with 503 session_home_pending; retired local continuity is
  never served as current continuity. Unknown authority refuses retryably with
  503 session_home_unknown rather than found:false or empty local history. A
  missing or unreachable home peer refuses retryably with 503
  session_home_unreachable before stream headers. This routing is shared by
  sessions/get, sessions/metadata, resolve with create absent or false, and
  scope-filtered events/tail, events/bounded-stream and runs reads. Resolve with
  create true keeps its existing local summon and birth path. The authenticated
  peer resolve route admits exactly sessionRef and optional create false,
  refuses create true, summonIntent or runtimeIntent with 403 peer_read_only
  before any creation, and event/run peer routes are GET-only. Peer reads are
  localOnly and cannot forward a second hop. Resolve exposes homeNodeId and
  forwarded reads expose x-hrc-home-node. Home-ledger cursors and bounded relay
  behavior are governed by hrc-runtime.bounded-lifecycle-event-observation.
  Authenticated per-peer GET sessions/page, sessions/facets, events/page
  and unscoped events/bounded-stream reads are bounded node-local observation,
  not scope-home routing or fan-out. An unscoped peer bounded-stream follows
  only the receiving node's ledger with the local route's incarnation, exclusive
  sequence, follow validation and bounded admission; a scoped one keeps
  scope-home routing. Peer events/tail and runs still require scopeRef.
  Session index reads force nodes=local. The peer events/page route clamps
  valid limits to 200 rows and preserves the local route's required afterSeq,
  exclusive cursor, ledger-incarnation fence and covering-page response.
  Each peer answers only its own ledger; no peer-page or unscoped peer-follow
  request forwards to another node. Per-node projector observation creates no
  write or input authority.
  GET /v1/sessions/annotations and GET /v1/sessions/get on the local unix
  dispatch have an explicit node-local observation exception: only literal
  localOnly=true bypasses scope-home routing and uses the existing local
  handler with its scope, lane and filter validation and response shape.
  Annotations read this node's db.list_annotations; sessions/get reads its
  stored continuity, identity, generation, seat state, facts and metadata.
  These are explicit local observations, not claims of current home authority.
  Absent or false preserves home routing, including retired-placement refusal.
  Authenticated peers refuse literal localOnly=true on both GET routes with
  403 local_only_forbidden before internal local dispatch; ordinary forwarded
  reads remain unchanged.
  This exception grants no write or home-binding authority and changes no
  other route.
  ACP remote timeline and history admission and per-row capabilities depend on
  HRC's federatedSessionRead declaration; ACP and iOS gain no peer-probe or
  credential authority. Read-only session lookup uses client sessionRef scope
  and lane on a local miss and checks the returned hostSessionId against the
  requested generation's host identity. It does not depend on runtime presence.
  This remote lookup is confined to timeline and history; input and interrupt
  retain their local-only session lookup regardless of caller sourceKind. The
  separate explicit-node POST /v1/interrupt forwarding door is governed by
  producer contract hrc-runtime.federated-input-interrupt and gains no authority
  from federatedSessionRead or this remote session lookup. Remote
  snapshot last-event and latest-run reads use the exact scope, lane, host and
  generation filters on the home. All timeline event pages and follows include
  scope and lane. ACP exposes home_unreachable as a retryable timeline error
  and preserves ledger_replaced handling. Updated iOS gates timeline and history
  on their declared capabilities and sends sessionRef for remote reads; older
  clients remain safely refusing. Mobile remote input, literal input,
  interrupt, answerPrompt and diagnostics remain disabled. Federation observation carries
  lifecycle facts only; agent-message delivery remains on the shared wrkq ledger.
