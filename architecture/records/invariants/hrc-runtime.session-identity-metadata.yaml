  - architecture/records/invariants/hrc-runtime.participant-session-lifecycle.yaml
  - architecture/records/invariants/hrc-runtime.aspd-prepared-execution-release.yaml
  - architecture/records/invariants/hrc-runtime.viewer-presentation-sidecar.yaml
  - architecture/records/invariants/hrc-runtime.mobile-session-index.yaml
  - packages/hrc-store-sqlite/src/repositories/session-repositories.ts
  - packages/hrc-server/src/participant-host-registration.ts
  - packages/hrc-server/src/participant-attach-handlers.ts
  - packages/hrc-server/src/aspd-headless-start.ts
required_tests:
  - T-10148 shared-parser backfill and continuity creation fixtures agree, identity columns have no NULL agent_id and fleet unparsed counts are reported
  - T-10148 HRC-received scope identity parser sweep covers all four repos and lists justified human-input exceptions
  - T-10148 same-plan-hash metadata refresh, absent versus empty launch sets, omitted-key deletion, source precedence and invalid-key soft rejection
  - T-10148 prefix collisions, 129-byte keys, 65-character segments, value and distinct-key limits are enforced on launch and atomic API writes
  - T-10148 installed multi-project viewer, rotation persistence, retitle and actual slugger POST compatibility E2E saves an artifact and reads matching changed events
  - T-10148 metadata reads extend t07594-side-effect-free-reads without lifecycle mutation or probes
last_verified: 2026-10-03 revision 3 design reviewed against source and Lance overrides; implementation, migration and installed acceptance pending
reopen_when: Continuity identity storage, parser ownership, historical identity absence, wire coverage, metadata grammar or limits, registered keys, source precedence, cosmetic versus lifecycle authority, last-writer launch semantics, envelope/plan placement, home-node writes, title migration or shim compatibility, event atomicity, or read side effects change.
