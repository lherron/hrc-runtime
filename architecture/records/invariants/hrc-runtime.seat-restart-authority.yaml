id: hrc-runtime.seat-restart-authority
kind: invariant
status: active
owner_project: hrc-runtime
scope: module policy, HRC restart outcomes, and client cutover for T-14486
predicate: >
  The node-local seat-restart module owns caller policy and the handoff and
  recap prompts. HRC owns restart admission, the continuity fence, rotation,
  launch and delivery. Only the module principal and scope are admitted to the
  two module doors. HRC records onBehalfOf as attribution supplied by the
  module. The local kernel operator caller shape is attribution under the
  host-user trust boundary. The credential-bound self-restart door retains its
  own authority and HRC handoff semantics.
  A turn-end arm binds the active host and generation to the observed runtime,
  invocation and turn, with at most one intent per host across both sources.
  Only that turn's committed, non-retained terminal claims it, once, including
  a terminal that landed before insertion. HRC owns armed and executing state
  and the kernel projects it. Armed intents are volatile on daemon loss.
  The module doors answer with the outcome and never answer pending. The work
  runs to completion even if the caller's connection drops, and a repeat or
  reconcile of a running key waits for its outcome. A first turn joins priming when the
  restart births the successor, and is otherwise submitted as an ordinary
  turn; it is never dropped.
  Force-new-session and keyed cold restart replay a stored outcome by key, and
  read-only reconcile never starts or rotates a seat. Launching a committed
  successor does not rotate it. ACP never exposes a call whose outcome it did
  not read to the installed phone as a success or a definite refusal.
  An HRC crash inside a request gets no special handling.
authority: >
  Lance's 2026-11-24 restart policy, ACP gateway boundary, exclusion of armed
  intent persistence, his 2026-11-24 ruling that the doors answer with the
  outcome and never pending (wrkq:T-14496), and his ruling that stopped review and removed
  crash-recovery handling ("'An hrc crash' is not something we should be
  building thousands of workarounds for") in wrkq:T-14486. The build spec is
  r9. Daedalus's approval of r8 (EN-60829) is superseded where r8 exceeded r9.
