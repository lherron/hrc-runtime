id: hrc-runtime.seat-retirement-authority
kind: invariant
status: active
owner_project: hrc-runtime
scope: policy and runtime authority for automatic seat retirement after the T-14454 cutover
predicate: >
  The node-local Praesidium seat-retirement module owns seat eligibility,
  triggers and idle windows. HRC owns runtime admission, protection checks,
  the stopping transition and process teardown. The kernel's unkeyed
  runtime.retire operation reaches only the runtime's home HRC. HRC admits
  only the seat-retirement module principal and scope on POST
  /v1/runtimes/retire. The owner checks readiness, active and nonterminal
  runs, protected input, app scope, external lifecycle ownership and
  read-write clients. It compares the expected runtime activity timestamp
  as an instant and closes to admission before terminating with the
  continuation kept. The supervisor's attach count is checked at decision
  time. Attach admission may race that check. Operator termination retains
  its own authority and continuation disposition.
  The runtime document carries the activity timestamp from the owner runtime
  row. The module uses it for idle calculation and the owner precondition.
  Completed-task eligibility uses an owner read at decision time. A missing
  task projection does not suppress discovery of completion from the owner.
  Trigger, rule and policy revision are diagnostic fields. The retire door
  does not interpret them as policy.
authority: >
  Lance's 2026-11-23 directive in wrkq:T-14454 and Daedalus approval of
  specification r4, task etag 7, in reply to EN-60357.
source:
  - wrkq:T-14454
  - architecture/records/invariants/hrc-runtime.self-brokered-seat-launch.yaml
  - architecture/records/invariants/hrc-runtime.hrcpty-seat-supervision.yaml
  - architecture/records/invariants/hrc-runtime.operator-owner-authority.yaml
  - crates/hrc-store/src/presentation.rs
  - crates/hrc-native/src/server/turns/control.rs
required_tests:
  - T-14454 r4 projection exit check and overlap rule replay from both retirement sources
  - T-14454 r4 isolated retire-door guards and module authority acceptance
  - T-14454 r4 live module retirement with continuation kept and policy edit without restart
last_verified: Pending implementation and rollout evidence.
reopen_when: Module or HRC authority, locality, runtime activity source, completion authority, guards, continuation disposition or retirement request semantics change.
supersedes: []
superseded_by: []
design_review: >
  2026-11-23 review of T-14454 r4 against the runtime projection, owner
  reads, sweep logs, admission and supervisor paths.
