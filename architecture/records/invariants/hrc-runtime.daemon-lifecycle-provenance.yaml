id: hrc-runtime.daemon-lifecycle-provenance
kind: invariant
status: active
owner_project: hrc-runtime
scope: local daemon lifecycle provenance and production lifecycle project publication
predicate: >
  The daemon integration (native owner serve or Bun hrc server serve with
  lifecycleProvenance) records its own lifecycle locally, including when run
  against private scratch roots; embedded Bun servers without
  lifecycleProvenance write no server facts.
  Server facts are the server category kinds server.shutting_down,
  server.stopped, server.previous_exit_unattributed and server.started under the
  non-seat sentinels hostSessionId hrc-server, scopeRef server:hrc, lane main,
  generation 0. A graceful shutdown appends server.shutting_down with the
  verified lifecycle grant (requestId, requestedBy, callerKind, originNode,
  reason, action, flags) the daemon itself authorized, or an explicit null grant
  with an ungranted marker and a server.lifecycle.ungranted_shutdown WARN for an
  ungranted graceful shutdown, before any teardown; it is initiation evidence
  only. stop() records a teardownIncomplete
  reason at every continue-past-failure site before the store closes, unlinks
  the socket and flushes metrics before db.close(), and appends server.stopped
  (the same grant attribution plus shuttingDownHrcSeq) only when that record is empty and the
  foreground stop deadline has not expired; otherwise it writes a
  server.stop.incomplete log line and no stopped fact. server.stopped attests
  every teardown step before the store closed and nothing after it; lock release
  is outside the attestation and keeps its existing failure behavior. On boot, a
  latest local predecessor fact of server.started or server.shutting_down yields
  exactly one server.previous_exit_unattributed before server.started {pid,
  release, sourceCommit, storeSchema, processStartedAt, previousPid?}. A
  separate cursor-backed producer projects only local non-retained
  server.stopped and server.started to project hrc-runtime as agent:hrc, keyed
  server:<nodeId>:<ledgerIncarnationId>:<hrcSeq>. Lifecycle project publication
  requires both the current daemon's validated atomic release provenance and
  runtime/state roots resolving to $HOME/praesidium/var/run/hrc and
  $HOME/praesidium/var/state/hrc respectively. Existing paths are canonicalized
  so symlink aliases compare as the same roots. An atomic release alone does
  not authorize publication from private roots. Excluded native daemons skip
  lifecycle project posts and advance their lifecycle publication cursor;
  the Bun integration applies the same eligibility boundary to its lifecycle
  publisher. Eligible local non-retained facts advance the cursor only after
  an accepted post. This boundary does not suppress local lifecycle facts or
  alter session project publication. Status lastRestart derives solely from the local
  ledger: the latest server.started plus the immediately preceding
  server.stopped attribution (its grant, or a pre-contract predecessor's flat
  attribution), null attribution otherwise. Lifecycle refusals are log lines,
  never server facts.
