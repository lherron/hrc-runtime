id: hrc-runtime.daemon-lifecycle-provenance
kind: invariant
status: active
owner_project: hrc-runtime
scope: durable provenance of the production HRC daemon's own start and stop
predicate: >
  Only the production daemon integration (hrc server serve, lifecycleProvenance)
  records its own lifecycle; embedded and test servers write no server facts.
  Server facts are the server category kinds server.shutting_down,
  server.stopped, server.previous_exit_unattributed and server.started under the
  non-seat sentinels hostSessionId hrc-server, scopeRef server:hrc, lane main,
  generation 0. A graceful shutdown appends server.shutting_down with the full
  shutdown-intent attribution, missing values as explicit null, before any
  teardown; it is initiation evidence only. stop() records a teardownIncomplete
  reason at every continue-past-failure site before the store closes, unlinks
  the socket and flushes metrics before db.close(), and appends server.stopped
  (attribution plus shuttingDownHrcSeq) only when that record is empty and the
  foreground stop deadline has not expired; otherwise it writes a
  server.stop.incomplete log line and no stopped fact. server.stopped attests
  every teardown step before the store closed and nothing after it; lock release
  is outside the attestation and keeps its existing failure behavior. On boot, a
  latest local predecessor fact of server.started or server.shutting_down yields
  exactly one server.previous_exit_unattributed before server.started {pid,
  release, sourceCommit, storeSchema, processStartedAt, previousPid?}. A
  separate cursor-backed producer projects only local non-retained
  server.stopped and server.started to project hrc-runtime as agent:hrc, keyed
  server:<nodeId>:<ledgerIncarnationId>:<hrcSeq>, and advances its cursor only
  after an accepted post. Status lastRestart derives solely from the local
  ledger: the latest server.started plus the immediately preceding
  server.stopped attribution, null attribution otherwise.
