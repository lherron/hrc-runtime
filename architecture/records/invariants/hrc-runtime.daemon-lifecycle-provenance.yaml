last_verified: 2026-11-06 T-12677 source-built native daemon acceptance (four release/root cases, two boots each, local facts retained, excluded cursor drained, production-shaped start/stop/start published); source Bun scratch acceptance retained local facts with no lifecycle posts; installed activation forbidden by assignment. Earlier lifecycle grant/stop evidence remains T-09861, 2026-09-28.
reopen_when: The lifecycle grant shape or its authorization source, the stop() teardown order, the continue-past-failure site set, the stopped attestation boundary, boot classification, the sentinel envelope, the production publication eligibility boundary or canonical owner roots, the timeline projection key or cursor rule, or the lastRestart derivation changes.
