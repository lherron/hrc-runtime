id: hrc-runtime.bounded-lifecycle-event-observation
kind: invariant
status: active
owner_project: hrc-runtime
scope: canonical lifecycle-event tail and bounded replay/live observation surfaces
predicate: >
  HRC owns the lifecycle ledger incarnation and canonical event envelope. Its
  bounded tail returns the selected ascending page, global head, and incarnation
  from one transaction. An exclusive-before reverse page requires its expected
  incarnation, rejects replacement with cursor_invalid and no events, applies
  exact host-session and generation filters before its descending limit-plus-one
  read, and reverses only the admitted page to chronological order. Existing
  head callers that omit the reverse cursor retain their behavior. Its bounded
  follow stream requires an expected incarnation plus exclusive sequence,
  atomically admits and pins that ledger incarnation, admits no
  replacement-ledger event, and orders advisory ready, explicit gap, and
  canonical event records. Replay, seam, and live admission remain within fixed
  row and serialized-byte ceilings and are pulled through a one-record transport
  handoff. Ready is not resumable progress; only a fully received event or gap
  advances a consumer cursor. A scope-home federation relay preserves the home
  ledger incarnation, exact filters, event and gap records, row and serialized
  byte ceilings, and a pull-driven one-record handoff. Connecting and receiving
  headers has a ten-second bound; after headers there is no whole-body timeout.
  A fifteen-second idle bound runs only while a peer read is outstanding, never
  while downstream backpressure withholds reads. Keepalive newlines pass through.
  A relayed ledger_replaced is terminal and closes without another record.
  Otherwise peer disconnect or clean close, outstanding-read idle expiry,
  malformed data or oversize data emits exactly one terminal home_unreachable
  control with homeNodeId, retryable true and reason disconnected, idle_timeout,
  malformed or oversize. Neither terminal advances a cursor; reconnection uses
  the last fully received event or gap and its home-ledger incarnation. Client
  abort cancels the peer fetch. Forwarded tail bodies have a page byte ceiling;
  overflow refuses with 502 session_home_malformed. Home routing and refusals
  are owned by hrc-runtime.federated-session-read; this relay does not replicate
  a ledger or deliver agent messages. Daemon lifecycle facts (category server)
  ride the same envelope under the non-seat sentinels hostSessionId hrc-server, scopeRef
  server:hrc, lane main, generation 0, so they appear only to unfiltered or
  explicit scopeRef=server:hrc reads; their meaning is owned by
  hrc-runtime.daemon-lifecycle-provenance. This observation contract is distinct
  from and does not amend hrc-runtime.acp-event-bridge.
