required_tests:
  - just architecture-records
  - bounded tail query-plan and one-transaction incarnation/head/page gate
  - exclusive-before boundary, limit-one, filter-before-limit, generation isolation, and limit-plus-one materialization gates
  - bounded replay, live-seam, slow-reader, and event-oversize admission gates
  - disconnect-after-ready resume gate
  - ledger replacement before admission and during a pinned stream gates
  - T-10418 installed peer failure before headers and mid-follow, cursor resume, malformed and oversize relay refusal gates
  - T-10418 healthy downstream paused over thirty seconds, bounded relay handoff and exactly one ledger-replacement terminal gates
  - bun test packages/hrc-server/src/__tests__/t08137-daemon-lifecycle-provenance.test.ts
last_verified: 2026-10-06 T-10418 Spec rev 3 reviewed against source and active records; relay implementation and installed acceptance pending; prior local-stream implementation gates remain pending evidence
reopen_when: The lifecycle envelope, ledger incarnation authority, forward or reverse cursor fence, exact-filter ordering, stream ordering, admission bounds, relay timeout or backpressure behavior, terminal control semantics, or replacement behavior changes.
