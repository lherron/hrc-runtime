id: hrc-runtime.mobile-exact-scope-provisioning
kind: invariant
status: active
owner_project: hrc-runtime
scope: HRC-owned mobile exact-scope placement and federated provisioning
predicate: >
  Mobile exact-scope provisioning is one implicit reject-on-occupied START with
  no inbound host session id and a required durable idempotency key. Registry
  binding remains authoritative for an established scope. For a virgin scope,
  origin and receiver derive one home in this order: exact pin, exact home,
  reserved-family home, explicit typed provision.node directive, profile
  provisioning default, platform default. A declared roster base reserves its
  closed suffix namespace on that home, and profile validation rejects pins or
  homes for reserved members. An explicit node directive is admissible only
  when no placement declaration applies and is validated at both origin and
  receiver against the federation registry and the receiver's own profile;
  conflicts are typed refusals before mutation. No placement is inferred from
  caller identity, transport, connection, or environment. A remote home is
  invoked only through the authenticated, capability-advertised exactStart peer
  verb, whose receiver independently validates retirement, authority, binding,
  placement, and materialization capability before mutation and localizes
  runtime intent. On the authoritative home, exact and suffix claim/start share
  the same roster:<agentId>:<projectId> mutex and FREE predicate, so canonical
  exact names overlapping suffix members cannot claim one continuity
  concurrently. A new exact key either atomically rotates or mints a fresh
  successor, records its canonical request hash, and registers start before
  releasing the mutex, or returns session_scope_occupied without mutation.
  Identical retries converge; conflicting replays fail before intent mutation;
  superseded claims never start archived predecessors. Retryable peer failure
  is synchronous runtime_unavailable and does not use the message outbox.
authority: Lance / wrkq:T-07398
source:
  - hrcchat#19456
  - hrcchat#20022
  - wrkq:T-07302
  - wrkq:T-07398
  - packages/hrc-server/src/scope-claim-core.ts
  - packages/hrc-server/src/exact-claim.ts
  - packages/hrc-server/src/roster-claim.ts
  - packages/hrc-server/src/federation/exact-start-client.ts
required_tests:
  - just verify
  - wrkq:T-07302 exact/suffix overlap tests in both winner orders and after restart
  - wrkq:T-07398 reserved-family placement parity across exact, dm, and suffix doors
  - wrkq:T-07398 origin and receiver directive validation, conflict, and no-mutation tests
  - live multi-node exactStart placement, refusal, replay, and cleanup proof
  - live multi-node explicit node directive and declared-placement conflict proof
last_verified: 2026-08-21
reopen_when: >
  Exact-start occupancy, shared mutex or FREE semantics, idempotency ownership,
  peer exactStart authority, placement precedence, the reserved roster suffix
  set, explicit provision directive admission, mobile suffix-versus-exact
  selection, or exact placement routing changes.
