id: hrc-runtime.mobile-exact-scope-provisioning
kind: invariant
status: active
owner_project: hrc-runtime
scope: HRC-owned mobile exact-scope placement and federated provisioning
predicate: >
  Mobile exact-scope provisioning is one implicit reject-on-occupied START with
  no inbound host session id and a required durable idempotency key. Registry
  binding remains authoritative for an established scope. For a virgin scope,
  origin and receiver derive one home in this order: exact pin, exact home,
  reserved-family home, explicit typed provision.node directive, profile
  provisioning default, platform default. For an IMPLICIT mail-kicker birth
  only, when every preceding placement input is silent and the target remains
  virgin, the registry host may replace the local platform default with one
  persisted tier-5 birth designation. It derives that designation itself from
  wrkq's globally earliest reply-required envelope for the target and one
  registry consult of that envelope's scoped sender: a bound sender contributes
  its binding home and a retired sender its immutable retired home. The first
  designation is recorded before response and every later ask returns it
  unchanged. Only its home may establish with sender-derived provenance;
  non-homing kickers finish without starting. Every higher-precedence
  establishment remains admissible and atomically supersedes a live
  designation. No designation is recorded for no birth envelope or an absent or
  unbound sender, and inability to consult wrkq or the registry is a typed
  retryable refusal with no local fallback. A declared roster base reserves its
  closed suffix namespace on that home, and profile validation rejects pins or
  homes for reserved members. An explicit node directive is admissible only
  when no placement declaration applies and is validated at both origin and
  receiver against the federation registry and the receiver's own profile;
  conflicts are typed refusals before mutation. No placement is inferred from
  ambient caller identity, transport, connection, or environment; the mail
  default is derived only by the registry host from the authoritative ledger
  envelope and registry state. A remote home is invoked only through the
  authenticated, capability-advertised exactStart peer verb, whose receiver
  independently validates retirement, authority, binding, placement, and
  materialization capability before mutation and localizes runtime intent. On
  the authoritative home, exact and suffix claim/start share the same
  roster:<agentId>:<projectId> mutex and FREE predicate, so canonical exact names
  overlapping suffix members cannot claim one continuity concurrently. A new
  exact key either atomically rotates or mints a fresh successor, records its
  canonical request hash, and registers start before releasing the mutex, or
  returns session_scope_occupied without mutation. Identical retries converge;
  conflicting replays fail before intent mutation; superseded claims never
  start archived predecessors. Retryable peer failure is synchronous
  runtime_unavailable and does not use the message outbox.
authority: Lance / wrkq:T-07398 / wrkq:T-07655
