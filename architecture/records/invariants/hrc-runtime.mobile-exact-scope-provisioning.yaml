id: hrc-runtime.mobile-exact-scope-provisioning
kind: invariant
status: active
owner_project: hrc-runtime
scope: HRC-owned mobile exact-scope placement and federated provisioning
predicate: >
  Mobile exact-scope provisioning is one implicit reject-on-occupied START with
  no inbound host session id and a required durable idempotency key. Origin HRC
  resolves the exact home from policy and registry state; ACP supplies no node
  assertion. A remote home is invoked only through the authenticated,
  capability-advertised exactStart peer verb, whose receiver independently
  validates retirement, authority, binding, exact local policy, and
  materialization capability before mutation and localizes runtime intent. On
  the authoritative home, exact and suffix claim/start share the same
  roster:<agentId>:<projectId> mutex and FREE predicate, so canonical exact
  names overlapping suffix members cannot claim one continuity concurrently. A
  new exact key either atomically rotates or mints a fresh successor, records
  its canonical request hash, and registers start before releasing the mutex,
  or returns session_scope_occupied without mutation. Identical retries
  converge; conflicting replays fail before intent mutation; superseded claims
  never start archived predecessors. Retryable peer failure is synchronous
  runtime_unavailable and does not use the message outbox.
authority: hrcchat#19456
source:
  - hrcchat#19456
  - wrkq:T-07302
  - packages/hrc-server/src/scope-claim-core.ts
  - packages/hrc-server/src/exact-claim.ts
  - packages/hrc-server/src/roster-claim.ts
  - packages/hrc-server/src/federation/exact-start-client.ts
required_tests:
  - just verify
  - wrkq:T-07302 exact/suffix overlap tests in both winner orders and after restart
  - live multi-node exactStart placement, refusal, replay, and cleanup proof
last_verified: 2026-08-18
reopen_when: >
  Exact-start occupancy, shared mutex or FREE semantics, idempotency ownership,
  peer exactStart authority, mobile suffix-versus-exact selection, or exact
  placement routing changes.
