id: hrc-runtime.mobile-exact-scope-provisioning
kind: invariant
status: active
owner_project: hrc-runtime
scope: HRC-owned mobile exact-scope placement and federated provisioning
predicate: >
  Mobile exact-scope provisioning is one implicit reject-on-occupied START with
  no inbound host session id and a required durable idempotency key. Registry
  binding remains authoritative for an established scope. For a virgin scope,
  origin and receiver derive one home in this order: exact pin, exact home,
  reserved-family home, explicit typed provision.node directive, profile
  provisioning default, platform default. For an IMPLICIT mail-kicker birth
  only, when every preceding placement input is silent and the target remains
  virgin, the registry host may replace the local platform default with one
  persisted tier-5 birth designation. It derives that designation itself from
  wrkq's globally earliest reply-required envelope for the target and one
  registry consult of that envelope's scoped sender: a bound sender contributes
  its binding home and a retired sender its immutable retired home. When both
  lookups miss, T-13508 permits the registry host to observe the canonical
  sender scope in its own runtime store and on every configured peer through
  authenticated POST /v1/federation/observed-runtimes. That route reads only
  the receiving node's runtime store, without registry, policy or peer calls.
  Observation runs outside the registry database lock, with concurrent peer
  probes bounded to 1.5 seconds. Exactly one node reporting a ready or busy
  runtime contributes the default with provenance observed_runtime_node(sender).
  Unreachable, refusing and older peers contribute no positive observation;
  zero or multiple positive nodes return none. This is a designation input,
  not a participant-home registration, established binding or continuing claim
  of runtime liveness. The immediate transaction rechecks for a live
  designation before insertion, retaining the unique live designation per
  scope. The provenance-constraint migration preserves every designation row
  and the unique live index in one transaction. The first
  designation is recorded before response and every later ask returns it
  unchanged. Only its home may establish with sender-derived provenance;
  non-homing kickers finish without starting. Every higher-precedence
  establishment remains admissible and atomically supersedes a live
  designation. No designation is recorded for no birth envelope, an absent
  sender, or an unbound sender without one positive runtime-node observation;
  inability to consult wrkq or the registry is a typed
  retryable refusal with no local fallback. A declared roster base reserves its
  closed suffix namespace on that home, and profile validation rejects pins or
  homes for reserved members. An explicit node directive is admissible only
  when no placement declaration applies and is validated at both origin and
  receiver against the federation registry and the receiver's own profile;
  conflicts are typed refusals before mutation. No placement is inferred from
  ambient caller identity, transport, connection, or environment; the mail
  default is derived only by the registry host from the authoritative ledger
  envelope, registry state and the narrow sender-runtime observation above.
  A remote home is invoked only through the
  authenticated, capability-advertised exactStart peer verb, whose receiver
  independently validates retirement, authority, binding, placement, and
  materialization capability before mutation and localizes runtime intent. On
  the authoritative home, exact and suffix claim/start share the same
  roster:<agentId>:<projectId> mutex and FREE predicate, so canonical exact names
  overlapping suffix members cannot claim one continuity concurrently. A new
  exact key either atomically rotates or mints a fresh successor and records its
  canonical request hash, or returns session_scope_occupied without mutation.
  T-14472 adds opt-in launch-carried initial text to local claim-and-start. A
  nonempty initialPrompt carries on birth only with coldBirth promptMode
  append-to-priming. Without that opt-in the text binds the claim hash and the
  separate pinned-turn contract remains. The opted-in path takes the turn
  admission lease before replay or claim effects and holds it through routing.
  The continuity gate governs birth versus reuse. Only the call that births
  with the text and obtains the launch run's broker submission identity can
  report delivered true, including a same-key retry that births. A live reuse
  reports runtime_reused for that call and establishes no prior delivery
  outcome. The mobile consumer does not steer on runtime_reused. The
  self-brokered branch does not carry the prompt. A different door can win the
  birth of the claimed host, leaving the mobile text undelivered.
  Callers omitting materialization retain claim-and-start. The closed first_turn
  materialization token is part of the request hash; its localized intent,
  successor, continuity, and claim row commit as one fact for both mint and
  recycle, and the current awaiting-first-turn successor is occupied until its
  first real broker-dispatch input materializes the runtime. Creation returns
  awaiting_first_turn with a nullable runtime id rather than sending an empty
  turn. Replay validates the request hash and follows the active same-scope/lane
  prior-host-session chain back to the recorded successor only while every
  traversed generation has no claim row or the same idempotency key. A claim row
  under any other key proves supersession, including on an archived intermediate
  generation. Thus stale rotations preserve ownership, independently claimed
  descendants never alias, conflicting replays fail before intent mutation, and
  superseded claims never start archived predecessors. New federation callers
  forward and parse the nullable-runtime response; an old authoritative peer
  refuses the unknown materialization field before mutation, while old callers
  retain started responses. Retryable peer failure is synchronous
  runtime_unavailable and does not use the message outbox.
  Known gap, not enforced since the Rust cutover of 2026-10-26: the receiver
  half of the exactStart peer verb (independent preflight before mutation,
  runtime-intent localization, and home-side ownership of the claim and
  durable idempotency record). Today a remote-home exactStart between Rust nodes is
  a safe refusal before any mutation: the Rust peer listener advertises no
  exactStart capability and answers POST /v1/federation/exact-start with 404
  peer_upgrade_required, and the origin's claim_start refuses with 409
  stale_context reason peer_upgrade_required (retryable false) without sending
  the start. wrkq:T-11933 (native peer listener: home-side roster-start,
  exact-start and establish) restores the receiver.
