  - wrkq:T-07302 exact/suffix overlap tests in both winner orders and after restart
  - wrkq:T-07398 reserved-family placement parity across exact, dm, and suffix doors
  - wrkq:T-07398 origin and receiver directive validation, conflict, and no-mutation tests
  - wrkq:T-07655 birth-envelope ordering, FYI exclusion, and authority tests
  - wrkq:T-07655 designation idempotence, sender-transition, outage, and precedence tests
  - wrkq:T-07655 live multi-node designation, supersession, locate, and 24-hour soak proof
  - live multi-node exactStart placement, refusal, replay, and cleanup proof
  - live multi-node explicit node directive and declared-placement conflict proof
  - wrkq:T-08407 atomic deferred-intent, awaiting occupancy, full-chain replay ownership, federation compatibility, and first-turn materialization gates
last_verified: 2026-08-21 existing claim-and-start law; wrkq:T-08407 revision 4 amendment approved 2026-09-12 with implementation evidence pending
reopen_when: >
  Exact-start occupancy, awaiting-first-turn or FREE semantics, materialization
  mode, atomic intent ownership, idempotency lineage or claim-index ownership,
  peer exactStart authority or response compatibility, placement precedence, the
  reserved roster suffix set, explicit provision directive admission, mail
  birth-envelope selection, birth-designation authority or lifecycle,
  sender-derived provenance, mobile suffix-versus-exact selection, or exact
  placement routing changes.
