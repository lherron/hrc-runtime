id: hrc-runtime.quarantined-release-sweep-scan-coherence
kind: accepted_risk
status: active
owner_project: hrc-runtime
accepted_by: mable, HRC release-GC campaign owner
date: 2026-08-29
severity: medium
blast_radius: >
  macOS exposes no coherent system-wide userspace directory-fd snapshot. Under a
  non-adversarial local process population, an accidental authority transfer can
  still evade both complete bracketed scans without process-incarnation churn.
  A sweep may then delete one superseded quarantined release still reachable by
  one non-HRC process family, including a pre-existing foreign holder; its future
  relative opens fail with ENOENT until that family restarts. No live HRC runtime,
  release data required by one, or already-open file or mapping is lost or
  corrupted.
mitigation: >
  The sweep runs only in an operator-scheduled quiescence window with the daemon
  held down, owner-only pathname traversal from the release root, current-code
  maintenance and install exclusion, two privileged complete clean scans
  bracketed by an unchanged pid-and-start-time set, and fail-closed completeness
  and attestation checks.
  Refusals precede candidate mutation; each accepted candidate is marked before
  recursive permission tightening and owner-run unlink. Any observed instance of
  this residual triggers the kernel-atomic APFS volume and unmount design.
expiry: The release root uses a kernel-atomic emptiness test, or irreversible quarantined-release sweeping is retired.
review_trigger: Any process family is harmed by the residual; the local population becomes adversarial; macOS process or fd observation semantics change; or the accepted principal, consequence, or restart recovery bound changes.
reopen_when: The threat model, bracket protocol, process-incarnation key, holder principal set, harm bound, mitigation, or APFS filing trigger changes.
source:
  - wrkq:T-07686
